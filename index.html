<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>چت مستقیم P2P - اصلاح شده</title>
    <style>
        /* (استایل‌های قبلی را حفظ می‌کنیم) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root {
            --bg-primary: #0a0a0a; --bg-secondary: #1a1a1a; --bg-surface: #242424;
            --accent-purple: #8b5cf6; --accent-teal: #06b6d4; --accent-red: #ef4444;
            --accent-green: #10b981; --text-primary: #ffffff; --text-secondary: #a1a1aa;
            --border-color: #3f3f46; --gradient-accent: linear-gradient(135deg, #8b5cf6, #3b82f6);
        }
        body { background: linear-gradient(135deg, #0f0f0f, #1a1a1a, #2d1b69); color: var(--text-primary); min-height: 100vh; overflow: hidden; }
        
        /* نمایشگر پیشرفت آپلود */
        .upload-progress {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: var(--gradient-accent);
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }
        
        /* استایل ویدیو اصلاح شده */
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
            min-height: 250px;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transform: scaleX(-1); /* تصویر آینه‌ای */
        }
        
        /* استایل جدید برای نمایش عکس‌های دریافتی */
        .received-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            margin-top: 10px;
            border: 2px solid var(--accent-purple);
            cursor: pointer;
        }
        
        .received-image:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>
    <!-- (همان ساختار HTML قبلی) -->
    <div class="setup-page" id="setupPage">
        <div class="setup-container">
            <div class="setup-logo">📞</div>
            <h1 class="setup-title">چت مستقیم P2P</h1>
            
            <div class="input-group">
                <label class="input-label">شماره تماس مجازی من:</label>
                <input type="number" class="number-input" id="myCodeInput" 
                       placeholder="مثلاً: 123456789" maxlength="9" 
                       inputmode="numeric" pattern="[0-9]*">
            </div>
            
            <button class="btn btn-primary" onclick="setMyCode()" id="setCodeBtn">
                <span>✅</span>
                <span>تایید شماره من</span>
            </button>
            
            <div class="input-group" style="margin-top: 30px;">
                <label class="input-label">شماره تماس مجازی مخاطب را وارد کنید:</label>
                <input type="number" class="number-input" id="friendCodeInput" 
                       placeholder="شماره مخاطب را وارد کنید" inputmode="numeric">
            </div>
            
            <button class="btn btn-success" onclick="connectToFriend()" 
                    id="connectBtn" disabled>
                <span>📞</span>
                <span>برقراری تماس با مخاطب</span>
            </button>
        </div>
    </div>
    
    <div class="chat-page" id="chatPage">
        <!-- (همان ساختار چت قبلی) -->
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let dataConnection = null;
        let mediaConnection = null;
        let localStream = null;
        let remoteStream = null;
        let myCode = null;
        let friendCode = null;
        let currentMode = 'text';
        let isInCall = false;
        let dataChannel = null; // کانال داده WebRTC برای ارسال فایل
        let peerConnection = null; // اتصال WebRTC مستقیم

        // ==================== راه‌اندازی WebRTC مستقیم ====================
        async function setupWebRTC() {
            if (!dataConnection || !dataConnection.open) return;
            
            const configuration = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            };
            
            peerConnection = new RTCPeerConnection(configuration);
            
            // ایجاد کانال داده برای ارسال فایل
            dataChannel = peerConnection.createDataChannel('fileTransfer', {
                ordered: true,
                maxRetransmits: 3
            });
            
            setupDataChannel();
            
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannel();
            };
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate && dataConnection && dataConnection.open) {
                    dataConnection.send({
                        type: 'ice-candidate',
                        candidate: event.candidate
                    });
                }
            };
            
            peerConnection.ontrack = (event) => {
                console.log('ردیابی رسانه دریافت شد:', event.streams);
                if (event.streams && event.streams[0]) {
                    remoteStream = event.streams[0];
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    document.getElementById('remoteVideoOverlay').style.display = 'none';
                    
                    remoteVideo.onloadedmetadata = () => {
                        remoteVideo.play().catch(e => console.error('خطای پخش ویدیو:', e));
                    };
                }
            };
            
            // گوش دادن به کاندیدای ICE از مخاطب
            dataConnection.on('data', (data) => {
                if (data.type === 'ice-candidate' && peerConnection) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate))
                        .catch(e => console.error('خطای اضافه کردن ICE:', e));
                }
                if (data.type === 'offer' && peerConnection) {
                    handleOffer(data.offer);
                }
                if (data.type === 'answer' && peerConnection) {
                    handleAnswer(data.answer);
                }
            });
        }

        // ==================== تنظیم کانال داده برای فایل‌ها ====================
        function setupDataChannel() {
            dataChannel.onopen = () => {
                console.log('کانال داده برای ارسال فایل آماده است');
                showNotification('✅ کانال انتقال فایل آماده است');
            };
            
            dataChannel.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'file-start') {
                        console.log('شروع دریافت فایل:', data);
                        // آماده‌سازی برای دریافت فایل
                    }
                    else if (data.type === 'file-chunk') {
                        // دریافت قطعات فایل
                        handleFileChunk(data);
                    }
                    else if (data.type === 'file-end') {
                        // مونتاژ فایل نهایی
                        await assembleFile(data);
                    }
                } catch (err) {
                    console.error('خطا در دریافت فایل:', err);
                }
            };
            
            dataChannel.onerror = (error) => {
                console.error('خطای کانال داده:', error);
            };
        }

        // ==================== ارسال فایل به صورت قطعه‌قطعه ====================
        async function sendImage() {
            const input = document.getElementById('imageInput');
            if (!input.files[0] || !dataChannel || dataChannel.readyState !== 'open') {
                showNotification('کانال انتقال آماده نیست');
                return;
            }
            
            const file = input.files[0];
            const CHUNK_SIZE = 16 * 1024; // 16KB قطعات کوچک
            
            // نمایش پیشرفت
            const progressDiv = document.createElement('div');
            progressDiv.className = 'upload-progress';
            progressDiv.innerHTML = '<div class="progress-bar" id="uploadProgress"></div>';
            document.getElementById('imagePreview').appendChild(progressDiv);
            
            try {
                // ارسال اطلاعات اولیه فایل
                dataChannel.send(JSON.stringify({
                    type: 'file-start',
                    name: file.name,
                    size: file.size,
                    mimeType: file.type,
                    totalChunks: Math.ceil(file.size / CHUNK_SIZE)
                }));
                
                // خواندن و ارسال قطعات
                const reader = new FileReader();
                let offset = 0;
                let chunkIndex = 0;
                
                reader.onload = (e) => {
                    const chunk = e.target.result;
                    dataChannel.send(JSON.stringify({
                        type: 'file-chunk',
                        index: chunkIndex,
                        data: chunk,
                        totalChunks: Math.ceil(file.size / CHUNK_SIZE)
                    }));
                    
                    // به‌روزرسانی پیشرفت
                    const progress = ((chunkIndex + 1) / Math.ceil(file.size / CHUNK_SIZE)) * 100;
                    document.getElementById('uploadProgress').style.width = progress + '%';
                    
                    chunkIndex++;
                    offset += CHUNK_SIZE;
                    
                    if (offset < file.size) {
                        readNextChunk();
                    } else {
                        // پایان ارسال
                        dataChannel.send(JSON.stringify({
                            type: 'file-end',
                            name: file.name
                        }));
                        
                        addMessage(`✅ عکس "${file.name}" ارسال شد`, 'outgoing');
                        document.getElementById('imagePreview').innerHTML = '';
                        document.getElementById('sendImageBtn').disabled = true;
                        showNotification('عکس با موفقیت ارسال شد');
                    }
                };
                
                function readNextChunk() {
                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    reader.readAsDataURL(slice);
                }
                
                readNextChunk();
                
            } catch (err) {
                console.error('خطا در ارسال عکس:', err);
                showNotification('خطا در ارسال عکس');
            }
        }

        // ==================== مدیریت فایل دریافتی ====================
        async function assembleFile(fileInfo) {
            try {
                // ساخت لینک دانلود برای فایل دریافتی
                const receivedFile = fileInfo.chunks.join('');
                const img = document.createElement('img');
                img.src = receivedFile;
                img.className = 'received-image';
                img.alt = fileInfo.name;
                
                // اضافه کردن به پیام
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message incoming';
                messageDiv.innerHTML = `
                    <div>📷 عکس دریافت شده:</div>
                    ${img.outerHTML}
                    <div style="margin-top: 10px; font-size: 0.9rem; color: var(--text-secondary)">
                        ${fileInfo.name} (${formatBytes(fileInfo.size)})
                    </div>
                `;
                
                document.getElementById('messagesContainer').appendChild(messageDiv);
                
            } catch (err) {
                console.error('خطا در مونتاژ فایل:', err);
                addSystemMessage('⚠️ خطا در دریافت عکس');
            }
        }

        // ==================== تماس تصویری/صوتی با WebRTC مستقیم ====================
        async function startVideoCall() {
            if (!dataConnection || !dataConnection.open) {
                showNotification('ابتدا باید به مخاطب متصل شوید.');
                return;
            }
            
            try {
                // دریافت دسترسی به دوربین و میکروفن
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        frameRate: { ideal: 24 }
                    }
                });
                
                // نمایش ویدیوی محلی
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                document.getElementById('localVideoOverlay').style.display = 'none';
                
                // اضافه کردن ترک‌های رسانه به اتصال WebRTC
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                // ایجاد پیشنهاد تماس
                const offer = await peerConnection.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });
                
                await peerConnection.setLocalDescription(offer);
                
                // ارسال پیشنهاد به مخاطب
                dataConnection.send({
                    type: 'offer',
                    offer: offer
                });
                
                isInCall = true;
                showNotification('📞 در حال برقراری تماس ویدیویی...');
                
            } catch (err) {
                console.error('خطا در شروع تماس:', err);
                handleMediaError(err, 'دوربین');
            }
        }

        async function startAudioCall() {
            if (!dataConnection || !dataConnection.open) {
                showNotification('ابتدا باید به مخاطب متصل شوید.');
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                const offer = await peerConnection.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: false
                });
                
                await peerConnection.setLocalDescription(offer);
                dataConnection.send({ type: 'offer', offer: offer });
                
                isInCall = true;
                showNotification('🎙️ در حال برقراری تماس صوتی...');
                
            } catch (err) {
                console.error('خطا در شروع تماس صوتی:', err);
                handleMediaError(err, 'میکروفن');
            }
        }

        async function handleOffer(offer) {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                
                // دریافت دسترسی به رسانه (اگر نیاز باشد)
                if (offer.sdp.includes('video')) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({
                            audio: true,
                            video: true
                        });
                        const localVideo = document.getElementById('localVideo');
                        localVideo.srcObject = localStream;
                        document.getElementById('localVideoOverlay').style.display = 'none';
                    } catch (err) {
                        // اگر دوربین در دسترس نبود، فقط صدا
                        localStream = await navigator.mediaDevices.getUserMedia({
                            audio: true,
                            video: false
                        });
                    }
                } else {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: false
                    });
                }
                
                // اضافه کردن ترک‌ها
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                // ایجاد پاسخ
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                // ارسال پاسخ
                dataConnection.send({ type: 'answer', answer: answer });
                
                isInCall = true;
                showNotification('📞 تماس دریافتی برقرار شد');
                
            } catch (err) {
                console.error('خطا در پاسخ به تماس:', err);
            }
        }

        async function handleAnswer(answer) {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                showNotification('✅ تماس برقرار شد');
            } catch (err) {
                console.error('خطا در تنظیم پاسخ:', err);
            }
        }

        // ==================== توابع کمکی ====================
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 بایت';
            const k = 1024;
            const sizes = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
        }

        function handleMediaError(err, device) {
            console.error(`خطای ${device}:`, err);
            if (err.name === 'NotAllowedError') {
                showNotification(`دسترسی به ${device} رد شد. لطفاً در تنظیمات مرورگر مجوز دهید.`);
            } else if (err.name === 'NotFoundError') {
                showNotification(`${device} پیدا نشد.`);
            } else {
                showNotification(`خطا در دسترسی به ${device}: ${err.message}`);
            }
        }

        function showNotification(text) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--accent-green);
                color: white;
                padding: 15px 25px;
                border-radius: 15px;
                font-weight: 600;
                z-index: 1000;
                animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            `;
            notification.textContent = text;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // ==================== تابع اتصال - اصلاح شده ====================
        function connectToFriend() {
            friendCode = document.getElementById('friendCodeInput').value.trim();
            
            if (!friendCode || !peer) {
                showNotification('لطفاً ابتدا شماره خود را تنظیم کنید.');
                return;
            }
            
            if (friendCode === myCode) {
                showNotification('نمی‌توانید به خودتان متصل شوید!');
                return;
            }
            
            friendCode = friendCode.padStart(9, '0').slice(-9);
            
            dataConnection = peer.connect(friendCode);
            
            dataConnection.on('open', () => {
                document.getElementById('connectedTo').textContent = friendCode;
                document.getElementById('sendBtn').disabled = false;
                
                showNotification('✅ تماس برقرار شد!');
                showChatPage();
                
                // راه‌اندازی WebRTC مستقیم
                setupWebRTC();
                
                dataConnection.send({
                    type: 'handshake',
                    code: myCode,
                    timestamp: new Date().toISOString()
                });
            });
            
            // (بقیه کدهای اتصال...)
        }

        // ==================== تنظیمات اولیه ====================
        document.addEventListener('DOMContentLoaded', function() {
            // تست WebRTC
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('مرورگر شما از WebRTC پشتیبانی نمی‌کند. لطفاً از Chrome, Firefox, Edge استفاده کنید.');
            }
            
            // ارسال با Enter
            document.getElementById('textInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
        });

        // توابع دیگر (setMyCode, addMessage, disconnect, etc.) مانند قبل باقی می‌مانند
        // با اضافه شدن قابلیت‌های جدید
        
        // تابع ارسال پیام متنی ساده
        function sendMessage() {
            const input = document.getElementById('textInput');
            const message = input.value.trim();
            
            if (!message || !dataConnection || !dataConnection.open) return;
            
            const messageData = {
                type: 'text',
                content: message,
                sender: myCode,
                timestamp: new Date().toISOString()
            };
            
            dataConnection.send(messageData);
            
            // نمایش پیام ارسالی
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message outgoing';
            messageDiv.textContent = message;
            document.getElementById('messagesContainer').appendChild(messageDiv);
            
            input.value = '';
            input.focus();
        }
    </script>
</body>
</html>
