<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title> مستقیم </title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-surface: #242424;
            --bg-card: #2d2d2d;
            --accent-purple: #8b5cf6;
            --accent-teal: #06b6d4;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-color: #3f3f46;
            --shadow-dark: rgba(0, 0, 0, 0.5);
            --gradient-bg: linear-gradient(135deg, #0f0f0f, #1a1a1a, #2d1b69);
            --gradient-accent: linear-gradient(135deg, #8b5cf6, #3b82f6);
            --gradient-danger: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        body {
            background: var(--gradient-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* صفحه اول */
        .setup-page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--gradient-bg);
        }
        
        .setup-container {
            background: var(--bg-surface);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px var(--shadow-dark);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        
        .setup-logo {
            font-size: 4rem;
            margin-bottom: 20px;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .setup-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 30px;
        }
        
        .input-group { margin-bottom: 25px; text-align: right; }
        
        .input-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .number-input {
            width: 100%;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            transition: all 0.3s;
            font-family: monospace;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .number-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: var(--gradient-accent);
            color: white;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--accent-teal), var(--accent-purple));
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        
        .btn-danger {
            background: var(--gradient-danger);
            color: white;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px var(--shadow-dark);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* صفحه چت */
        .chat-page {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
            background: var(--bg-primary);
        }
        
        .chat-page.active {
            display: flex;
        }
        
        /* هدر چت */
        .chat-header {
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
        }
        
        .connection-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .disconnect-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .disconnect-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        /* ناحیه پیام‌ها */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        
        /* افکت دودی پس‌زمینه */
        .messages-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        /* پیام‌ها */
        .message {
            max-width: 85%;
            padding: 16px;
            border-radius: 18px;
            position: relative;
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.5;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
            z-index: 1;
        }
        
        .message:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.1);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .message.outgoing {
            align-self: flex-end;
            background: var(--gradient-accent);
            border: none;
        }
        
        .message.incoming {
            align-self: flex-start;
            background: var(--bg-surface);
        }
        
        .message.system {
            align-self: center;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
            max-width: 90%;
            text-align: center;
        }
        
        .message.disconnect {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }
        
        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 8px;
            display: block;
        }
        
        /* ریپلای */
        .reply-indicator {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--bg-secondary);
            border-right: 3px solid var(--accent-purple);
            border-radius: 12px;
            margin-bottom: 15px;
            position: relative;
        }
        
        .reply-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            margin-right: 10px;
        }
        
        .reply-info {
            flex: 1;
        }
        
        .reply-sender {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        
        .reply-content {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .reply-badge {
            background: var(--accent-purple);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 10px;
        }
        
        .message-reply {
            padding: 10px;
            background: var(--bg-secondary);
            border-right: 3px solid var(--accent-purple);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .message-reply:hover {
            background: var(--bg-card);
        }
        
        .reply-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            font-size: 0.9rem;
            transition: all 0.3s;
            margin-top: 8px;
        }
        
        .reply-btn:hover {
            color: var(--accent-purple);
        }
        
        /* کنترل‌های پایین */
        .chat-controls {
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            flex-shrink: 0;
            box-shadow: 0 -5px 20px var(--shadow-dark);
        }
        
        /* انتخاب‌گر حالت */
        .mode-selector {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 20px;
        }
        
        .mode-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .mode-btn.active {
            background: var(--gradient-accent);
            color: white;
            border-color: var(--accent-purple);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }
        
        .mode-btn:hover:not(.active) {
            background: var(--bg-surface);
            color: var(--text-primary);
        }
        
        /* ناحیه ورودی */
        .input-area { display: none; }
        
        .input-area.active {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* حالت متن */
        .text-input-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        #textInput {
            flex: 1;
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 1.1rem;
            transition: all 0.3s;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        #textInput:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        
        .send-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: var(--gradient-accent);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* حالت تماس */
        .call-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .call-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .call-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: var(--gradient-accent);
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }
        
        .call-btn.end-call {
            background: var(--gradient-danger);
        }
        
        .call-btn:hover {
            transform: scale(1.1);
        }
        
        /* ویدیو کانتینر */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        @media (min-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px var(--shadow-dark);
        }
        
        .video-wrapper.local {
            border: 3px solid var(--accent-purple);
        }
        
        .video-wrapper.remote {
            border: 3px solid var(--accent-teal);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        
        .video-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 2;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            z-index: 1;
        }
        
        /* حالت‌های دیگر */
        .media-upload-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .upload-btn {
            padding: 20px;
            background: linear-gradient(135deg, var(--accent-teal), var(--accent-purple));
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.3s;
        }
        
        .preview-box {
            margin: 20px 0;
            padding: 25px;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 3px dashed var(--border-color);
            text-align: center;
        }
        
        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-green);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }
        
        /* اسکرول بار */
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .messages-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }
        
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }
        
        /* رسپانسیو */
        @media (max-height: 700px) {
            .chat-header { padding: 15px; }
            .messages-container { padding: 15px; }
            .chat-controls { padding: 15px; }
            .mode-btn { width: 50px; height: 50px; font-size: 1.4rem; }
            .call-btn { width: 60px; height: 60px; font-size: 1.6rem; }
            .setup-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <!-- صفحه اول: تنظیمات اتصال -->
    <div class="setup-page" id="setupPage">
        <div class="setup-container">
            <div class="setup-logo">📞</div>
            <h1 class="setup-title">چت مستقیم P2P</h1>
            
            <div class="input-group">
                <label class="input-label">شماره تماس مجازی من:</label>
                <input type="number" class="number-input" id="myCodeInput" 
                       placeholder="مثلاً: 123456789" maxlength="9" 
                       inputmode="numeric" pattern="[0-9]*">
            </div>
            
            <button class="btn btn-primary" onclick="setMyCode()" id="setCodeBtn">
                <span>✅</span>
                <span>تایید شماره من</span>
            </button>
            
            <div class="input-group" style="margin-top: 30px;">
                <label class="input-label">شماره تماس مجازی مخاطب را وارد کنید:</label>
                <input type="number" class="number-input" id="friendCodeInput" 
                       placeholder="شماره مخاطب را وارد کنید" inputmode="numeric">
            </div>
            
            <button class="btn btn-success" onclick="connectToFriend()" 
                    id="connectBtn" disabled>
                <span>📞</span>
                <span>برقراری تماس با مخاطب</span>
            </button>
        </div>
    </div>
    
    <!-- صفحه دوم: چت -->
    <div class="chat-page" id="chatPage">
        <!-- هدر چت -->
        <header class="chat-header">
            <div class="connection-info">
                <div class="status-indicator"></div>
                <span>متصل به: <span id="connectedTo">---</span></span>
            </div>
            
            <button class="disconnect-btn" onclick="disconnect()">
                قطع ارتباط
            </button>
        </header>
        
        <!-- پیام‌ها -->
        <div class="messages-container" id="messagesContainer">
            <div class="message system">
                <p>👋 به چت مستقیم خوش آمدید! اکنون می‌توانید با مخاطب خود ارتباط برقرار کنید.</p>
            </div>
        </div>
        
        <!-- کنترل‌های پایین -->
        <div class="chat-controls">
            <!-- انتخاب‌گر حالت -->
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('text')" title="متن">
                    <span>💬</span>
                </button>
                <button class="mode-btn" onclick="setMode('audio')" title="تماس صوتی">
                    <span>📞</span>
                </button>
                <button class="mode-btn" onclick="setMode('video')" title="تماس ویدیویی">
                    <span>📹</span>
                </button>
                <button class="mode-btn" onclick="setMode('image')" title="عکس">
                    <span>🖼️</span>
                </button>
                <button class="mode-btn" onclick="setMode('file')" title="فایل">
                    <span>📎</span>
                </button>
            </div>
            
            <!-- حالت متن -->
            <div class="input-area active" id="textArea">
                <div class="text-input-container">
                    <input type="text" id="textInput" placeholder="پیام خود را بنویسید...">
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>
                        <span>📤</span>
                    </button>
                </div>
            </div>
            
            <!-- حالت تماس صوتی -->
            <div class="input-area" id="audioArea">
                <div class="call-container">
                    <div class="call-controls">
                        <button class="call-btn" onclick="toggleAudioCall()" id="audioCallBtn">
                            <span>📞</span>
                        </button>
                        <button class="call-btn end-call" onclick="endCall()" id="endCallBtn" style="display: none;">
                            <span>📴</span>
                        </button>
                    </div>
                    <div id="callStatus" style="text-align: center; color: var(--text-secondary); padding: 10px;">
                        آماده برای تماس صوتی
                    </div>
                </div>
            </div>
            
            <!-- حالت تماس ویدیویی -->
            <div class="input-area" id="videoArea">
                <div class="call-container">
                    <div class="video-grid">
                        <div class="video-wrapper local">
                            <div class="video-label">📹 شما</div>
                            <video id="localVideo" autoplay muted playsinline></video>
                            <div class="video-overlay" id="localVideoOverlay" style="display: none;">
                                دوربین خاموش
                            </div>
                        </div>
                        
                        <div class="video-wrapper remote">
                            <div class="video-label">👤 مخاطب</div>
                            <video id="remoteVideo" autoplay playsinline></video>
                            <div class="video-overlay" id="remoteVideoOverlay">
                                منتظر اتصال...
                            </div>
                        </div>
                    </div>
                    
                    <div class="call-controls">
                        <button class="call-btn" onclick="toggleVideoCall()" id="videoCallBtn">
                            <span>📹</span>
                        </button>
                        <button class="call-btn" onclick="toggleVideoMute()" id="videoMuteBtn">
                            <span>🎤</span>
                        </button>
                        <button class="call-btn" onclick="toggleVideo()" id="videoToggleBtn">
                            <span>📷</span>
                        </button>
                        <button class="call-btn end-call" onclick="endCall()" id="endVideoCallBtn" style="display: none;">
                            <span>📴</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- حالت عکس -->
            <div class="input-area" id="imageArea">
                <div class="media-upload-container">
                    <input type="file" accept="image/*" id="imageInput" hidden 
                           onchange="previewImage(this.files[0])">
                    <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
                        <span>📁</span>
                        <span>انتخاب عکس</span>
                    </button>
                    <div class="preview-box" id="imagePreview"></div>
                    <button class="btn btn-primary" onclick="sendImage()" id="sendImageBtn" disabled>
                        <span>📤</span>
                        <span>ارسال عکس</span>
                    </button>
                </div>
            </div>
            
            <!-- حالت فایل -->
            <div class="input-area" id="fileArea">
                <div class="media-upload-container">
                    <input type="file" id="fileInput" hidden 
                           onchange="previewFile(this.files[0])">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        <span>📁</span>
                        <span>انتخاب فایل</span>
                    </button>
                    <div class="preview-box" id="filePreview"></div>
                    <button class="btn btn-primary" onclick="sendFile()" id="sendFileBtn" disabled>
                        <span>📤</span>
                        <span>ارسال فایل</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let dataConnection = null;
        let mediaConnection = null;
        let localStream = null;
        let remoteStream = null;
        let myCode = null;
        let friendCode = null;
        let currentMode = 'text';
        let isInCall = false;
        let replyingTo = null; // برای ذخیره پیام ریپلای

        // ==================== مدیریت صفحات ====================
        function showChatPage() {
            document.getElementById('setupPage').classList.add('hidden');
            document.getElementById('chatPage').classList.add('active');
            document.getElementById('textInput').focus();
        }
        
        function showSetupPage() {
            document.getElementById('setupPage').classList.remove('hidden');
            document.getElementById('chatPage').classList.remove('active');
            disconnect();
        }

        // ==================== تنظیم شماره کاربر ====================
        function setMyCode() {
            const codeInput = document.getElementById('myCodeInput').value.trim();
            
            if (!codeInput || codeInput.length < 3) {
                showNotification('لطفاً یک شماره معتبر (حداقل ۳ رقم) وارد کنید.');
                return;
            }
            
            myCode = codeInput.padStart(9, '0').slice(-9);
            
            // ایجاد Peer با شماره انتخابی
            peer = new Peer(myCode, {
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                debug: 2
            });
            
            // رویدادهای Peer
            peer.on('open', () => {
                document.getElementById('setCodeBtn').disabled = true;
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('myCodeInput').disabled = true;
                showNotification('شماره شما تنظیم شد!');
            });
            
            peer.on('connection', (conn) => {
                handleIncomingConnection(conn);
            });
            
            peer.on('call', (call) => {
                handleIncomingCall(call);
            });
            
            peer.on('error', (err) => {
                console.error('خطای PeerJS:', err);
                showNotification(`خطا: ${err.type}`);
            });
            
            peer.on('disconnected', () => {
                addSystemMessage('⚠️ اتصال به سرور قطع شد. تلاش برای اتصال مجدد...');
            });
        }

        // ==================== اتصال به مخاطب ====================
        function connectToFriend() {
            friendCode = document.getElementById('friendCodeInput').value.trim();
            
            if (!friendCode || !peer) {
                showNotification('لطفاً ابتدا شماره خود را تنظیم کنید.');
                return;
            }
            
            if (friendCode === myCode) {
                showNotification('نمی‌توانید به خودتان متصل شوید!');
                return;
            }
            
            friendCode = friendCode.padStart(9, '0').slice(-9);
            
            // اتصال داده
            dataConnection = peer.connect(friendCode);
            setupDataConnection();
            
            showNotification(`در حال اتصال به ${friendCode}...`);
        }
        
        function handleIncomingConnection(conn) {
            dataConnection = conn;
            friendCode = conn.peer;
            setupDataConnection();
        }

        // ==================== تنظیم اتصال داده ====================
        function setupDataConnection() {
            dataConnection.on('open', () => {
                document.getElementById('connectedTo').textContent = friendCode;
                document.getElementById('sendBtn').disabled = false;
                
                showNotification('✅ تماس برقرار شد!');
                showChatPage();
                
                // ارسال اطلاعات اولیه
                dataConnection.send({
                    type: 'handshake',
                    code: myCode,
                    timestamp: new Date().toISOString()
                });
            });
            
            dataConnection.on('data', (data) => {
                handleIncomingData(data);
            });
            
            dataConnection.on('close', () => {
                addDisconnectMessage('🔴 مخاطب دیسکانکت شده');
                endCall();
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('connectedTo').textContent = '---';
            });
            
            dataConnection.on('error', (err) => {
                console.error('خطای اتصال داده:', err);
                addSystemMessage('⚠️ خطا در اتصال داده');
            });
        }

        // ==================== مدیریت تماس‌های رسانه‌ای ====================
        async function toggleAudioCall() {
            if (!dataConnection || !dataConnection.open) {
                showNotification('ابتدا باید به مخاطب متصل شوید.');
                return;
            }
            
            if (isInCall) {
                endCall();
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
                
                const call = peer.call(friendCode, localStream, {
                    metadata: { type: 'audio', caller: myCode }
                });
                
                mediaConnection = call;
                setupMediaCall(call, 'audio');
                
                document.getElementById('audioCallBtn').style.display = 'none';
                document.getElementById('endCallBtn').style.display = 'flex';
                document.getElementById('callStatus').textContent = '📞 در حال تماس صوتی...';
                
                // درخواست تغییر حالت به مخاطب
                dataConnection.send({
                    type: 'mode-change',
                    mode: 'audio',
                    timestamp: new Date().toISOString()
                });
                
            } catch (err) {
                console.error('خطا در شروع تماس صوتی:', err);
                
                if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    showNotification('میکروفن پیدا نشد. از حالت متن استفاده کنید.');
                } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showNotification('دسترسی به میکروفن رد شد. لطفاً مجوز را بررسی کنید.');
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    showNotification('میکروفن در حال استفاده توسط برنامه دیگر است.');
                } else {
                    showNotification('خطا در دسترسی به میکروفن.');
                }
            }
        }
        
        async function toggleVideoCall() {
            if (!dataConnection || !dataConnection.open) {
                showNotification('ابتدا باید به مخاطب متصل شوید.');
                return;
            }
            
            if (isInCall) {
                endCall();
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });
                
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('localVideoOverlay').style.display = 'none';
                
                const call = peer.call(friendCode, localStream, {
                    metadata: { type: 'video', caller: myCode }
                });
                
                mediaConnection = call;
                setupMediaCall(call, 'video');
                
                document.getElementById('videoCallBtn').style.display = 'none';
                document.getElementById('endVideoCallBtn').style.display = 'flex';
                
                // درخواست تغییر حالت به مخاطب
                dataConnection.send({
                    type: 'mode-change',
                    mode: 'video',
                    timestamp: new Date().toISOString()
                });
                
            } catch (err) {
                console.error('خطا در شروع تماس ویدیویی:', err);
                
                if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    showNotification('دوربین پیدا نشد. از حالت صوتی استفاده کنید.');
                } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showNotification('دسترسی به دوربین رد شد. لطفاً مجوز را بررسی کنید.');
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    showNotification('دوربین در حال استفاده توسط برنامه دیگر است.');
                } else {
                    showNotification('خطا در دسترسی به دوربین.');
                }
            }
        }
        
        async function handleIncomingCall(call) {
            try {
                const metadata = call.metadata || {};
                
                if (metadata.type === 'video') {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({
                            audio: true,
                            video: true
                        });
                        document.getElementById('localVideo').srcObject = localStream;
                        document.getElementById('localVideoOverlay').style.display = 'none';
                    } catch (err) {
                        // اگر دوربین نداشت، فقط صدا بگیر
                        localStream = await navigator.mediaDevices.getUserMedia({
                            audio: true,
                            video: false
                        });
                        addSystemMessage('⚠️ دوربین شما فعال نیست. فقط صدا ارسال می‌شود.');
                    }
                } else {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: false
                    });
                }
                
                call.answer(localStream);
                mediaConnection = call;
                
                call.on('stream', (stream) => {
                    if (metadata.type === 'video') {
                        remoteStream = stream;
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                        document.getElementById('remoteVideoOverlay').style.display = 'none';
                        setMode('video');
                    } else {
                        const audio = new Audio();
                        audio.srcObject = stream;
                        audio.play();
                        setMode('audio');
                    }
                    
                    isInCall = true;
                    
                    if (metadata.type === 'video') {
                        document.getElementById('videoCallBtn').style.display = 'none';
                        document.getElementById('endVideoCallBtn').style.display = 'flex';
                    } else {
                        document.getElementById('audioCallBtn').style.display = 'none';
                        document.getElementById('endCallBtn').style.display = 'flex';
                        document.getElementById('callStatus').textContent = '📞 در حال تماس صوتی...';
                    }
                    
                    showNotification(`📞 تماس ${metadata.type === 'video' ? 'ویدیویی' : 'صوتی'} دریافت شد.`);
                });
                
                call.on('close', () => {
                    endCall();
                });
                
            } catch (err) {
                console.error('خطا در پاسخ به تماس:', err);
                
                if (err.name === 'NotAllowedError') {
                    addSystemMessage('⚠️ دسترسی به میکروفن/دوربین رد شد.');
                } else {
                    addSystemMessage('⚠️ خطا در پاسخ به تماس.');
                }
                
                call.close();
            }
        }
        
        function setupMediaCall(call, type) {
            isInCall = true;
            
            call.on('stream', (stream) => {
                if (type === 'video') {
                    remoteStream = stream;
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('remoteVideoOverlay').style.display = 'none';
                } else {
                    // برای تماس صوتی، صدا را پخش می‌کنیم
                    const audio = new Audio();
                    audio.srcObject = stream;
                    audio.play();
                }
                
                showNotification(`✅ تماس ${type === 'video' ? 'ویدیویی' : 'صوتی'} برقرار شد.`);
            });
            
            call.on('close', () => {
                addSystemMessage('📞 تماس پایان یافت.');
                endCall();
            });
        }
        
        function endCall() {
            if (mediaConnection) {
                mediaConnection.close();
                mediaConnection = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            if (remoteStream) {
                remoteStream.getTracks().forEach(track => track.stop());
                remoteStream = null;
            }
            
            isInCall = false;
            
            // بازنشانی کنترل‌های تماس
            document.getElementById('audioCallBtn').style.display = 'flex';
            document.getElementById('endCallBtn').style.display = 'none';
            document.getElementById('videoCallBtn').style.display = 'flex';
            document.getElementById('endVideoCallBtn').style.display = 'none';
            document.getElementById('callStatus').textContent = 'آماده برای تماس صوتی';
            
            // بازنشانی ویدیوها
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideoOverlay').style.display = 'flex';
            document.getElementById('remoteVideoOverlay').style.display = 'flex';
            
            // اعلام پایان تماس به مخاطب
            if (dataConnection && dataConnection.open) {
                dataConnection.send({
                    type: 'call-ended',
                    timestamp: new Date().toISOString()
                });
            }
            
            setMode('text');
        }
        
        function toggleVideoMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('videoMuteBtn').innerHTML = 
                        audioTrack.enabled ? '<span>🎤</span>' : '<span>🔇</span>';
                }
            }
        }
        
        function toggleVideo() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    document.getElementById('videoToggleBtn').innerHTML = 
                        videoTrack.enabled ? '<span>📷</span>' : '<span>📵</span>';
                    document.getElementById('localVideoOverlay').style.display = 
                        videoTrack.enabled ? 'none' : 'flex';
                }
            }
        }

        // ==================== ارسال پیام‌ها ====================
        function sendMessage() {
            const input = document.getElementById('textInput');
            const message = input.value.trim();
            
            if (!message || !dataConnection || !dataConnection.open) return;
            
            const messageData = {
                type: 'text',
                content: message,
                sender: myCode,
                timestamp: new Date().toISOString(),
                replyTo: replyingTo // اضافه کردن اطلاعات ریپلای
            };
            
            dataConnection.send(messageData);
            addMessage(message, 'outgoing', replyingTo);
            input.value = '';
            input.focus();
            
            // پاک کردن ریپلای
            clearReply();
        }
        
        function sendImage() {
            const input = document.getElementById('imageInput');
            if (!input.files[0] || !dataConnection || !dataConnection.open) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = {
                    type: 'image',
                    content: e.target.result,
                    name: input.files[0].name,
                    size: input.files[0].size,
                    sender: myCode,
                    timestamp: new Date().toISOString(),
                    replyTo: replyingTo
                };
                
                dataConnection.send(imageData);
                addMessage('📷 عکس ارسال شد', 'outgoing', replyingTo);
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('sendImageBtn').disabled = true;
                
                clearReply();
            };
            reader.readAsDataURL(input.files[0]);
        }
        
        function sendFile() {
            const input = document.getElementById('fileInput');
            if (!input.files[0] || !dataConnection || !dataConnection.open) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = {
                    type: 'file',
                    content: e.target.result,
                    name: input.files[0].name,
                    size: input.files[0].size,
                    sender: myCode,
                    timestamp: new Date().toISOString(),
                    replyTo: replyingTo
                };
                
                dataConnection.send(fileData);
                addMessage(`📎 فایل "${input.files[0].name}" ارسال شد`, 'outgoing', replyingTo);
                document.getElementById('filePreview').innerHTML = '';
                document.getElementById('sendFileBtn').disabled = true;
                
                clearReply();
            };
            reader.readAsDataURL(input.files[0]);
        }

        // ==================== مدیریت داده‌های دریافتی ====================
        function handleIncomingData(data) {
            switch (data.type) {
                case 'text':
                    addMessage(data.content, 'incoming', data.replyTo);
                    break;
                    
                case 'image':
                    addMessage('📷 عکس دریافت شد', 'incoming', data.replyTo);
                    break;
                    
                case 'file':
                    addMessage(`📎 فایل "${data.name}" دریافت شد`, 'incoming', data.replyTo);
                    break;
                    
                case 'handshake':
                    addSystemMessage(`✅ ${data.code} متصل شد.`);
                    break;
                    
                case 'mode-change':
                    if (data.mode === 'audio' || data.mode === 'video') {
                        addSystemMessage(`📞 مخاطب درخواست تماس ${data.mode === 'video' ? 'ویدیویی' : 'صوتی'} کرده است.`);
                        if (!isInCall) {
                            setMode(data.mode);
                        }
                    }
                    break;
                    
                case 'call-ended':
                    addSystemMessage('📞 تماس توسط مخاطب پایان یافت.');
                    endCall();
                    break;
            }
        }

        // ==================== رابط کاربری ====================
        function setMode(mode) {
            if (isInCall && (mode !== 'audio' && mode !== 'video' && currentMode !== 'audio' && currentMode !== 'video')) {
                showNotification('⚠️ در حال تماس هستید. برای مدیریت تماس به حالت صدا یا ویدیو برگردید.');
                return;
            }
            
            currentMode = mode;
            
            // به‌روزرسانی دکمه‌های حالت
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // نمایش ناحیه مربوطه
            document.querySelectorAll('.input-area').forEach(area => area.classList.remove('active'));
            document.getElementById(`${mode}Area`).classList.add('active');
            
            // فوکوس روی ورودی متن
            if (mode === 'text') {
                setTimeout(() => {
                    document.getElementById('textInput').focus();
                }, 100);
            }
        }
        
        function addMessage(text, type, replyData = null) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            
            messageDiv.className = `message ${type}`;
            const time = new Date().toLocaleTimeString('fa-IR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            let replyHTML = '';
            if (replyData) {
                const replySender = replyData.sender === myCode ? 'شما' : 'مخاطب';
                replyHTML = `
                    <div class="message-reply" onclick="replyToMessage('${replyData.id}')">
                        <div class="reply-badge">پاسخ</div>
                        <strong>${replySender}:</strong> ${replyData.content.substring(0, 50)}${replyData.content.length > 50 ? '...' : ''}
                    </div>
                `;
            }
            
            messageDiv.innerHTML = `
                ${replyHTML}
                <div>${text}</div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <small class="message-time">${time}</small>
                    <button class="reply-btn" onclick="setReply('${text}', '${type}')">
                        <span>↩️</span> پاسخ
                    </button>
                </div>
            `;
            
            // ذخیره ID برای ریپلای
            messageDiv.dataset.messageId = Date.now().toString();
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.innerHTML = `<p>${text}</p>`;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function addDisconnectMessage(text) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system disconnect';
            messageDiv.innerHTML = `<p>${text}</p>`;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            showNotification('مخاطب قطع شد.');
        }
        
        // ==================== قابلیت ریپلای ====================
        function setReply(content, type) {
            replyingTo = {
                id: Date.now().toString(),
                content: content,
                sender: type === 'outgoing' ? myCode : friendCode,
                timestamp: new Date().toISOString()
            };
            
            // نمایش نشانگر ریپلای
            const replyIndicator = document.createElement('div');
            replyIndicator.className = 'reply-indicator';
            replyIndicator.innerHTML = `
                <button class="reply-close" onclick="clearReply()">×</button>
                <div class="reply-info">
                    <div class="reply-sender">در پاسخ به:</div>
                    <div class="reply-content">${content}</div>
                </div>
            `;
            
            // حذف ریپلای قبلی اگر وجود دارد
            const existingReply = document.querySelector('.reply-indicator');
            if (existingReply) {
                existingReply.remove();
            }
            
            // اضافه کردن نشانگر جدید
            document.getElementById('textArea').prepend(replyIndicator);
            document.getElementById('textInput').focus();
            
            showNotification('آماده برای پاسخ به پیام...');
        }
        
        function clearReply() {
            replyingTo = null;
            const replyIndicator = document.querySelector('.reply-indicator');
            if (replyIndicator) {
                replyIndicator.remove();
            }
        }
        
        function replyToMessage(messageId) {
            // یافتن پیام مربوطه و تنظیم ریپلای
            const messageElement = document.querySelector(`[data-message-id="${messageId}"]`);
            if (messageElement) {
                const content = messageElement.querySelector('div').textContent;
                const type = messageElement.classList.contains('outgoing') ? 'outgoing' : 'incoming';
                setReply(content, type);
            }
        }
        
        function showNotification(text) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = text;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }
        
        function previewImage(file) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').innerHTML = `
                    <img src="${e.target.result}" style="max-width: 200px; border-radius: 10px;">
                    <p style="margin-top: 10px;">${file.name}</p>
                `;
                document.getElementById('sendImageBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        }
        
        function previewFile(file) {
            if (!file) return;
            
            document.getElementById('filePreview').innerHTML = `
                <div style="font-size: 3rem;">📄</div>
                <p style="font-weight: 600; margin: 10px 0;">${file.name}</p>
                <p>${formatBytes(file.size)}</p>
            `;
            document.getElementById('sendFileBtn').disabled = false;
        }
        
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 بایت';
            const k = 1024;
            const sizes = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
        }
        
        function disconnect() {
            if (dataConnection) dataConnection.close();
            if (mediaConnection) mediaConnection.close();
            if (peer) peer.destroy();
            
            peer = null;
            dataConnection = null;
            mediaConnection = null;
            localStream = null;
            remoteStream = null;
            myCode = null;
            friendCode = null;
            isInCall = false;
            replyingTo = null;
            
            // بازنشانی فرم
            document.getElementById('myCodeInput').value = '';
            document.getElementById('friendCodeInput').value = '';
            document.getElementById('myCodeInput').disabled = false;
            document.getElementById('setCodeBtn').disabled = false;
            document.getElementById('connectBtn').disabled = true;
            
            // پاک کردن ریپلای
            clearReply();
            
            // پاک کردن پیام‌ها
            document.getElementById('messagesContainer').innerHTML = `
                <div class="message system">
                    <p>👋 به چت مستقیم خوش آمدید! اکنون می‌توانید با مخاطب خود ارتباط برقرار کنید.</p>
                </div>
            `;
            
            showSetupPage();
        }

        // ==================== تنظیمات اولیه ====================
        document.addEventListener('DOMContentLoaded', function() {
            // ارسال با Enter
            document.getElementById('textInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            
            // جلوگیری از اسکرول روی inputهای عددی
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('wheel', e => e.preventDefault());
            });
        });
    </script>
</body>
</html>
