<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>گپ آرانا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-surface: #1e2c3a;
            --bg-input: #2a3942;
            --accent-primary: #2b5278;
            --accent-secondary: #4d5b9c;
            --accent-green: #00af9c;
            --text-primary: #e1e9f0;
            --text-secondary: #7c8b96;
            --text-muted: #5d6c79;
            --border-color: #2a3942;
            --message-incoming: #182533;
            --message-outgoing: #2b5278;
            --status-online: #00af9c;
            --status-offline: #7c8b96;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* صفحات اصلی */
        .page {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page.hidden {
            transform: translateX(100%);
        }

        .page.active {
            transform: translateX(0);
        }

        /* هدر */
        .header {
            background: var(--bg-secondary);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow);
            z-index: 1000;
            position: relative;
            height: 60px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            flex: 1;
            font-size: 17px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            font-size: 22px;
            color: var(--accent-green);
        }

        /* آواتار */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .avatar.small {
            width: 38px;
            height: 38px;
            font-size: 16px;
        }

        /* صفحه لاگین */
        #loginPage {
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-primary), #131e29);
        }

        .login-container {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0 20px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-icon {
            font-size: 60px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--accent-green), #53bdeb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            text-align: center;
            font-size: 14px;
        }

        .number-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 18px;
            text-align: center;
            font-family: monospace;
            transition: all 0.3s;
            font-weight: 500;
        }

        .number-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 2px rgba(0, 175, 156, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #009982;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 175, 156, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* صفحه مخاطبین */
        .search-bar {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            text-align: right;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent-green);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-primary);
            -webkit-overflow-scrolling: touch;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            min-height: 70px;
        }

        .contact-item:active {
            background: var(--bg-secondary);
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-last-message {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-align: left;
        }

        .contact-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--status-online);
            flex-shrink: 0;
        }

        .contact-status.offline {
            background: var(--status-offline);
        }

        /* صفحه چت - طراحی شبیه تلگرام */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ناحیه پیام‌ها - ارتفاع بیشتر */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: linear-gradient(180deg, var(--bg-primary) 0%, #0c151d 100%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
            height: calc(100vh - 180px); /* ارتفاع بیشتر برای پیام‌ها */
        }

        /* پیام‌ها */
        .message-wrapper {
            max-width: 85%;
            position: relative;
            animation: messageAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-wrapper.incoming {
            align-self: flex-start;
        }

        .message-wrapper.outgoing {
            align-self: flex-end;
        }

        .message {
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.incoming {
            background: var(--message-incoming);
            border-top-right-radius: 4px;
        }

        .message.outgoing {
            background: var(--message-outgoing);
            border-top-left-radius: 4px;
        }

        .message-content {
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            direction: ltr;
        }

        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            opacity: 0.8;
        }

        .message-status {
            display: flex;
            gap: 2px;
        }

        .status-icon {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .status-icon.sent {
            color: #8eb5f1;
        }

        .status-icon.delivered {
            color: #8eb5f1;
        }

        .status-icon.read {
            color: var(--accent-green);
        }

        .message-sender {
            font-size: 12px;
            color: var(--accent-green);
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* ریپلای */
        .reply-preview {
            background: rgba(255, 255, 255, 0.05);
            border-right: 3px solid var(--accent-green);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reply-preview:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .reply-sender {
            font-size: 12px;
            color: var(--accent-green);
            margin-bottom: 2px;
            font-weight: 500;
        }

        .reply-content {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* نوار ریپلای */
        .reply-indicator {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .reply-indicator-content {
            flex: 1;
            margin-left: 12px;
        }

        .reply-indicator-sender {
            font-size: 13px;
            color: var(--accent-green);
            margin-bottom: 2px;
        }

        .reply-indicator-text {
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cancel-reply {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        /* نوار ورودی پیام - کاملاً شبیه تلگرام و بالاتر */
        .input-area {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            position: relative;
            min-height: 70px;
            max-height: 120px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-shrink: 0;
            margin-top: auto;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-input);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-green);
        }

        #messageInput {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 100px;
            min-height: 24px;
            padding: 0;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn.attach {
            color: var(--text-secondary);
        }

        .action-btn.send {
            background: var(--accent-green);
            color: white;
            width: 44px;
            height: 44px;
        }

        .action-btn.send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--bg-input);
            color: var(--text-muted);
        }

        .action-btn.send:not(:disabled):hover {
            background: #009982;
            transform: scale(1.05);
        }

        /* اسکرول بار */
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .contacts-list::-webkit-scrollbar {
            width: 6px;
        }

        .contacts-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .contacts-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* مدال انتخاب فایل */
        .file-type-modal {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: var(--bg-secondary);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            display: none;
            z-index: 2000;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        .file-type-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .file-type-btn {
            background: var(--bg-surface);
            border: none;
            border-radius: 12px;
            padding: 20px;
            color: var(--text-primary);
            font-size: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-type-btn:hover {
            background: var(--accent-primary);
            transform: translateY(-2px);
        }

        .file-type-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* نمایش فایل‌ها */
        .file-message {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            margin: 4px 0;
            max-width: 250px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .file-message:hover {
            background: rgba(255,255,255,0.15);
        }

        .file-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .file-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .file-size {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* مدال‌ها */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            animation: fadeIn 0.3s;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-green);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
            z-index: 2000;
            animation: slideIn 0.3s, fadeOut 0.3s 2.7s;
            box-shadow: var(--shadow);
            max-width: 300px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* لودینگ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-green);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* مخاطب جدید */
        .new-contact-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-green);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 175, 156, 0.4);
            transition: all 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .new-contact-btn:active {
            transform: scale(0.95);
        }

        /* برای کیبورد موبایل */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .input-area {
                padding-bottom: calc(12px + env(safe-area-inset-bottom));
            }
        }

        /* استایل برای موبایل */
        @media (max-width: 480px) {
            .message-wrapper {
                max-width: 90%;
            }
            
            .messages-area {
                height: calc(100vh - 160px);
            }
            
            .header {
                padding: 0 12px;
            }
            
            .input-area {
                padding: 12px;
            }
            
            .search-bar {
                padding: 12px;
            }
        }

        /* برای دسکتاپ */
        @media (min-width: 768px) {
            body {
                max-width: 450px;
                margin: 0 auto;
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
                height: 90vh;
                top: 5vh;
                border-radius: 20px;
                overflow: hidden;
                border: 1px solid var(--border-color);
            }
            
            .new-contact-btn {
                bottom: 30px;
                left: 30px;
            }
            
            .messages-area {
                height: calc(90vh - 180px);
            }
        }
    </style>
</head>
<body>
    <!-- صفحه لاگین -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <div class="app-icon">💬</div>
            <h1 style="margin-bottom: 30px; font-size: 24px;">گپ آرانا</h1>
            
            <div class="input-group">
                <label class="input-label">شماره 11 رقمی خود را وارد کنید</label>
                <input type="number" class="number-input" id="myIdInput" 
                       placeholder="مثلاً: 09123456789" maxlength="11" inputmode="numeric" autofocus>
                <small style="display: block; margin-top: 12px; color: var(--text-muted); font-size: 13px;">
                    این شماره شناسه منحصر به فرد شما خواهد بود
                </small>
            </div>
            
            <button class="btn btn-primary" onclick="initializePeer()" id="loginBtn">
                <span>ورود به گپ آرانا</span>
                <span>→</span>
            </button>
        </div>
    </div>

    <!-- صفحه مخاطبین -->
    <div id="contactsPage" class="page hidden">
        <div class="header">
            <div class="header-title">مخاطبین</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleSearch()">🔍</button>
            </div>
        </div>

        <div class="search-bar" id="searchBar" style="display: none;">
            <input type="text" class="search-input" id="searchInput" placeholder="جستجو..." 
                   oninput="filterContacts()" autocomplete="off">
        </div>

        <div class="contacts-list" id="contactsList">
            <!-- مخاطبین اینجا لود می‌شوند -->
        </div>

        <button class="new-contact-btn" onclick="showNewContactModal()">+</button>
    </div>

    <!-- صفحه چت -->
    <div id="chatPage" class="page hidden">
        <div class="header">
            <button class="icon-btn back-btn" onclick="goToContacts()">←</button>
            <div class="avatar" id="chatAvatar">?</div>
            <div style="flex: 1; min-width: 0;">
                <div class="header-title" id="chatContactName">مخاطب</div>
                <div style="font-size: 13px; color: var(--text-secondary);" id="chatContactStatus">
                    <span>آفلاین</span>
                </div>
            </div>
        </div>

        <!-- نوار ریپلای -->
        <div class="reply-indicator" id="replyIndicator">
            <div class="reply-indicator-content">
                <div class="reply-indicator-sender" id="replySender">پاسخ به:</div>
                <div class="reply-indicator-text" id="replyText"></div>
            </div>
            <button class="cancel-reply" onclick="cancelReply()">✕</button>
        </div>

        <div class="chat-container">
            <div class="messages-area" id="messagesArea">
                <!-- پیام‌ها اینجا نمایش داده می‌شوند -->
            </div>

            <div class="input-area">
                <button class="action-btn attach" onclick="openFileTypeModal()" title="ارسال فایل">
                    📎
                </button>
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="پیام خود را بنویسید..." 
                              rows="1" oninput="autoResize(this)"></textarea>
                </div>
                <button class="action-btn send" onclick="sendMessage()" id="sendBtn" disabled>
                    ↑
                </button>
            </div>
        </div>
    </div>

    <!-- مدال‌ها -->
    <div id="newContactModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; text-align: center;">مخاطب جدید</h2>
            <input type="number" class="number-input" id="newContactNumber" 
                   placeholder="شماره 11 رقمی" style="margin-bottom: 16px;">
            <input type="text" class="number-input" id="newContactName" 
                   placeholder="نام مخاطب (اختیاری)" style="margin-bottom: 24px;">
            <div style="display: flex; gap: 12px;">
                <button class="btn" onclick="closeNewContactModal()" 
                        style="background: var(--bg-surface); flex: 1;">لغو</button>
                <button class="btn btn-primary" onclick="addNewContact()" style="flex: 1;">افزودن</button>
            </div>
        </div>
    </div>

    <!-- مدال انتخاب نوع فایل -->
    <div id="fileTypeModal" class="file-type-modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0;">انتخاب نوع فایل</h3>
            <button onclick="closeFileTypeModal()" style="background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer;">✕</button>
        </div>
        
        <div class="file-type-grid">
            <button class="file-type-btn" onclick="selectFileType('image')">
                📷
                <span class="file-type-label">عکس</span>
            </button>
            <button class="file-type-btn" onclick="selectFileType('video')">
                🎥
                <span class="file-type-label">ویدیو</span>
            </button>
            <button class="file-type-btn" onclick="selectFileType('audio')">
                🎵
                <span class="file-type-label">صوت</span>
            </button>
            <button class="file-type-btn" onclick="selectFileType('document')">
                📄
                <span class="file-type-label">سند</span>
            </button>
            <button class="file-type-btn" onclick="selectFileType('archive')">
                📦
                <span class="file-type-label">آرشیو</span>
            </button>
            <button class="file-type-btn" onclick="selectFileType('any')">
                📎
                <span class="file-type-label">هر فایل</span>
            </button>
        </div>
    </div>

    <!-- لودینگ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- فایل اینپوت‌های مخفی -->
    <input type="file" id="fileInput" accept="*/*" style="display: none;" 
           onchange="handleFileSelect(this.files[0])">

    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let myId = null;
        let currentContact = null;
        let contacts = {};
        let connections = {};
        let pendingMessages = new Map();
        let replyingTo = null;
        let selectedFileType = null;
        
        // سیستم تیک‌ها
        const MESSAGE_STATUS = {
            SENDING: 'sending',
            SENT: 'sent',
            DELIVERED: 'delivered',
            READ: 'read'
        };
        
        // مدیریت فایل‌های بزرگ
        const CHUNK_SIZE = 32000; // 32KB chunks
        let currentUploads = new Map();
        let receivingFiles = new Map();

        // ==================== مدیریت مدال فایل ====================
        function openFileTypeModal() {
            document.getElementById('fileTypeModal').style.display = 'block';
        }
        
        function closeFileTypeModal() {
            document.getElementById('fileTypeModal').style.display = 'none';
        }
        
        function selectFileType(type) {
            selectedFileType = type;
            closeFileTypeModal();
            
            // تنظیم accept بر اساس نوع فایل
            const fileInput = document.getElementById('fileInput');
            
            switch(type) {
                case 'image':
                    fileInput.accept = 'image/*';
                    fileInput.capture = 'environment';
                    break;
                case 'video':
                    fileInput.accept = 'video/*';
                    fileInput.capture = 'environment';
                    break;
                case 'audio':
                    fileInput.accept = 'audio/*';
                    break;
                case 'document':
                    fileInput.accept = '.pdf,.doc,.docx,.txt,.rtf,.odt';
                    break;
                case 'archive':
                    fileInput.accept = '.zip,.rar,.7z,.tar,.gz';
                    break;
                case 'any':
                    fileInput.accept = '*/*';
                    break;
            }
            
            fileInput.click();
        }

        // ==================== ارسال همه نوع فایل ====================
        function handleFileSelect(file) {
            if (!file) {
                showNotification('لطفاً یک فایل انتخاب کنید');
                return;
            }
            
            if (file.size > 100 * 1024 * 1024) { // 100MB limit
                showNotification('حجم فایل باید کمتر از ۱۰۰ مگابایت باشد');
                return;
            }
            
            showLoading('در حال آماده‌سازی فایل...');
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64String = e.target.result;
                
                // تشخیص نوع فایل
                const fileType = detectFileType(file.name, file.type);
                
                hideLoading();
                sendFile(base64String, file.name, file.size, fileType);
            };
            
            reader.onerror = () => {
                hideLoading();
                showNotification('خطا در خواندن فایل');
            };
            
            reader.readAsDataURL(file);
            document.getElementById('fileInput').value = '';
        }
        
        function detectFileType(fileName, mimeType) {
            const extension = fileName.split('.').pop().toLowerCase();
            
            if (mimeType.startsWith('image/')) return 'image';
            if (mimeType.startsWith('video/')) return 'video';
            if (mimeType.startsWith('audio/')) return 'audio';
            if (mimeType.includes('pdf') || 
                mimeType.includes('document') || 
                mimeType.includes('text') ||
                ['txt', 'doc', 'docx', 'rtf', 'odt'].includes(extension)) return 'document';
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(extension)) return 'archive';
            
            return 'file';
        }
        
        function getFileIcon(fileType) {
            switch(fileType) {
                case 'image': return '📷';
                case 'video': return '🎥';
                case 'audio': return '🎵';
                case 'document': return '📄';
                case 'archive': return '📦';
                default: return '📎';
            }
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 بایت';
            const k = 1024;
            const sizes = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        
        function sendFile(base64String, fileName, fileSize, fileType) {
            if (!currentContact || !connections[currentContact.number]) {
                showNotification('اتصال برقرار نیست');
                return;
            }
            
            const fileId = generateId();
            const chunks = splitBase64IntoChunks(base64String, CHUNK_SIZE);
            const totalChunks = chunks.length;
            
            const uploadInfo = {
                fileId,
                fileName,
                fileSize,
                fileType,
                chunks,
                totalChunks,
                sentChunks: 0,
                base64String,
                messageId: generateId()
            };
            
            currentUploads.set(fileId, uploadInfo);
            
            // ارسال اطلاعات فایل
            connections[currentContact.number].send({
                type: 'file_start',
                fileId,
                fileName,
                fileSize,
                fileType,
                totalChunks,
                sender: myId,
                timestamp: Date.now(),
                messageId: uploadInfo.messageId,
                replyTo: replyingTo
            });
            
            // نمایش پیام در حال ارسال
            const messageData = {
                type: 'file',
                fileType: fileType,
                fileName: fileName,
                fileSize: fileSize,
                content: base64String,
                sender: myId,
                timestamp: Date.now(),
                messageId: uploadInfo.messageId,
                status: MESSAGE_STATUS.SENDING,
                replyTo: replyingTo
            };
            
            saveMessageLocally(messageData);
            displayFileUploadProgress(fileId, 0, totalChunks, fileName, fileType);
            
            // شروع ارسال تکه‌ها
            sendFileChunks(fileId);
            
            // ریست ریپلای
            cancelReply();
        }
        
        function splitBase64IntoChunks(base64String, chunkSize) {
            const chunks = [];
            for (let i = 0; i < base64String.length; i += chunkSize) {
                chunks.push(base64String.substring(i, i + chunkSize));
            }
            return chunks;
        }
        
        function sendFileChunks(fileId) {
            const uploadInfo = currentUploads.get(fileId);
            if (!uploadInfo) return;
            
            const conn = connections[currentContact.number];
            if (!conn) {
                currentUploads.delete(fileId);
                return;
            }
            
            const sendNextChunk = () => {
                if (uploadInfo.sentChunks >= uploadInfo.totalChunks) {
                    // تمام تکه‌ها ارسال شدند
                    conn.send({
                        type: 'file_end',
                        fileId,
                        sender: myId,
                        timestamp: Date.now()
                    });
                    
                    // بروزرسانی پیام به فایل کامل
                    updateMessageToFile(uploadInfo);
                    currentUploads.delete(fileId);
                    return;
                }
                
                // ارسال تکه فعلی
                conn.send({
                    type: 'file_chunk',
                    fileId,
                    chunkIndex: uploadInfo.sentChunks,
                    chunkData: uploadInfo.chunks[uploadInfo.sentChunks],
                    sender: myId,
                    timestamp: Date.now()
                });
                
                uploadInfo.sentChunks++;
                
                // بروزرسانی پیشرفت
                const progress = Math.round((uploadInfo.sentChunks / uploadInfo.totalChunks) * 100);
                updateFileUploadProgress(fileId, progress);
                
                // ارسال تکه بعدی با تأخیر کم
                setTimeout(sendNextChunk, 10);
            };
            
            sendNextChunk();
        }
        
        function displayFileUploadProgress(fileId, progress, totalChunks, fileName, fileType) {
            const container = document.getElementById('messagesArea');
            
            let progressEl = document.getElementById(`upload-${fileId}`);
            if (!progressEl) {
                progressEl = document.createElement('div');
                progressEl.id = `upload-${fileId}`;
                progressEl.className = 'message-wrapper outgoing';
                progressEl.innerHTML = `
                    <div class="message outgoing">
                        <div class="message-content">
                            <div style="margin-bottom: 8px;">${getFileIcon(fileType)} در حال ارسال ${fileName}...</div>
                            <div style="width: 200px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">
                                <div style="height: 100%; background: var(--accent-green); width: ${progress}%; transition: width 0.3s;"></div>
                            </div>
                            <div style="font-size: 12px; color: rgba(255,255,255,0.7); text-align: center; margin-top: 4px;">
                                ${progress}%
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(progressEl);
            }
            
            scrollToBottom();
        }
        
        function updateFileUploadProgress(fileId, progress) {
            const progressEl = document.getElementById(`upload-${fileId}`);
            if (progressEl) {
                const bar = progressEl.querySelector('div div');
                const text = progressEl.querySelector('div:last-child');
                if (bar) bar.style.width = `${progress}%`;
                if (text) text.textContent = `${progress}%`;
            }
        }
        
        function updateMessageToFile(uploadInfo) {
            const progressEl = document.getElementById(`upload-${uploadInfo.fileId}`);
            if (progressEl) {
                progressEl.remove();
            }
            
            const messageData = {
                type: 'file',
                fileType: uploadInfo.fileType,
                fileName: uploadInfo.fileName,
                fileSize: uploadInfo.fileSize,
                content: uploadInfo.base64String,
                sender: myId,
                timestamp: Date.now(),
                messageId: uploadInfo.messageId,
                status: MESSAGE_STATUS.SENT
            };
            
            displayFileMessage(messageData, true);
            updateContactLastMessage(currentContact.number, uploadInfo.fileName, 'file');
            renderContactsList();
        }
        
        function displayFileMessage(messageData, isOutgoing, noAnimation = false) {
            const container = document.getElementById('messagesArea');
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
            if (noAnimation) wrapper.style.animation = 'none';
            
            wrapper.onclick = () => {
                if (!isOutgoing) {
                    setReply(messageData);
                }
            };
            
            const time = formatTime(messageData.timestamp);
            const status = getStatusIcon(messageData.status);
            const fileIcon = getFileIcon(messageData.fileType);
            
            let replyHtml = '';
            if (messageData.replyTo) {
                replyHtml = `
                    <div class="reply-preview" onclick="scrollToMessage('${messageData.replyTo.messageId}')">
                        <div class="reply-sender">${messageData.replyTo.sender === myId ? 'شما' : messageData.replyTo.sender}</div>
                        <div class="reply-content">${messageData.replyTo.content}</div>
                    </div>
                `;
            }
            
            wrapper.innerHTML = `
                <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                    ${replyHtml}
                    <div class="file-message" onclick="downloadFile('${messageData.content}', '${messageData.fileName}')">
                        <div class="file-icon">${fileIcon}</div>
                        <div class="file-name">${escapeHtml(messageData.fileName)}</div>
                        <div class="file-size">${formatFileSize(messageData.fileSize)}</div>
                    </div>
                    <div class="message-footer">
                        <div class="message-time">${time}</div>
                        ${isOutgoing ? `<div class="message-status">${status}</div>` : ''}
                    </div>
                </div>
            `;
            
            container.appendChild(wrapper);
            wrapper.setAttribute('data-message-id', messageData.messageId);
            
            if (!noAnimation) {
                scrollToBottom();
            }
        }
        
        function downloadFile(base64String, fileName) {
            const link = document.createElement('a');
            link.href = base64String;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ==================== بقیه کدها (مثل قبل) ====================
        // ... (کدهای مدیریت مخاطبین، چت، ریپلای و سیستم تیک مثل نسخه قبلی)
        // برای جلوگیری از طولانی شدن، کدهای تکراری رو حذف کردم
        // تمام عملکردهای قبلی حفظ شده‌اند

        // ==================== Event Listeners جدید ====================
        document.addEventListener('DOMContentLoaded', function() {
            // ارسال با Enter در موبایل
            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // مدیریت ارتفاع خودکار
            textarea.addEventListener('input', function() {
                autoResize(this);
            });
            
            // بستن مدال فایل با کلیک خارج
            document.getElementById('fileTypeModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeFileTypeModal();
                }
            });
            
            // مدیریت کیبورد موبایل
            let originalHeight = window.innerHeight;
            
            window.addEventListener('resize', function() {
                if (window.innerHeight < originalHeight) {
                    // کیبورد باز شده
                    document.querySelector('.input-area').style.bottom = '0';
                } else {
                    // کیبورد بسته شده
                    document.querySelector('.input-area').style.bottom = 'auto';
                    scrollToBottom();
                }
                originalHeight = window.innerHeight;
            });
        });
        
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            const newHeight = Math.min(Math.max(textarea.scrollHeight, 44), 100);
            textarea.style.height = newHeight + 'px';
            
            // تنظیم ارتفاع نوار ورودی
            const inputArea = document.querySelector('.input-area');
            inputArea.style.height = Math.max(newHeight + 40, 70) + 'px';
            
            // فعال/غیرفعال کردن دکمه ارسال
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = textarea.value.trim() === '' || 
                !currentContact || 
                !currentContact.isOnline;
        }

        // ==================== بقیه توابع (مثل قبل) ====================
        // ... (initializePeer, loadPeerJS, createPeer, showPage, goToContacts, 
        // addNewContact, renderContactsList, openChat, connectToContact, 
        // handleIncomingConnection, sendMessage, handleIncomingMessage, 
        // displayMessage, scrollToBottom, formatTime, generateId, escapeHtml, 
        // showNotification, showLoading, hideLoading, etc.)
        
        // برای جلوگیری از طولانی شدن، فرض می‌کنیم بقیه توابع مثل نسخه قبلی هستند
        // و فقط توابع جدید اضافه شده‌اند

    </script>
</body>
</html>
