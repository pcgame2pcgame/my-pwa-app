<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>چت متنی P2P</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-surface: #334155;
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --border-color: #475569;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* صفحه راه‌اندازی */
        #setupPage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            transition: transform 0.5s ease;
        }

        #setupPage.hidden {
            transform: translateY(-100%);
        }

        .setup-card {
            background: var(--bg-surface);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .setup-logo {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .number-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1.2rem;
            text-align: center;
            font-family: monospace;
            transition: all 0.3s;
        }

        .number-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-success), #059669);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-danger), #dc2626);
            color: white;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* صفحه اصلی چت */
        #chatPage {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        #chatPage.active {
            display: flex;
        }

        /* لیست مخاطبین */
        #contactsPanel {
            width: 350px;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
        }

        #contactsPanel.hidden {
            display: none;
        }

        .contacts-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid var(--border-color);
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .contact-item.active {
            background: rgba(139, 92, 246, 0.1);
            border-right: 4px solid var(--accent-primary);
        }

        .contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .contact-last-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
        }

        .contact-status.offline {
            background: #ef4444;
        }

        /* پنجره چت */
        #chatWindow {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-right: 350px;
        }

        #chatWindow.full-width {
            margin-right: 0;
        }

        /* هدر چت */
        .chat-header {
            background: var(--bg-surface);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-contact-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-to-contacts {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
            padding: 5px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.offline {
            background: var(--accent-danger);
            animation: none;
        }

        /* پیام‌ها */
        #messagesContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 70%;
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            animation: fadeIn 0.3s ease;
            position: relative;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.outgoing {
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.incoming {
            background: var(--bg-surface);
            color: var(--text-primary);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            margin: 10px auto;
            text-align: center;
            max-width: 90%;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 0.9rem;
        }

        .message-sender {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 4px;
            display: block;
            font-weight: 500;
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
            text-align: left;
        }

        /* پیام عکس */
        .message-image-container {
            max-width: 300px;
            margin-top: 8px;
            position: relative;
        }

        .message-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            display: block;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .image-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* کنترل‌های پایین */
        .chat-controls {
            background: var(--bg-surface);
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
        }

        .text-input-container {
            display: flex;
            gap: 10px;
        }

        #textInput {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            height: 50px;
            min-height: 50px;
            max-height: 150px;
        }

        #textInput:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .send-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .image-upload-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .image-upload-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .upload-area {
            text-align: center;
            padding: 20px;
            border: 2px dashed var(--border-color);
            border-radius: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
            background: rgba(139, 92, 246, 0.1);
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-success);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            box-shadow: 0 10px 25px rgba(16, 185,
