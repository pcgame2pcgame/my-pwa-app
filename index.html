<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پیام‌رسان P2P</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a1017;
            --bg-secondary: #111b21;
            --bg-surface: #202c33;
            --bg-input: #2a3942;
            --accent-primary: #00a884;
            --accent-secondary: #53bdeb;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --text-muted: #667781;
            --border-color: #3a4a53;
            --message-incoming: #202c33;
            --message-outgoing: #005c4b;
            --status-online: #00a884;
            --status-offline: #667781;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* صفحات اصلی */
        .page {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page.hidden {
            transform: translateX(100%);
        }

        .page.active {
            transform: translateX(0);
        }

        /* هدر */
        .header {
            background: var(--bg-secondary);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow);
            z-index: 100;
            position: relative;
            min-height: 60px;
        }

        .header-title {
            flex: 1;
            font-size: 17px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            font-size: 22px;
        }

        /* آواتار */
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .avatar.small {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        /* صفحه لاگین */
        #loginPage {
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-primary), #1a242c);
        }

        .login-container {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-icon {
            font-size: 70px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00a884, #53bdeb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            text-align: center;
            font-size: 14px;
        }

        .number-input {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 20px;
            text-align: center;
            font-family: monospace;
            transition: all 0.3s;
            font-weight: 500;
        }

        .number-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #008f70;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 168, 132, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* صفحه مخاطبین */
        .search-bar {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 16px;
            text-align: right;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent-primary);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-primary);
            -webkit-overflow-scrolling: touch;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            min-height: 72px;
        }

        .contact-item:active {
            background: var(--bg-secondary);
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-last-message {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-align: left;
        }

        .contact-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--status-online);
            flex-shrink: 0;
        }

        .contact-status.offline {
            background: var(--status-offline);
        }

        /* صفحه چت - ساختار جدید */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ناحیه پیام‌ها */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: linear-gradient(180deg, var(--bg-primary) 0%, #0c151d 100%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        /* پیام‌ها */
        .message-wrapper {
            max-width: 85%;
            position: relative;
            animation: messageAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-wrapper.incoming {
            align-self: flex-start;
        }

        .message-wrapper.outgoing {
            align-self: flex-end;
        }

        .message {
            padding: 10px 14px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            max-width: 100%;
        }

        .message.incoming {
            background: var(--message-incoming);
            border-top-right-radius: 4px;
        }

        .message.outgoing {
            background: var(--message-outgoing);
            border-top-left-radius: 4px;
        }

        .message-content {
            font-size: 16px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            direction: ltr;
        }

        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            opacity: 0.8;
        }

        .message-status {
            display: flex;
            gap: 2px;
        }

        .status-icon {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .status-icon.sent {
            color: #90caf9;
        }

        .status-icon.delivered {
            color: #4fc3f7;
        }

        .status-icon.read {
            color: var(--accent-primary);
        }

        .message-sender {
            font-size: 12px;
            color: var(--accent-primary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* پیام سیستم */
        .system-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 10px 16px;
            margin: 8px auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            max-width: 90%;
        }

        /* عکس در پیام */
        .message-image-container {
            position: relative;
            margin: 4px 0;
            border-radius: 12px;
            overflow: hidden;
            max-width: 280px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message-image {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .message-image.loaded {
            opacity: 1;
        }

        .message-image:active {
            transform: scale(0.98);
        }

        .image-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(10px);
        }

        /* نوار ورودی پیام - کاملاً بازنویسی شده */
        .input-area {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            position: relative;
            min-height: 70px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            transition: all 0.3s;
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-input);
            border-radius: 24px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
        }

        #messageInput {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 16px;
            resize: none;
            max-height: 120px;
            min-height: 26px;
            padding: 0;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn.attach {
            color: var(--text-secondary);
        }

        .action-btn.send {
            background: var(--accent-primary);
            color: white;
            width: 46px;
            height: 46px;
        }

        .action-btn.send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--bg-input);
            color: var(--text-muted);
        }

        .action-btn.send:not(:disabled):hover {
            background: #008f70;
            transform: scale(1.05);
        }

        /* مدال‌ها */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-primary);
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 2000;
            animation: slideIn 0.3s, fadeOut 0.3s 2.7s;
            box-shadow: var(--shadow);
            max-width: 300px;
            backdrop-filter: blur(10px);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* اسکرول بار */
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .contacts-list::-webkit-scrollbar {
            width: 6px;
        }

        .contacts-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .contacts-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* لودینگ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* نوار پیشرفت */
        .progress-message {
            background: var(--message-incoming);
            padding: 12px 16px;
            border-radius: 18px;
            margin: 8px;
            max-width: 85%;
            align-self: flex-start;
        }

        .progress-container {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* مخاطب جدید */
        .new-contact-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            border: none;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 168, 132, 0.4);
            transition: all 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .new-contact-btn:active {
            transform: scale(0.95);
        }

        /* برای کیبورد موبایل */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .input-area {
                padding-bottom: calc(12px + env(safe-area-inset-bottom));
            }
        }

        /* انیمیشن‌های اضافی */
        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        .bounce-in {
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* حالت تایپ کردن */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--message-incoming);
            border-radius: 18px;
            max-width: 85%;
            align-self: flex-start;
            margin-bottom: 8px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* استایل برای موبایل */
        @media (max-width: 480px) {
            .message-wrapper {
                max-width: 90%;
            }
            
            .message-image-container {
                max-width: 240px;
            }
            
            .header {
                padding: 12px;
            }
            
            .input-area {
                padding: 12px;
            }
        }

        /* برای دسکتاپ */
        @media (min-width: 768px) {
            body {
                max-width: 500px;
                margin: 0 auto;
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
                height: 90vh;
                top: 5vh;
                border-radius: 24px;
                overflow: hidden;
            }
            
            .new-contact-btn {
                bottom: 30px;
                left: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- صفحه لاگین -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <div class="app-icon">💬</div>
            <h1 style="margin-bottom: 30px; font-size: 26px;">پیام‌رسان P2P</h1>
            
            <div class="input-group">
                <label class="input-label">شماره خود را وارد کنید</label>
                <input type="number" class="number-input" id="myIdInput" 
                       placeholder="مثلاً: 123456" maxlength="9" inputmode="numeric" autofocus>
                <small style="display: block; margin-top: 12px; color: var(--text-muted); font-size: 13px;">
                    این شماره شناسه منحصر به فرد شما خواهد بود
                </small>
            </div>
            
            <button class="btn btn-primary" onclick="initializePeer()" id="loginBtn">
                <span>ورود و شروع</span>
                <span>→</span>
            </button>
        </div>
    </div>

    <!-- صفحه مخاطبین -->
    <div id="contactsPage" class="page hidden">
        <div class="header">
            <div class="header-title">مخاطبین</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleSearch()">🔍</button>
            </div>
        </div>

        <div class="search-bar" id="searchBar" style="display: none;">
            <input type="text" class="search-input" id="searchInput" placeholder="جستجو..." 
                   oninput="filterContacts()" autocomplete="off">
        </div>

        <div class="contacts-list" id="contactsList">
            <!-- مخاطبین اینجا لود می‌شوند -->
        </div>

        <button class="new-contact-btn" onclick="showNewContactModal()">+</button>
    </div>

    <!-- صفحه چت -->
    <div id="chatPage" class="page hidden">
        <div class="header">
            <button class="icon-btn back-btn" onclick="goToContacts()">←</button>
            <div class="avatar" id="chatAvatar">?</div>
            <div style="flex: 1; min-width: 0;">
                <div class="header-title" id="chatContactName">مخاطب</div>
                <div style="font-size: 13px; color: var(--text-secondary);" id="chatContactStatus">
                    <span>آفلاین</span>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages-area" id="messagesArea">
                <!-- پیام‌ها اینجا نمایش داده می‌شوند -->
            </div>

            <div class="input-area">
                <button class="action-btn attach" onclick="openImagePicker()" title="ارسال عکس">
                    📎
                </button>
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="پیام خود را بنویسید..." 
                              rows="1" oninput="autoResize(this)"></textarea>
                </div>
                <button class="action-btn send" onclick="sendMessage()" id="sendBtn" disabled>
                    ↑
                </button>
            </div>
        </div>
    </div>

    <!-- مدال‌ها -->
    <div id="newContactModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">مخاطب جدید</h2>
            <input type="number" class="number-input" id="newContactNumber" 
                   placeholder="شماره مخاطب" style="margin-bottom: 16px;">
            <input type="text" class="number-input" id="newContactName" 
                   placeholder="نام مخاطب (اختیاری)" style="margin-bottom: 24px;">
            <div style="display: flex; gap: 12px;">
                <button class="btn" onclick="closeNewContactModal()" 
                        style="background: var(--bg-surface); flex: 1;">لغو</button>
                <button class="btn btn-primary" onclick="addNewContact()" style="flex: 1;">افزودن</button>
            </div>
        </div>
    </div>

    <!-- مدال عکس -->
    <div class="modal" id="imageModal">
        <div class="modal-content" style="max-width: 90%; padding: 0; background: transparent;">
            <img class="modal-image" id="modalImage" src="" alt="عکس" 
                 style="width: 100%; height: auto; border-radius: 12px;">
        </div>
    </div>

    <!-- لودینگ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- فایل اینپوت مخفی -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;" 
           onchange="handleImageSelect(this.files[0])" capture="environment">

    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let myId = null;
        let currentContact = null;
        let contacts = {};
        let connections = {};
        let pendingMessages = new Map(); // برای پیگیری وضعیت پیام‌ها
        
        // سیستم تیک‌ها
        const MESSAGE_STATUS = {
            SENDING: 'sending',
            SENT: 'sent',
            DELIVERED: 'delivered',
            READ: 'read'
        };
        
        // مدیریت فایل‌های بزرگ
        const CHUNK_SIZE = 64000; // 64KB chunks (بهینه‌شده)
        const MAX_RETRIES = 3;
        let currentUploads = new Map();
        let receivingFiles = new Map();

        // ==================== راه‌اندازی اولیه ====================
        function initializePeer() {
            const myIdInput = document.getElementById('myIdInput').value.trim();
            
            if (!myIdInput || myIdInput.length < 3) {
                showNotification('لطفاً یک شماره معتبر وارد کنید');
                return;
            }
            
            myId = myIdInput.padStart(9, '0').slice(-9);
            document.getElementById('loginBtn').disabled = true;
            
            showLoading('در حال راه‌اندازی...');
            
            if (typeof Peer === 'undefined') {
                loadPeerJS();
            } else {
                createPeer();
            }
        }
        
        function loadPeerJS() {
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js';
            script.onload = createPeer;
            script.onerror = () => {
                hideLoading();
                showNotification('خطا در بارگذاری سیستم');
                document.getElementById('loginBtn').disabled = false;
            };
            document.head.appendChild(script);
        }
        
        function createPeer() {
            // استفاده از سرور اختصاصی برای اطمینان بیشتر
            peer = new Peer(myId, {
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                debug: 0,
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (id) => {
                console.log('✅ سیستم راه‌اندازی شد:', id);
                loadContacts();
                showPage('contactsPage');
                hideLoading();
                showNotification(`خوش آمدید ${myId}!`);
                
                // شروع نظارت بر اتصالات
                setInterval(checkConnections, 5000);
            });
            
            peer.on('connection', (conn) => {
                handleIncomingConnection(conn);
            });
            
            peer.on('error', (err) => {
                console.error('خطا:', err);
                if (err.type === 'unavailable-id') {
                    showNotification('این شماره قبلاً استفاده شده');
                    document.getElementById('loginBtn').disabled = false;
                }
            });
            
            peer.on('disconnected', () => {
                showNotification('اتصال قطع شد. در حال تلاش مجدد...');
                setTimeout(() => peer.reconnect(), 2000);
            });
        }

        // ==================== مدیریت صفحات ====================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
                setTimeout(() => page.classList.add('hidden'), 300);
            });
            
            const page = document.getElementById(pageId);
            page.classList.remove('hidden');
            setTimeout(() => {
                page.classList.add('active');
                if (pageId === 'contactsPage') {
                    renderContactsList();
                    document.getElementById('searchBar').style.display = 'none';
                } else if (pageId === 'chatPage' && currentContact) {
                    loadChatMessages();
                    setTimeout(() => {
                        document.getElementById('messageInput').focus();
                        scrollToBottom();
                    }, 100);
                }
            }, 10);
        }
        
        function goToContacts() {
            currentContact = null;
            showPage('contactsPage');
        }
        
        function toggleSearch() {
            const searchBar = document.getElementById('searchBar');
            searchBar.style.display = searchBar.style.display === 'none' ? 'block' : 'none';
            if (searchBar.style.display === 'block') {
                document.getElementById('searchInput').focus();
            }
        }
        
        function filterContacts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const contactItems = document.querySelectorAll('.contact-item');
            
            contactItems.forEach(item => {
                const name = item.querySelector('.contact-name').textContent.toLowerCase();
                const number = item.querySelector('.contact-last-message').textContent.toLowerCase();
                
                if (name.includes(searchTerm) || number.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // ==================== مدیریت مخاطبین ====================
        function loadContacts() {
            const savedContacts = localStorage.getItem(`p2p_contacts_${myId}`);
            if (savedContacts) {
                contacts = JSON.parse(savedContacts);
                Object.values(contacts).forEach(contact => {
                    contact.isOnline = false;
                    contact.messages = contact.messages || [];
                });
            }
        }
        
        function saveContacts() {
            localStorage.setItem(`p2p_contacts_${myId}`, JSON.stringify(contacts));
        }
        
        function showNewContactModal() {
            document.getElementById('newContactModal').classList.add('active');
            document.getElementById('newContactNumber').focus();
        }
        
        function closeNewContactModal() {
            document.getElementById('newContactModal').classList.remove('active');
            document.getElementById('newContactNumber').value = '';
            document.getElementById('newContactName').value = '';
        }
        
        function addNewContact() {
            const numberInput = document.getElementById('newContactNumber');
            const nameInput = document.getElementById('newContactName');
            
            const contactNumber = numberInput.value.trim().padStart(9, '0').slice(-9);
            const contactName = nameInput.value.trim() || contactNumber;
            
            if (!contactNumber || contactNumber.length < 3) {
                showNotification('لطفاً شماره معتبر وارد کنید');
                return;
            }
            
            if (contactNumber === myId) {
                showNotification('نمی‌توانید خودتان را اضافه کنید');
                return;
            }
            
            if (contacts[contactNumber]) {
                showNotification('این مخاطب از قبل وجود دارد');
                return;
            }
            
            contacts[contactNumber] = {
                number: contactNumber,
                name: contactName,
                lastMessage: '',
                lastMessageTime: null,
                messages: [],
                isOnline: false,
                avatar: contactNumber.charAt(0),
                unread: 0
            };
            
            saveContacts();
            renderContactsList();
            closeNewContactModal();
            showNotification(`مخاطب ${contactName} اضافه شد`);
            
            // اتصال خودکار
            setTimeout(() => connectToContact(contactNumber), 500);
        }
        
        function renderContactsList() {
            const container = document.getElementById('contactsList');
            
            if (Object.keys(contacts).length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <div style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;">👤</div>
                        <p style="color: var(--text-secondary); margin-bottom: 10px;">هنوز مخاطبی ندارید</p>
                        <p style="color: var(--text-muted); font-size: 14px;">روی دکمه + کلیک کنید</p>
                    </div>
                `;
                return;
            }
            
            const sortedContacts = Object.values(contacts).sort((a, b) => {
                return (b.lastMessageTime || 0) - (a.lastMessageTime || 0);
            });
            
            container.innerHTML = '';
            
            sortedContacts.forEach(contact => {
                const element = document.createElement('div');
                element.className = 'contact-item';
                element.onclick = () => openChat(contact);
                
                let lastMessage = 'شروع گفتگو';
                let lastTime = '';
                
                if (contact.messages && contact.messages.length > 0) {
                    const lastMsg = contact.messages[contact.messages.length - 1];
                    if (lastMsg.type === 'image') {
                        lastMessage = '📷 عکس';
                    } else if (lastMsg.type === 'file') {
                        lastMessage = '📁 فایل';
                    } else {
                        lastMessage = lastMsg.content.substring(0, 30);
                        if (lastMsg.content.length > 30) lastMessage += '...';
                    }
                    
                    lastTime = formatTime(lastMsg.timestamp);
                }
                
                element.innerHTML = `
                    <div class="avatar small">${contact.avatar}</div>
                    <div class="contact-info">
                        <div class="contact-name">${contact.name}</div>
                        <div class="contact-last-message">${lastMessage}</div>
                    </div>
                    <div style="text-align: left; min-width: 60px;">
                        <div class="contact-time">${lastTime}</div>
                        <div class="contact-status ${contact.isOnline ? '' : 'offline'}"></div>
                    </div>
                `;
                
                container.appendChild(element);
            });
        }

        // ==================== مدیریت چت و اتصالات ====================
        function openChat(contact) {
            currentContact = contact;
            contact.unread = 0;
            
            document.getElementById('chatContactName').textContent = contact.name;
            document.getElementById('chatAvatar').textContent = contact.avatar;
            updateContactStatus();
            
            showPage('chatPage');
            
            if (!contact.isOnline && !connections[contact.number]) {
                connectToContact(contact.number);
            }
        }
        
        function connectToContact(contactNumber) {
            if (!peer || peer.disconnected) return;
            
            if (connections[contactNumber]) {
                connections[contactNumber].close();
            }
            
            showNotification(`در حال اتصال به ${contactNumber}...`);
            
            const conn = peer.connect(contactNumber, {
                reliable: true,
                serialization: 'json',
                metadata: { type: 'chat', version: '1.0' }
            });
            
            setupConnection(conn, contactNumber);
            connections[contactNumber] = conn;
        }
        
        function handleIncomingConnection(conn) {
            const contactNumber = conn.peer;
            
            if (!contacts[contactNumber]) {
                contacts[contactNumber] = {
                    number: contactNumber,
                    name: contactNumber,
                    messages: [],
                    isOnline: true,
                    avatar: contactNumber.charAt(0),
                    unread: 0
                };
                saveContacts();
            }
            
            setupConnection(conn, contactNumber);
            connections[contactNumber] = conn;
            
            contacts[contactNumber].isOnline = true;
            if (currentContact && currentContact.number === contactNumber) {
                updateContactStatus();
            }
            
            renderContactsList();
        }
        
        function setupConnection(conn, contactNumber) {
            conn.on('open', () => {
                console.log(`✅ متصل شد به ${contactNumber}`);
                
                contacts[contactNumber].isOnline = true;
                if (currentContact && currentContact.number === contactNumber) {
                    updateContactStatus();
                }
                
                renderContactsList();
                
                // ارسال پیام سلام
                if (!contacts[contactNumber].messages || contacts[contactNumber].messages.length === 0) {
                    conn.send({
                        type: 'system',
                        content: 'اتصال برقرار شد',
                        timestamp: Date.now()
                    });
                }
            });
            
            conn.on('data', (data) => {
                handleIncomingData(data, contactNumber);
            });
            
            conn.on('close', () => {
                console.log(`❌ اتصال بسته شد با ${contactNumber}`);
                
                contacts[contactNumber].isOnline = false;
                if (currentContact && currentContact.number === contactNumber) {
                    updateContactStatus();
                }
                
                delete connections[contactNumber];
                renderContactsList();
                
                // تلاش مجدد برای اتصال
                if (currentContact && currentContact.number === contactNumber) {
                    setTimeout(() => connectToContact(contactNumber), 3000);
                }
            });
            
            conn.on('error', (err) => {
                console.error(`خطای اتصال با ${contactNumber}:`, err);
            });
        }
        
        function updateContactStatus() {
            if (!currentContact) return;
            
            const statusEl = document.getElementById('chatContactStatus');
            const sendBtn = document.getElementById('sendBtn');
            
            if (currentContact.isOnline) {
                statusEl.innerHTML = `<span style="color: var(--status-online)">آنلاین</span>`;
                sendBtn.disabled = false;
            } else {
                statusEl.innerHTML = `<span style="color: var(--status-offline)">آفلاین</span>`;
                sendBtn.disabled = true;
            }
        }
        
        function checkConnections() {
            Object.keys(connections).forEach(number => {
                if (connections[number].open) {
                    // ارسال پینگ برای نگه داشتن اتصال
                    connections[number].send({
                        type: 'ping',
                        timestamp: Date.now()
                    });
                }
            });
        }

        // ==================== سیستم ارسال و دریافت پیام‌ها با تیک ====================
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentContact) return;
            
            const conn = connections[currentContact.number];
            if (!conn || !conn.open) {
                showNotification('اتصال برقرار نیست');
                return;
            }
            
            const messageId = generateId();
            const messageData = {
                type: 'text',
                content: message,
                sender: myId,
                receiver: currentContact.number,
                timestamp: Date.now(),
                messageId: messageId,
                status: MESSAGE_STATUS.SENDING
            };
            
            // ذخیره در تاریخچه با وضعیت ارسال
            saveMessageLocally(messageData);
            
            // نمایش با تیک در حال ارسال
            displayMessage(messageData, true);
            
            // ارسال از طریق اتصال
            conn.send({
                ...messageData,
                status: MESSAGE_STATUS.SENT
            });
            
            // ذخیره در pending برای پیگیری تیک
            pendingMessages.set(messageId, {
                data: messageData,
                retries: 0,
                delivered: false
            });
            
            // پاک کردن input
            input.value = '';
            autoResize(input);
            input.focus();
            
            // بروزرسانی مخاطبین
            updateContactLastMessage(currentContact.number, message, 'text');
            renderContactsList();
            
            // شروع چک کردن تحویل
            checkMessageDelivery(messageId);
        }
        
        function handleIncomingData(data, senderNumber) {
            switch (data.type) {
                case 'text':
                    handleIncomingMessage(data, senderNumber);
                    break;
                case 'image':
                    handleIncomingImage(data, senderNumber);
                    break;
                case 'file_chunk':
                    handleFileChunk(data, senderNumber);
                    break;
                case 'file_start':
                    startReceivingFile(data, senderNumber);
                    break;
                case 'file_end':
                    completeReceivingFile(data, senderNumber);
                    break;
                case 'message_status':
                    updateMessageStatus(data.messageId, data.status);
                    break;
                case 'ping':
                    // پاسخ به پینگ
                    if (connections[senderNumber]) {
                        connections[senderNumber].send({
                            type: 'pong',
                            timestamp: Date.now()
                        });
                    }
                    break;
            }
        }
        
        function handleIncomingMessage(data, senderNumber) {
            // ارسال تأییدیه تحویل
            if (connections[senderNumber]) {
                connections[senderNumber].send({
                    type: 'message_status',
                    messageId: data.messageId,
                    status: MESSAGE_STATUS.DELIVERED
                });
            }
            
            data.status = MESSAGE_STATUS.DELIVERED;
            saveMessageLocally(data, false);
            
            if (currentContact && currentContact.number === senderNumber) {
                displayMessage(data, false);
            }
            
            updateContactLastMessage(senderNumber, data.content, 'text');
            renderContactsList();
            
            // نوتیفیکیشن
            if (!currentContact || currentContact.number !== senderNumber) {
                const contact = contacts[senderNumber];
                showNotification(`${contact ? contact.name : senderNumber}: ${data.content.substring(0, 30)}`);
            }
        }
        
        function handleIncomingImage(data, senderNumber) {
            // ارسال تأییدیه تحویل
            if (connections[senderNumber]) {
                connections[senderNumber].send({
                    type: 'message_status',
                    messageId: data.messageId,
                    status: MESSAGE_STATUS.DELIVERED
                });
            }
            
            data.status = MESSAGE_STATUS.DELIVERED;
            saveMessageLocally(data, false);
            
            if (currentContact && currentContact.number === senderNumber) {
                displayImageMessage(data, false);
            }
            
            updateContactLastMessage(senderNumber, '📷 عکس', 'image');
            renderContactsList();
            
            // نوتیفیکیشن
            if (!currentContact || currentContact.number !== senderNumber) {
                const contact = contacts[senderNumber];
                showNotification(`${contact ? contact.name : senderNumber}: 📷 عکس جدید`);
            }
        }
        
        function updateMessageStatus(messageId, status) {
            const pending = pendingMessages.get(messageId);
            if (pending) {
                pending.delivered = true;
                
                // بروزرسانی تیک در UI
                updateMessageStatusUI(messageId, status);
                
                // بروزرسانی در تاریخچه
                const contactMessages = currentContact?.messages;
                if (contactMessages) {
                    const msgIndex = contactMessages.findIndex(m => m.messageId === messageId);
                    if (msgIndex > -1) {
                        contactMessages[msgIndex].status = status;
                        saveContacts();
                    }
                }
            }
        }
        
        function checkMessageDelivery(messageId) {
            const pending = pendingMessages.get(messageId);
            if (!pending) return;
            
            if (!pending.delivered && pending.retries < 3) {
                pending.retries++;
                setTimeout(() => checkMessageDelivery(messageId), 2000);
            } else if (!pending.delivered) {
                // بعد از 3 بار تلاش، به عنوان ارسال شده علامت بزن
                updateMessageStatusUI(messageId, MESSAGE_STATUS.SENT);
            }
        }

        // ==================== سیستم ارسال عکس‌های بزرگ ====================
        function openImagePicker() {
            document.getElementById('imageInput').click();
        }
        
        function handleImageSelect(file) {
            if (!file || !file.type.startsWith('image/')) {
                showNotification('لطفاً یک فایل عکس انتخاب کنید');
                return;
            }
            
            if (file.size > 50 * 1024 * 1024) { // 50MB limit
                showNotification('حجم عکس باید کمتر از ۵۰ مگابایت باشد');
                return;
            }
            
            showLoading('در حال آماده‌سازی عکس...');
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64String = e.target.result;
                
                // فشرده‌سازی برای عکس‌های بزرگ
                let processedImage = base64String;
                if (file.size > 5 * 1024 * 1024) {
                    processedImage = await compressImage(base64String);
                }
                
                hideLoading();
                sendLargeImage(processedImage, file.name, file.type);
            };
            
            reader.onerror = () => {
                hideLoading();
                showNotification('خطا در خواندن فایل');
            };
            
            reader.readAsDataURL(file);
            document.getElementById('imageInput').value = '';
        }
        
        async function compressImage(base64String) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // محاسبه ابعاد جدید با حفظ نسبت
                    let width = img.width;
                    let height = img.height;
                    const maxWidth = 1920;
                    const maxHeight = 1920;
                    
                    if (width > maxWidth || height > maxHeight) {
                        const ratio = Math.min(maxWidth / width, maxHeight / height);
                        width = Math.floor(width * ratio);
                        height = Math.floor(height * ratio);
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // کشیدن تصویر با کیفیت مناسب
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // تبدیل به base64 با کیفیت مناسب
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    resolve(compressedBase64);
                };
                
                img.src = base64String;
            });
        }
        
        function sendLargeImage(base64String, fileName, fileType) {
            if (!currentContact || !connections[currentContact.number]) {
                showNotification('اتصال برقرار نیست');
                return;
            }
            
            const fileId = generateId();
            const chunks = splitBase64IntoChunks(base64String, CHUNK_SIZE);
            const totalChunks = chunks.length;
            
            const uploadInfo = {
                fileId,
                fileName,
                fileType,
                chunks,
                totalChunks,
                sentChunks: 0,
                base64String,
                messageId: generateId()
            };
            
            currentUploads.set(fileId, uploadInfo);
            
            // ارسال اطلاعات فایل
            connections[currentContact.number].send({
                type: 'file_start',
                fileId,
                fileName,
                totalChunks,
                fileType: 'image',
                sender: myId,
                timestamp: Date.now(),
                messageId: uploadInfo.messageId
            });
            
            // نمایش پیام در حال ارسال
            const messageData = {
                type: 'image',
                content: base64String,
                sender: myId,
                timestamp: Date.now(),
                messageId: uploadInfo.messageId,
                status: MESSAGE_STATUS.SENDING,
                uploadProgress: 0
            };
            
            saveMessageLocally(messageData);
            displayUploadProgress(fileId, 0, totalChunks);
            
            // شروع ارسال تکه‌ها
            sendChunks(fileId);
        }
        
        function splitBase64IntoChunks(base64String, chunkSize) {
            const chunks = [];
            let index = 0;
            
            while (index < base64String.length) {
                chunks.push(base64String.substring(index, index + chunkSize));
                index += chunkSize;
            }
            
            return chunks;
        }
        
        function sendChunks(fileId) {
            const uploadInfo = currentUploads.get(fileId);
            if (!uploadInfo) return;
            
            const conn = connections[currentContact.number];
            if (!conn) {
                currentUploads.delete(fileId);
                return;
            }
            
            const sendNext = () => {
                if (uploadInfo.sentChunks >= uploadInfo.totalChunks) {
                    // تمام تکه‌ها ارسال شدند
                    conn.send({
                        type: 'file_end',
                        fileId,
                        sender: myId,
                        timestamp: Date.now()
                    });
                    
                    // بروزرسانی پیام به عکس کامل
                    updateMessageToImage(uploadInfo);
                    currentUploads.delete(fileId);
                    return;
                }
                
                // ارسال تکه فعلی
                conn.send({
                    type: 'file_chunk',
                    fileId,
                    chunkIndex: uploadInfo.sentChunks,
                    chunkData: uploadInfo.chunks[uploadInfo.sentChunks],
                    sender: myId,
                    timestamp: Date.now()
                });
                
                uploadInfo.sentChunks++;
                
                // بروزرسانی پیشرفت
                const progress = Math.round((uploadInfo.sentChunks / uploadInfo.totalChunks) * 100);
                updateUploadProgress(fileId, progress);
                
                // ارسال تکه بعدی با تأخیر کنترل‌شده
                setTimeout(sendNext, 10); // کاهش تأخیر برای سرعت بیشتر
            };
            
            sendNext();
        }
        
        function startReceivingFile(data, senderNumber) {
            const { fileId, fileName, totalChunks, fileType, messageId } = data;
            
            receivingFiles.set(fileId, {
                fileId,
                fileName,
                fileType,
                totalChunks,
                receivedChunks: 0,
                chunks: new Array(totalChunks),
                sender: senderNumber,
                messageId,
                startTime: Date.now()
            });
            
            // نمایش نوار پیشرفت
            displayDownloadProgress(fileId, 0, totalChunks);
        }
        
        function handleFileChunk(data, senderNumber) {
            const { fileId, chunkIndex, chunkData } = data;
            const fileInfo = receivingFiles.get(fileId);
            
            if (!fileInfo) return;
            
            // ذخیره تکه
            fileInfo.chunks[chunkIndex] = chunkData;
            fileInfo.receivedChunks++;
            
            // بروزرسانی پیشرفت
            const progress = Math.round((fileInfo.receivedChunks / fileInfo.totalChunks) * 100);
            updateDownloadProgress(fileId, progress);
            
            // بررسی تکمیل
            if (fileInfo.receivedChunks === fileInfo.totalChunks) {
                // منتظر بمان تا مطمئن شویم همه تکه‌ها آماده‌اند
                setTimeout(() => {
                    const finalFileInfo = receivingFiles.get(fileId);
                    if (finalFileInfo && finalFileInfo.receivedChunks === finalFileInfo.totalChunks) {
                        completeReceivingFile({ fileId }, senderNumber);
                    }
                }, 100);
            }
        }
        
        function completeReceivingFile(data, senderNumber) {
            const { fileId } = data;
            const fileInfo = receivingFiles.get(fileId);
            
            if (!fileInfo) return;
            
            // سرهم کردن تکه‌ها
            const base64String = fileInfo.chunks.join('');
            
            // حذف از receivingFiles
            receivingFiles.delete(fileId);
            
            // حذف نوار پیشرفت
            removeProgress(fileId);
            
            // ایجاد پیام نهایی
            const messageData = {
                type: 'image',
                content: base64String,
                sender: fileInfo.sender,
                timestamp: Date.now(),
                messageId: fileInfo.messageId,
                status: MESSAGE_STATUS.DELIVERED
            };
            
            // ارسال تأییدیه
            if (connections[senderNumber]) {
                connections[senderNumber].send({
                    type: 'message_status',
                    messageId: fileInfo.messageId,
                    status: MESSAGE_STATUS.DELIVERED
                });
            }
            
            // ذخیره و نمایش
            saveMessageLocally(messageData, false);
            
            if (currentContact && currentContact.number === senderNumber) {
                displayImageMessage(messageData, false);
            }
            
            updateContactLastMessage(senderNumber, '📷 عکس', 'image');
            renderContactsList();
            
            // نوتیفیکیشن
            if (!currentContact || currentContact.number !== senderNumber) {
                const contact = contacts[senderNumber];
                showNotification(`${contact ? contact.name : senderNumber}: 📷 عکس جدید`);
            }
        }

        // ==================== نمایش پیام‌ها و UI ====================
        function loadChatMessages() {
            const container = document.getElementById('messagesArea');
            container.innerHTML = '';
            
            if (!currentContact || !currentContact.messages || currentContact.messages.length === 0) {
                container.innerHTML = `
                    <div class="system-message">
                        <p>شروع گفتگو با ${currentContact.name}</p>
                        <p style="font-size: 12px; margin-top: 8px; opacity: 0.7;">
                            پیام خود را در پایین صفحه بنویسید
                        </p>
                    </div>
                `;
                return;
            }
            
            currentContact.messages.forEach(msg => {
                if (msg.type === 'image') {
                    displayImageMessage(msg, msg.sender === myId, true);
                } else {
                    displayMessage(msg, msg.sender === myId, true);
                }
            });
            
            scrollToBottom();
        }
        
        function displayMessage(messageData, isOutgoing, noAnimation = false) {
            const container = document.getElementById('messagesArea');
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
            if (noAnimation) wrapper.style.animation = 'none';
            
            const time = formatTime(messageData.timestamp);
            const status = getStatusIcon(messageData.status);
            
            wrapper.innerHTML = `
                <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                    ${!isOutgoing ? `<div class="message-sender">${messageData.sender}</div>` : ''}
                    <div class="message-content">${escapeHtml(messageData.content)}</div>
                    <div class="message-footer">
                        <div class="message-time">${time}</div>
                        ${isOutgoing ? `<div class="message-status">${status}</div>` : ''}
                    </div>
                </div>
            `;
            
            container.appendChild(wrapper);
            
            if (!noAnimation) {
                scrollToBottom();
            }
        }
        
        function displayImageMessage(messageData, isOutgoing, noAnimation = false) {
            const container = document.getElementById('messagesArea');
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
            if (noAnimation) wrapper.style.animation = 'none';
            
            const time = formatTime(messageData.timestamp);
            const status = getStatusIcon(messageData.status);
            
            wrapper.innerHTML = `
                <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                    ${!isOutgoing ? `<div class="message-sender">${messageData.sender}</div>` : ''}
                    <div class="message-image-container">
                        <div class="image-badge">📷 عکس</div>
                        <img src="${messageData.content}" 
                             class="message-image"
                             onclick="showImageInModal('${messageData.content.replace(/'/g, "\\'")}')"
                             onload="this.classList.add('loaded')"
                             alt="عکس">
                    </div>
                    <div class="message-footer">
                        <div class="message-time">${time}</div>
                        ${isOutgoing ? `<div class="message-status">${status}</div>` : ''}
                    </div>
                </div>
            `;
            
            container.appendChild(wrapper);
            
            if (!noAnimation) {
                scrollToBottom();
            }
        }
        
        function displayUploadProgress(fileId, progress, totalChunks) {
            const container = document.getElementById('messagesArea');
            
            let progressEl = document.getElementById(`upload-${fileId}`);
            if (!progressEl) {
                progressEl = document.createElement('div');
                progressEl.id = `upload-${fileId}`;
                progressEl.className = 'message-wrapper outgoing';
                progressEl.innerHTML = `
                    <div class="message outgoing">
                        <div class="message-content">
                            <div style="margin-bottom: 8px;">📷 در حال ارسال عکس...</div>
                            <div class="progress-container">
                                <div class="progress-bar" style="width: ${progress}%"></div>
                            </div>
                            <div style="font-size: 12px; color: rgba(255,255,255,0.7); text-align: center; margin-top: 4px;">
                                ${progress}% - ${totalChunks} تکه
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(progressEl);
            } else {
                const bar = progressEl.querySelector('.progress-bar');
                const text = progressEl.querySelector('div:last-child');
                if (bar) bar.style.width = `${progress}%`;
                if (text) text.textContent = `${progress}% - ${totalChunks} تکه`;
            }
            
            scrollToBottom();
        }
        
        function displayDownloadProgress(fileId, progress, totalChunks) {
            const container = document.getElementById('messagesArea');
            
            let progressEl = document.getElementById(`download-${fileId}`);
            if (!progressEl) {
                progressEl = document.createElement('div');
                progressEl.id = `download-${fileId}`;
                progressEl.className = 'message-wrapper incoming';
                progressEl.innerHTML = `
                    <div class="message incoming">
                        <div class="message-content">
                            <div style="margin-bottom: 8px;">📷 در حال دریافت عکس...</div>
                            <div class="progress-container">
                                <div class="progress-bar" style="width: ${progress}%"></div>
                            </div>
                            <div style="font-size: 12px; color: rgba(255,255,255,0.7); text-align: center; margin-top: 4px;">
                                ${progress}% - ${totalChunks} تکه
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(progressEl);
            } else {
                const bar = progressEl.querySelector('.progress-bar');
                const text = progressEl.querySelector('div:last-child');
                if (bar) bar.style.width = `${progress}%`;
                if (text) text.textContent = `${progress}% - ${totalChunks} تکه`;
            }
            
            scrollToBottom();
        }
        
        function updateUploadProgress(fileId, progress) {
            const progressEl = document.getElementById(`upload-${fileId}`);
            if (progressEl) {
                const bar = progressEl.querySelector('.progress-bar');
                const text = progressEl.querySelector('div:last-child');
                if (bar) bar.style.width = `${progress}%`;
                if (text) {
                    const uploadInfo = currentUploads.get(fileId);
                    if (uploadInfo) {
                        text.textContent = `${progress}% - ${uploadInfo.sentChunks}/${uploadInfo.totalChunks} تکه`;
                    }
                }
            }
        }
        
        function updateDownloadProgress(fileId, progress) {
            const progressEl = document.getElementById(`download-${fileId}`);
            if (progressEl) {
                const bar = progressEl.querySelector('.progress-bar');
                const text = progressEl.querySelector('div:last-child');
                if (bar) bar.style.width = `${progress}%`;
                if (text) {
                    const fileInfo = receivingFiles.get(fileId);
                    if (fileInfo) {
                        text.textContent = `${progress}% - ${fileInfo.receivedChunks}/${fileInfo.totalChunks} تکه`;
                    }
                }
            }
        }
        
        function removeProgress(fileId) {
            const uploadEl = document.getElementById(`upload-${fileId}`);
            const downloadEl = document.getElementById(`download-${fileId}`);
            if (uploadEl) uploadEl.remove();
            if (downloadEl) downloadEl.remove();
        }
        
        function updateMessageToImage(uploadInfo) {
            const progressEl = document.getElementById(`upload-${uploadInfo.fileId}`);
            if (progressEl) {
                progressEl.remove();
            }
            
            const messageData = {
                type: 'image',
                content: uploadInfo.base64String,
                sender: myId,
                timestamp: Date.now(),
                messageId: uploadInfo.messageId,
                status: MESSAGE_STATUS.SENT
            };
            
            displayImageMessage(messageData, true);
            updateContactLastMessage(currentContact.number, '📷 عکس', 'image');
            renderContactsList();
        }
        
        function updateMessageStatusUI(messageId, status) {
            const messages = document.querySelectorAll('.message');
            messages.forEach(msg => {
                const statusEl = msg.querySelector('.message-status');
                if (statusEl && msg.querySelector('.message-content')?.textContent.includes(messageId)) {
                    statusEl.innerHTML = getStatusIcon(status);
                }
            });
        }
        
        function getStatusIcon(status) {
            switch (status) {
                case MESSAGE_STATUS.SENDING:
                    return '<span class="status-icon">↗</span>';
                case MESSAGE_STATUS.SENT:
                    return '<span class="status-icon sent">✓</span>';
                case MESSAGE_STATUS.DELIVERED:
                    return '<span class="status-icon delivered">✓✓</span>';
                case MESSAGE_STATUS.READ:
                    return '<span class="status-icon read">✓✓</span>';
                default:
                    return '<span class="status-icon">↗</span>';
            }
        }

        // ==================== Helper Functions ====================
        function saveMessageLocally(messageData, isOutgoing = true) {
            if (!currentContact) return;
            
            if (!currentContact.messages) currentContact.messages = [];
            currentContact.messages.push(messageData);
            
            // محدود کردن تعداد پیام‌ها
            if (currentContact.messages.length > 500) {
                currentContact.messages = currentContact.messages.slice(-500);
            }
            
            saveContacts();
        }
        
        function updateContactLastMessage(contactNumber, message, type) {
            const contact = contacts[contactNumber];
            if (contact) {
                contact.lastMessage = type === 'image' ? '📷 عکس' : message;
                contact.lastMessageTime = Date.now();
                saveContacts();
            }
        }
        
        function showImageInModal(base64String) {
            document.getElementById('modalImage').src = base64String;
            document.getElementById('imageModal').classList.add('active');
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
        
        function showNotification(text) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = text;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }
        
        function showLoading(text) {
            document.getElementById('loadingOverlay').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }
        
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            const newHeight = Math.min(Math.max(textarea.scrollHeight, 46), 120);
            textarea.style.height = newHeight + 'px';
            
            // فعال/غیرفعال کردن دکمه ارسال
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = textarea.value.trim() === '' || 
                !currentContact || 
                !currentContact.isOnline;
        }
        
        function scrollToBottom() {
            const container = document.getElementById('messagesArea');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('fa-IR', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false
            });
        }
        
        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Event Listeners ====================
        document.addEventListener('DOMContentLoaded', function() {
            // تنظیم ارتفاع textarea
            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', function() {
                autoResize(this);
            });
            
            // ارسال با Enter (بدون Shift)
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // بستن مدال‌ها با کلیک خارج
            document.getElementById('imageModal').addEventListener('click', function(e) {
                if (e.target === this) closeImageModal();
            });
            
            document.getElementById('newContactModal').addEventListener('click', function(e) {
                if (e.target === this) closeNewContactModal();
            });
            
            // بستن با Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeImageModal();
                    closeNewContactModal();
                }
            });
            
            // جلوگیری از اسکرول روی inputهای عددی
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('wheel', e => e.preventDefault());
            });
            
            // تنظیم focus روی لاگین
            document.getElementById('myIdInput').focus();
            
            // مدیریت کیبورد موبایل
            window.addEventListener('resize', function() {
                const activeElement = document.activeElement;
                if (activeElement && (activeElement.id === 'messageInput' || activeElement.id === 'searchInput')) {
                    setTimeout(scrollToBottom, 100);
                }
            });
        });
    </script>
</body>
</html>
