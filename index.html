<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>واتس‌اپ P2P</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #111b21;
            --bg-secondary: #202c33;
            --bg-surface: #2a3942;
            --bg-input: #2a3942;
            --accent-primary: #00a884;
            --accent-secondary: #53bdeb;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --text-muted: #667781;
            --border-color: #3a4a53;
            --message-incoming: #202c33;
            --message-outgoing: #005c4b;
            --status-online: #00a884;
            --status-offline: #667781;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* صفحات اصلی */
        .page {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .page.hidden {
            transform: translateX(100%);
        }

        .page.active {
            transform: translateX(0);
        }

        /* هدر */
        .header {
            background: var(--bg-secondary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow);
            z-index: 100;
            position: relative;
        }

        .header-title {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            font-size: 24px;
        }

        /* آواتار */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
        }

        .avatar.small {
            width: 35px;
            height: 35px;
            font-size: 16px;
        }

        /* صفحه لاگین */
        #loginPage {
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .app-icon {
            font-size: 60px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00a884, #53bdeb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-align: right;
        }

        .number-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 18px;
            text-align: center;
            font-family: monospace;
            transition: all 0.3s;
        }

        .number-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #008f70;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* صفحه مخاطبین */
        .search-bar {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            text-align: right;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .contact-item:hover {
            background: var(--bg-secondary);
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .contact-last-message {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .contact-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--status-online);
        }

        .contact-status.offline {
            background: var(--status-offline);
        }

        /* صفحه چت */
        .chat-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .messages-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><path fill="%2300a884" d="M30,50 C30,30 50,30 50,50 C50,70 70,70 70,50 C70,30 90,30 90,50 C90,70 70,70 70,90 C70,110 50,110 50,90 C50,70 30,70 30,50 Z"/></svg>');
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* پیام‌ها */
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
            animation: messageAppear 0.3s ease;
            margin-bottom: 2px;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.incoming {
            background: var(--message-incoming);
            align-self: flex-start;
            border-top-right-radius: 0;
        }

        .message.outgoing {
            background: var(--message-outgoing);
            align-self: flex-end;
            border-top-left-radius: 0;
        }

        .message-content {
            font-size: 15px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-align: left;
            margin-top: 4px;
            direction: ltr;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
        }

        .message-time .status-icon {
            font-size: 10px;
        }

        .message-sender {
            font-size: 12px;
            color: var(--accent-primary);
            margin-bottom: 2px;
            font-weight: 500;
        }

        /* پیام سیستم */
        .system-message {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 8px;
            margin: 8px 0;
        }

        /* عکس در پیام */
        .message-image {
            max-width: 250px;
            max-height: 300px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
            margin: 4px 0;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .image-badge {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* نوار ارسال پیام */
        .message-input-container {
            background: var(--bg-secondary);
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-input);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #messageInput {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 100px;
            min-height: 20px;
            padding: 5px 0;
            font-family: inherit;
        }

        #messageInput:focus {
            outline: none;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
        }

        .attach-btn, .send-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .attach-btn:hover {
            color: var(--accent-primary);
        }

        .send-btn {
            color: var(--accent-primary);
        }

        .send-btn:hover:not(:disabled) {
            background: rgba(0, 168, 132, 0.1);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* مدال عکس */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 8px;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            left: 0;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-primary);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            z-index: 2000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            box-shadow: var(--shadow);
            max-width: 300px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* لودینگ */
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* نوار پیشرفت */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 8px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* اسکرول بار */
        .messages-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .messages-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .messages-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* اپلود عکس */
        .upload-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 900;
        }

        .upload-overlay.active {
            display: flex;
        }

        .upload-box {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--accent-primary);
        }

        .upload-progress {
            margin: 20px 0;
        }

        .upload-status {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* مخاطب جدید */
        .new-contact-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 168, 132, 0.3);
            transition: all 0.3s;
            z-index: 100;
        }

        .new-contact-btn:hover {
            transform: scale(1.1);
        }

        /* برای دسکتاپ */
        @media (min-width: 768px) {
            body {
                max-width: 500px;
                margin: 0 auto;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
                height: 90vh;
                top: 5vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }

        /* انیمیشن‌های اضافی */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        .slide-up {
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- صفحه لاگین -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <div class="app-icon">💬</div>
            <h1 style="margin-bottom: 30px; font-size: 24px;">واتس‌اپ P2P</h1>
            
            <div class="input-group">
                <label class="input-label">شماره خود را وارد کنید</label>
                <input type="number" class="number-input" id="myIdInput" 
                       placeholder="مثلاً: 123456" maxlength="9" inputmode="numeric">
                <small style="display: block; margin-top: 8px; color: var(--text-muted);">
                    این شماره شناسه شما خواهد بود
                </small>
            </div>
            
            <button class="btn btn-primary" onclick="initializePeer()" id="loginBtn">
                <span>شروع کردن</span>
                <span>→</span>
            </button>
        </div>
    </div>

    <!-- صفحه مخاطبین -->
    <div id="contactsPage" class="page hidden">
        <div class="header">
            <div class="header-title">مخاطبین</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="showSearch()">🔍</button>
                <button class="icon-btn" onclick="showNewContactModal()">+</button>
            </div>
        </div>

        <div class="search-bar" id="searchBar" style="display: none;">
            <input type="text" class="search-input" id="searchInput" placeholder="جستجوی مخاطب..." 
                   oninput="filterContacts()">
        </div>

        <div class="contacts-list" id="contactsList">
            <!-- مخاطبین اینجا لود می‌شوند -->
        </div>

        <button class="new-contact-btn" onclick="showNewContactModal()">+</button>
    </div>

    <!-- صفحه چت -->
    <div id="chatPage" class="page hidden">
        <div class="header">
            <button class="icon-btn back-btn" onclick="goToContacts()">←</button>
            <div class="avatar small" id="chatAvatar">?</div>
            <div style="flex: 1;">
                <div class="header-title" id="chatContactName">مخاطب</div>
                <div style="font-size: 13px; color: var(--text-secondary);">
                    <span id="chatContactStatus">آفلاین</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn">📞</button>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages-wrapper" id="messagesContainer">
                <!-- پیام‌ها اینجا نمایش داده می‌شوند -->
            </div>

            <div class="message-input-container">
                <button class="attach-btn" onclick="openImagePicker()" title="ارسال عکس">
                    📎
                </button>
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="پیام خود را بنویسید..." 
                              rows="1" oninput="autoResize(this)"></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>
                    <span>↑</span>
                </button>
            </div>
        </div>
    </div>

    <!-- مدال مخاطب جدید -->
    <div id="newContactModal" class="image-modal">
        <div class="upload-box">
            <div class="upload-icon">👤</div>
            <h3 style="margin-bottom: 20px;">مخاطب جدید</h3>
            <input type="number" class="number-input" id="newContactNumber" 
                   placeholder="شماره مخاطب" style="margin-bottom: 16px;">
            <input type="text" class="number-input" id="newContactName" 
                   placeholder="نام مخاطب (اختیاری)" style="margin-bottom: 20px;">
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="closeNewContactModal()" 
                        style="background: var(--bg-surface); flex: 1;">لغو</button>
                <button class="btn btn-primary" onclick="addNewContact()" style="flex: 1;">ذخیره</button>
            </div>
        </div>
    </div>

    <!-- مدال عکس -->
    <div class="image-modal" id="imageModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeImageModal()">✕</button>
            <img class="modal-image" id="modalImage" src="" alt="عکس">
        </div>
    </div>

    <!-- اپلود عکس -->
    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-box">
            <div class="upload-icon" id="uploadIcon">📷</div>
            <h3 id="uploadTitle">در حال آپلود عکس</h3>
            <div class="upload-progress">
                <div class="progress-container">
                    <div class="progress-bar" id="uploadProgress"></div>
                </div>
                <div class="upload-status" id="uploadStatus">در حال آماده‌سازی...</div>
            </div>
            <button class="btn" onclick="cancelUpload()" style="background: var(--bg-surface);">لغو</button>
        </div>
    </div>

    <!-- فایل اینپوت مخفی -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;" 
           onchange="handleImageSelect(this.files[0])">

    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let myId = null;
        let currentContact = null;
        let contacts = {};
        let connections = {};
        
        // مدیریت عکس‌های سنگین
        const CHUNK_SIZE = 16000; // 16KB chunks
        let currentUpload = null;
        let receivingFiles = {}; // {fileId: {chunks: [], total: number, received: number}}

        // ==================== راه‌اندازی اولیه ====================
        function initializePeer() {
            const myIdInput = document.getElementById('myIdInput').value.trim();
            
            if (!myIdInput || myIdInput.length < 3) {
                showNotification('لطفاً یک شماره معتبر وارد کنید');
                return;
            }
            
            myId = myIdInput.padStart(9, '0').slice(-9);
            
            // بارگذاری PeerJS
            if (typeof Peer === 'undefined') {
                loadPeerJS();
                return;
            }
            
            createPeer();
        }
        
        function loadPeerJS() {
            showLoading('در حال بارگذاری...');
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js';
            script.onload = createPeer;
            script.onerror = () => {
                showNotification('خطا در بارگذاری');
                document.getElementById('loginBtn').disabled = false;
            };
            document.head.appendChild(script);
        }
        
        function createPeer() {
            peer = new Peer(myId, {
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                debug: 1
            });
            
            peer.on('open', (id) => {
                console.log('✅ Peer created:', id);
                document.getElementById('loginBtn').disabled = true;
                
                // بارگذاری مخاطبین
                loadContacts();
                
                // رفتن به صفحه مخاطبین
                showPage('contactsPage');
                
                showNotification('خوش آمدید!');
            });
            
            peer.on('connection', (conn) => {
                handleIncomingConnection(conn);
            });
            
            peer.on('error', (err) => {
                console.error('PeerJS Error:', err);
                if (err.type === 'unavailable-id') {
                    showNotification('این شماره قبلاً استفاده شده');
                    document.getElementById('loginBtn').disabled = false;
                }
            });
        }

        // ==================== مدیریت صفحات ====================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
                page.classList.add('hidden');
            });
            
            const page = document.getElementById(pageId);
            page.classList.remove('hidden');
            setTimeout(() => page.classList.add('active'), 10);
            
            // تنظیمات خاص هر صفحه
            if (pageId === 'contactsPage') {
                renderContactsList();
            } else if (pageId === 'chatPage' && currentContact) {
                loadChatMessages();
                document.getElementById('messageInput').focus();
            }
        }
        
        function goToContacts() {
            currentContact = null;
            showPage('contactsPage');
        }
        
        function showSearch() {
            const searchBar = document.getElementById('searchBar');
            searchBar.style.display = 'block';
            document.getElementById('searchInput').focus();
        }

        // ==================== مدیریت مخاطبین ====================
        function loadContacts() {
            const savedContacts = localStorage.getItem(`whatsapp_contacts_${myId}`);
            if (savedContacts) {
                contacts = JSON.parse(savedContacts);
                updateContactsStatus();
            }
        }
        
        function saveContacts() {
            localStorage.setItem(`whatsapp_contacts_${myId}`, JSON.stringify(contacts));
        }
        
        function showNewContactModal() {
            document.getElementById('newContactModal').classList.add('active');
        }
        
        function closeNewContactModal() {
            document.getElementById('newContactModal').classList.remove('active');
            document.getElementById('newContactNumber').value = '';
            document.getElementById('newContactName').value = '';
        }
        
        function addNewContact() {
            const numberInput = document.getElementById('newContactNumber');
            const nameInput = document.getElementById('newContactName');
            
            const contactNumber = numberInput.value.trim().padStart(9, '0').slice(-9);
            const contactName = nameInput.value.trim() || contactNumber;
            
            if (!contactNumber || contactNumber.length < 3) {
                showNotification('شماره معتبر وارد کنید');
                return;
            }
            
            if (contactNumber === myId) {
                showNotification('نمی‌توانید خودتان را اضافه کنید');
                return;
            }
            
            if (contacts[contactNumber]) {
                showNotification('این مخاطب از قبل وجود دارد');
                return;
            }
            
            // اضافه کردن مخاطب جدید
            contacts[contactNumber] = {
                number: contactNumber,
                name: contactName,
                lastMessage: '',
                lastMessageTime: null,
                messages: [],
                isOnline: false,
                avatar: contactNumber.charAt(0)
            };
            
            saveContacts();
            renderContactsList();
            closeNewContactModal();
            
            showNotification(`مخاطب ${contactName} اضافه شد`);
            
            // اتصال به مخاطب جدید
            setTimeout(() => connectToContact(contactNumber), 1000);
        }
        
        function filterContacts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const contactItems = document.querySelectorAll('.contact-item');
            
            contactItems.forEach(item => {
                const contactName = item.querySelector('.contact-name').textContent.toLowerCase();
                const contactNumber = item.querySelector('.contact-last-message').textContent.toLowerCase();
                
                if (contactName.includes(searchTerm) || contactNumber.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }
        
        function updateContactsStatus() {
            Object.keys(contacts).forEach(number => {
                if (connections[number] && connections[number].open) {
                    contacts[number].isOnline = true;
                } else {
                    contacts[number].isOnline = false;
                }
            });
            renderContactsList();
        }
        
        function renderContactsList() {
            const contactsList = document.getElementById('contactsList');
            
            if (Object.keys(contacts).length === 0) {
                contactsList.innerHTML = `
                    <div class="system-message">
                        <p>هنوز مخاطبی اضافه نکرده‌اید</p>
                        <p style="margin-top: 8px; font-size: 14px; color: var(--text-muted);">
                            روی دکمه + پایین صفحه کلیک کنید
                        </p>
                    </div>
                `;
                return;
            }
            
            // مرتب‌سازی بر اساس زمان آخرین پیام
            const sortedContacts = Object.values(contacts).sort((a, b) => {
                return (b.lastMessageTime || 0) - (a.lastMessageTime || 0);
            });
            
            contactsList.innerHTML = '';
            
            sortedContacts.forEach(contact => {
                const contactElement = document.createElement('div');
                contactElement.className = 'contact-item';
                contactElement.onclick = () => openChat(contact);
                
                // نمایش آخرین پیام
                let lastMessage = 'شروع گفتگو';
                let lastTime = '';
                
                if (contact.messages && contact.messages.length > 0) {
                    const lastMsg = contact.messages[contact.messages.length - 1];
                    if (lastMsg.type === 'image') {
                        lastMessage = '📷 عکس';
                    } else if (lastMsg.type === 'file_chunk') {
                        lastMessage = '📁 فایل در حال دریافت...';
                    } else {
                        lastMessage = lastMsg.content.substring(0, 30);
                        if (lastMsg.content.length > 30) lastMessage += '...';
                    }
                    
                    const date = new Date(lastMsg.timestamp);
                    lastTime = date.toLocaleTimeString('fa-IR', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                }
                
                contactElement.innerHTML = `
                    <div class="avatar small">${contact.avatar}</div>
                    <div class="contact-info">
                        <div class="contact-name">${contact.name}</div>
                        <div class="contact-last-message">${lastMessage}</div>
                    </div>
                    <div style="text-align: left; min-width: 60px;">
                        <div class="contact-time">${lastTime}</div>
                        <div class="contact-status ${contact.isOnline ? '' : 'offline'}"></div>
                    </div>
                `;
                
                contactsList.appendChild(contactElement);
            });
        }

        // ==================== مدیریت چت ====================
        function openChat(contact) {
            currentContact = contact;
            
            // بروزرسانی هدر چت
            document.getElementById('chatContactName').textContent = contact.name;
            document.getElementById('chatAvatar').textContent = contact.avatar;
            document.getElementById('chatContactStatus').textContent = contact.isOnline ? 'آنلاین' : 'آفلاین';
            document.getElementById('chatContactStatus').style.color = contact.isOnline ? 'var(--status-online)' : 'var(--status-offline)';
            
            // فعال‌سازی دکمه ارسال
            document.getElementById('sendBtn').disabled = !contact.isOnline;
            
            // نمایش صفحه چت
            showPage('chatPage');
            
            // اتصال اگر قبلاً متصل نبودیم
            if (!contact.isOnline && !connections[contact.number]) {
                connectToContact(contact.number);
            }
        }
        
        function connectToContact(contactNumber) {
            if (!peer || peer.disconnected) {
                showNotification('اتصال برقرار نیست');
                return;
            }
            
            if (connections[contactNumber]) {
                connections[contactNumber].close();
            }
            
            showNotification(`در حال اتصال به ${contactNumber}...`);
            
            const conn = peer.connect(contactNumber, {
                reliable: true,
                serialization: 'json'
            });
            
            setupConnection(conn, contactNumber);
            connections[contactNumber] = conn;
        }
        
        function handleIncomingConnection(conn) {
            const contactNumber = conn.peer;
            
            // اگر مخاطب جدید است، اضافه‌اش کن
            if (!contacts[contactNumber]) {
                contacts[contactNumber] = {
                    number: contactNumber,
                    name: contactNumber,
                    lastMessage: '',
                    lastMessageTime: null,
                    messages: [],
                    isOnline: true,
                    avatar: contactNumber.charAt(0)
                };
                saveContacts();
            }
            
            setupConnection(conn, contactNumber);
            connections[contactNumber] = conn;
            
            // بروزرسانی وضعیت
            contacts[contactNumber].isOnline = true;
            
            // اگر در چت این مخاطب هستیم، UI را بروزرسانی کن
            if (currentContact && currentContact.number === contactNumber) {
                document.getElementById('chatContactStatus').textContent = 'آنلاین';
                document.getElementById('chatContactStatus').style.color = 'var(--status-online)';
                document.getElementById('sendBtn').disabled = false;
            }
            
            showNotification(`${contactNumber} آنلاین شد`);
            renderContactsList();
        }
        
        function setupConnection(conn, contactNumber) {
            conn.on('open', () => {
                console.log(`✅ Connected to ${contactNumber}`);
                
                contacts[contactNumber].isOnline = true;
                
                if (currentContact && currentContact.number === contactNumber) {
                    document.getElementById('chatContactStatus').textContent = 'آنلاین';
                    document.getElementById('chatContactStatus').style.color = 'var(--status-online)';
                    document.getElementById('sendBtn').disabled = false;
                }
                
                renderContactsList();
            });
            
            conn.on('data', (data) => {
                handleIncomingData(data, contactNumber);
            });
            
            conn.on('close', () => {
                console.log(`❌ Connection closed with ${contactNumber}`);
                
                contacts[contactNumber].isOnline = false;
                
                if (currentContact && currentContact.number === contactNumber) {
                    document.getElementById('chatContactStatus').textContent = 'آفلاین';
                    document.getElementById('chatContactStatus').style.color = 'var(--status-offline)';
                    document.getElementById('sendBtn').disabled = true;
                }
                
                delete connections[contactNumber];
                renderContactsList();
            });
            
            conn.on('error', (err) => {
                console.error(`Connection error with ${contactNumber}:`, err);
                contacts[contactNumber].isOnline = false;
                delete connections[contactNumber];
                renderContactsList();
            });
        }

        // ==================== ارسال و دریافت پیام‌ها ====================
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentContact) return;
            
            if (!connections[currentContact.number] || !connections[currentContact.number].open) {
                showNotification('مخاطب آفلاین است');
                return;
            }
            
            const messageData = {
                type: 'text',
                content: message,
                sender: myId,
                timestamp: Date.now(),
                messageId: generateMessageId()
            };
            
            // ارسال
            connections[currentContact.number].send(messageData);
            
            // ذخیره و نمایش
            saveAndDisplayMessage(messageData, 'outgoing');
            
            // پاک کردن input
            input.value = '';
            input.style.height = 'auto';
            
            // بروزرسانی مخاطبین
            updateContactLastMessage(currentContact.number, message, 'text');
            renderContactsList();
        }
        
        function handleIncomingData(data, senderNumber) {
            if (data.type === 'file_chunk') {
                handleFileChunk(data, senderNumber);
            } else if (data.type === 'file_start') {
                startReceivingFile(data, senderNumber);
            } else if (data.type === 'file_end') {
                completeReceivingFile(data, senderNumber);
            } else {
                // پیام معمولی
                saveAndDisplayMessage(data, 'incoming');
                updateContactLastMessage(senderNumber, data.content, data.type);
                renderContactsList();
                
                // نوتیفیکیشن اگر در چت این مخاطب نیستیم
                if (!currentContact || currentContact.number !== senderNumber) {
                    const contactName = contacts[senderNumber] ? contacts[senderNumber].name : senderNumber;
                    showNotification(`${contactName}: ${data.type === 'image' ? '📷 عکس' : data.content.substring(0, 20)}`);
                }
            }
        }
        
        function saveAndDisplayMessage(messageData, direction, skipSave = false) {
            if (!skipSave && currentContact) {
                // ذخیره در تاریخچه
                if (!currentContact.messages) currentContact.messages = [];
                currentContact.messages.push(messageData);
                saveContacts();
            }
            
            // نمایش در چت
            displayMessage(messageData, direction);
        }
        
        function loadChatMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            if (!currentContact || !currentContact.messages || currentContact.messages.length === 0) {
                container.innerHTML = `
                    <div class="system-message">
                        <p>شروع گفتگو با ${currentContact.name}</p>
                    </div>
                `;
                return;
            }
            
            currentContact.messages.forEach(msg => {
                const direction = msg.sender === myId ? 'outgoing' : 'incoming';
                displayMessage(msg, direction, true);
            });
            
            // اسکرول به پایین
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }
        
        function displayMessage(messageData, direction, noAnimation = false) {
            const container = document.getElementById('messagesContainer');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${direction}`;
            if (noAnimation) {
                messageDiv.style.animation = 'none';
            }
            
            const time = new Date(messageData.timestamp).toLocaleTimeString('fa-IR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            let contentHtml = '';
            
            if (messageData.type === 'image') {
                contentHtml = `
                    <div class="message-content">
                        <img src="${messageData.content}" 
                             class="message-image" 
                             onclick="showImageInModal('${messageData.content}')"
                             onload="this.style.opacity='1'"
                             style="opacity:0;transition:opacity 0.3s">
                        <div class="image-badge">📷 عکس</div>
                    </div>
                `;
            } else {
                contentHtml = `
                    <div class="message-content">${escapeHtml(messageData.content)}</div>
                `;
            }
            
            messageDiv.innerHTML = `
                ${contentHtml}
                <div class="message-time">
                    ${time}
                    ${direction === 'outgoing' ? '<span class="status-icon">✓</span>' : ''}
                </div>
            `;
            
            container.appendChild(messageDiv);
            
            // اسکرول به پایین
            if (!noAnimation) {
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 100);
            }
        }
        
        function updateContactLastMessage(contactNumber, message, type) {
            if (contacts[contactNumber]) {
                contacts[contactNumber].lastMessage = type === 'image' ? '📷 عکس' : message;
                contacts[contactNumber].lastMessageTime = Date.now();
                saveContacts();
            }
        }

        // ==================== سیستم ارسال عکس‌های سنگین ====================
        function openImagePicker() {
            document.getElementById('imageInput').click();
        }
        
        function handleImageSelect(file) {
            if (!file || !file.type.startsWith('image/')) {
                showNotification('لطفاً یک فایل عکس انتخاب کنید');
                return;
            }
            
            // نمایش صفحه آپلود
            showUploadOverlay('📷', 'در حال آماده‌سازی عکس...');
            
            // خواندن فایل
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result;
                sendLargeImage(base64String, file.name);
            };
            reader.onerror = () => {
                hideUploadOverlay();
                showNotification('خطا در خواندن فایل');
            };
            reader.readAsDataURL(file);
            
            // پاک کردن input
            document.getElementById('imageInput').value = '';
        }
        
        function sendLargeImage(base64String, fileName) {
            if (!currentContact || !connections[currentContact.number]) {
                showNotification('اتصال با مخاطب برقرار نیست');
                hideUploadOverlay();
                return;
            }
            
            const fileId = generateFileId();
            const chunks = splitBase64IntoChunks(base64String, CHUNK_SIZE);
            const totalChunks = chunks.length;
            
            currentUpload = {
                fileId,
                fileName,
                chunks,
                totalChunks,
                sentChunks: 0,
                base64String
            };
            
            // ارسال اطلاعات شروع فایل
            connections[currentContact.number].send({
                type: 'file_start',
                fileId,
                fileName,
                totalChunks,
                fileType: 'image',
                sender: myId,
                timestamp: Date.now()
            });
            
            // شروع ارسال تکه‌ها
            sendNextChunk();
        }
        
        function splitBase64IntoChunks(base64String, chunkSize) {
            const chunks = [];
            const stringLength = base64String.length;
            
            for (let i = 0; i < stringLength; i += chunkSize) {
                chunks.push(base64String.substring(i, i + chunkSize));
            }
            
            return chunks;
        }
        
        function sendNextChunk() {
            if (!currentUpload) return;
            
            const { fileId, chunks, sentChunks, totalChunks } = currentUpload;
            
            if (sentChunks >= totalChunks) {
                // تمام تکه‌ها ارسال شدند
                connections[currentContact.number].send({
                    type: 'file_end',
                    fileId,
                    sender: myId,
                    timestamp: Date.now()
                });
                
                // نمایش پیام عکس در چت محلی
                const messageData = {
                    type: 'image',
                    content: currentUpload.base64String,
                    sender: myId,
                    timestamp: Date.now(),
                    messageId: generateMessageId()
                };
                
                saveAndDisplayMessage(messageData, 'outgoing');
                updateContactLastMessage(currentContact.number, '📷 عکس', 'image');
                renderContactsList();
                
                // پنهان کردن overlay
                hideUploadOverlay();
                currentUpload = null;
                
                showNotification('عکس ارسال شد');
                return;
            }
            
            // ارسال تکه فعلی
            connections[currentContact.number].send({
                type: 'file_chunk',
                fileId,
                chunkIndex: sentChunks,
                chunkData: chunks[sentChunks],
                sender: myId,
                timestamp: Date.now()
            });
            
            // بروزرسانی پیشرفت
            currentUpload.sentChunks++;
            const progress = Math.round((currentUpload.sentChunks / totalChunks) * 100);
            updateUploadProgress(progress, `در حال ارسال... ${progress}%`);
            
            // ارسال تکه بعدی با کمی تأخیر
            setTimeout(sendNextChunk, 50);
        }
        
        function startReceivingFile(data, senderNumber) {
            const { fileId, fileName, totalChunks, fileType } = data;
            
            receivingFiles[fileId] = {
                fileName,
                fileType,
                totalChunks,
                receivedChunks: 0,
                chunks: new Array(totalChunks),
                sender: senderNumber,
                startTime: Date.now()
            };
            
            showNotification(`دریافت ${fileType === 'image' ? 'عکس' : 'فایل'}: ${fileName}`);
        }
        
        function handleFileChunk(data, senderNumber) {
            const { fileId, chunkIndex, chunkData } = data;
            
            if (!receivingFiles[fileId]) return;
            
            const fileInfo = receivingFiles[fileId];
            fileInfo.chunks[chunkIndex] = chunkData;
            fileInfo.receivedChunks++;
            
            // بروزرسانی پیشرفت
            const progress = Math.round((fileInfo.receivedChunks / fileInfo.totalChunks) * 100);
            
            // اگر در چت این مخاطب هستیم، نوار پیشرفت نشان بده
            if (currentContact && currentContact.number === senderNumber) {
                showProgressInChat(fileId, progress);
            }
            
            // اگر تمام تکه‌ها دریافت شدند
            if (fileInfo.receivedChunks === fileInfo.totalChunks) {
                // 1 ثانیه صبر کن تا مطمئن شویم همه تکه‌ها آماده‌اند
                setTimeout(() => completeReceivingFile({ fileId }, senderNumber), 1000);
            }
        }
        
        function completeReceivingFile(data, senderNumber) {
            const { fileId } = data;
            
            if (!receivingFiles[fileId]) return;
            
            const fileInfo = receivingFiles[fileId];
            
            // سرهم کردن تکه‌ها
            const base64String = fileInfo.chunks.join('');
            
            // حذف نوار پیشرفت
            removeProgressFromChat(fileId);
            
            // ایجاد پیام
            const messageData = {
                type: fileInfo.fileType,
                content: base64String,
                sender: fileInfo.sender,
                timestamp: Date.now(),
                messageId: generateMessageId()
            };
            
            // ذخیره و نمایش
            if (currentContact && currentContact.number === senderNumber) {
                saveAndDisplayMessage(messageData, 'incoming');
                updateContactLastMessage(senderNumber, `📷 عکس`, 'image');
            } else {
                // ذخیره در تاریخچه مخاطب
                if (contacts[senderNumber]) {
                    if (!contacts[senderNumber].messages) contacts[senderNumber].messages = [];
                    contacts[senderNumber].messages.push(messageData);
                    saveContacts();
                }
            }
            
            // حذف از receivingFiles
            delete receivingFiles[fileId];
            
            // بروزرسانی لیست مخاطبین
            renderContactsList();
            
            // نوتیفیکیشن
            if (!currentContact || currentContact.number !== senderNumber) {
                const contactName = contacts[senderNumber] ? contacts[senderNumber].name : senderNumber;
                showNotification(`${contactName}: 📷 عکس جدید`);
            }
        }
        
        function showProgressInChat(fileId, progress) {
            const container = document.getElementById('messagesContainer');
            
            // اگر نوار پیشرفت از قبل وجود دارد، آن را بروزرسانی کن
            let progressDiv = document.getElementById(`progress-${fileId}`);
            
            if (!progressDiv) {
                progressDiv = document.createElement('div');
                progressDiv.id = `progress-${fileId}`;
                progressDiv.className = 'message incoming';
                progressDiv.innerHTML = `
                    <div class="message-content">
                        <div style="font-size: 14px; margin-bottom: 8px;">📷 در حال دریافت عکس...</div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${progress}%"></div>
                        </div>
                        <div style="font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: 4px;">
                            ${progress}%
                        </div>
                    </div>
                `;
                container.appendChild(progressDiv);
            } else {
                const progressBar = progressDiv.querySelector('.progress-bar');
                const percentText = progressDiv.querySelector('div:last-child');
                if (progressBar) progressBar.style.width = `${progress}%`;
                if (percentText) percentText.textContent = `${progress}%`;
            }
            
            // اسکرول به پایین
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }
        
        function removeProgressFromChat(fileId) {
            const progressDiv = document.getElementById(`progress-${fileId}`);
            if (progressDiv) {
                progressDiv.remove();
            }
        }

        // ==================== UI Helper Functions ====================
        function showUploadOverlay(icon, title) {
            document.getElementById('uploadIcon').textContent = icon;
            document.getElementById('uploadTitle').textContent = title;
            document.getElementById('uploadOverlay').classList.add('active');
        }
        
        function updateUploadProgress(percent, status) {
            document.getElementById('uploadProgress').style.width = `${percent}%`;
            document.getElementById('uploadStatus').textContent = status;
        }
        
        function hideUploadOverlay() {
            document.getElementById('uploadOverlay').classList.remove('active');
            document.getElementById('uploadProgress').style.width = '0%';
            document.getElementById('uploadStatus').textContent = '';
        }
        
        function cancelUpload() {
            currentUpload = null;
            hideUploadOverlay();
            showNotification('آپلود لغو شد');
        }
        
        function showImageInModal(base64String) {
            document.getElementById('modalImage').src = base64String;
            document.getElementById('imageModal').classList.add('active');
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
        
        function showNotification(text) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = text;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }
        
        function showLoading(text) {
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = `
                <div class="spinner"></div>
                <p>${text}</p>
            `;
            document.body.appendChild(loading);
            return loading;
        }
        
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
            
            // فعال/غیرفعال کردن دکمه ارسال
            document.getElementById('sendBtn').disabled = textarea.value.trim() === '' || 
                !currentContact || 
                !currentContact.isOnline;
        }
        
        function generateMessageId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function generateFileId() {
            return 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Event Listeners ====================
        document.addEventListener('DOMContentLoaded', function() {
            // تنظیم ارتفاع textarea
            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', function() {
                autoResize(this);
            });
            
            // ارسال با Enter (بدون Shift)
            textarea.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // بستن مدال‌ها با کلیک خارج
            document.getElementById('imageModal').addEventListener('click', function(e) {
                if (e.target === this) closeImageModal();
            });
            
            document.getElementById('newContactModal').addEventListener('click', function(e) {
                if (e.target === this) closeNewContactModal();
            });
            
            document.getElementById('uploadOverlay').addEventListener('click', function(e) {
                if (e.target === this) cancelUpload();
            });
            
            // بستن با Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeImageModal();
                    closeNewContactModal();
                    cancelUpload();
                }
            });
            
            // جلوگیری از اسکرول روی inputهای عددی
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('wheel', e => e.preventDefault());
            });
            
            // تنظیم focus روی لاگین
            document.getElementById('myIdInput').focus();
        });
    </script>
</body>
</html>
