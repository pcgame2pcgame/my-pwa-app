<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>چت مستقیم P2P</title>
    <style>
        /* Reset و متغیرها */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --danger: #f72585;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #3a7bd5);
            color: var(--dark);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        
        /* صفحه اول - تنظیمات اتصال */
        .setup-page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #1a2a6c, #3a7bd5);
            transition: transform 0.5s ease;
        }
        
        .setup-page.hidden {
            transform: translateY(-100%);
        }
        
        .setup-container {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }
        
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }
        
        .input-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
        }
        
        .number-input {
            width: 100%;
            padding: 20px;
            border: 3px solid #e0e0e0;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            transition: all 0.3s;
            font-family: monospace;
        }
        
        .number-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 22px;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.3);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            color: white;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* صفحه چت */
        .chat-page {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
            background: white;
        }
        
        .chat-page.active {
            display: flex;
        }
        
        /* هدر چت */
        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }
        
        .connection-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .disconnect-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        /* ناحیه پیام‌ها */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            max-width: 85%;
            padding: 15px 20px;
            border-radius: 25px;
            position: relative;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.outgoing {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), #7209b7);
            color: white;
            border-bottom-right-radius: 8px;
        }
        
        .message.incoming {
            align-self: flex-start;
            background: white;
            color: var(--dark);
            border: 2px solid #e9ecef;
            border-bottom-left-radius: 8px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }
        
        .message.system {
            align-self: center;
            background: #ffeaa7;
            color: #d63031;
            font-size: 0.9rem;
            text-align: center;
            max-width: 90%;
            border-radius: 15px;
            padding: 12px 20px;
        }
        
        .message-time {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 8px;
            display: block;
        }
        
        /* کنترل‌های پایین */
        .chat-controls {
            background: white;
            border-top: 1px solid #eee;
            padding: 20px;
            flex-shrink: 0;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.05);
        }
        
        /* انتخاب‌گر حالت */
        .mode-selector {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        
        .mode-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: white;
            color: #666;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .mode-btn.active {
            background: var(--primary);
            color: white;
            border-color: white;
            transform: scale(1.1);
        }
        
        /* ناحیه ورودی */
        .input-area {
            display: none;
        }
        
        .input-area.active {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* حالت متن */
        .text-input-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        #textInput {
            flex: 1;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        #textInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }
        
        .send-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* حالت تماس */
        .call-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .call-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .call-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.3);
        }
        
        .call-btn.end-call {
            background: linear-gradient(135deg, #f72585, #b5179e);
        }
        
        .call-btn:hover {
            transform: scale(1.1);
        }
        
        /* ویدیو کانتینر */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        @media (min-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .video-wrapper.local {
            border: 3px solid var(--primary);
        }
        
        .video-wrapper.remote {
            border: 3px solid #4cc9f0;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        
        .video-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 2;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            z-index: 1;
        }
        
        /* حالت‌های دیگر */
        .media-upload-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .upload-btn {
            padding: 22px;
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.3s;
        }
        
        .preview-box {
            margin: 20px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 20px;
            border: 3px dashed #dee2e6;
            text-align: center;
        }
        
        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.3);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }
        
        /* اسکرول بار */
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .messages-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        
        /* رسپانسیو */
        @media (max-height: 700px) {
            .chat-header {
                padding: 15px;
            }
            
            .messages-container {
                padding: 15px;
            }
            
            .chat-controls {
                padding: 15px;
            }
            
            .mode-btn {
                width: 55px;
                height: 55px;
                font-size: 1.6rem;
            }
            
            .call-btn {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <!-- صفحه اول: تنظیمات اتصال -->
    <div class="setup-page" id="setupPage">
        <div class="setup-container">
            <div class="logo">💬</div>
            <h1 class="title">چت مستقیم P2P</h1>
            
            <div class="input-group">
                <label class="input-label">کد اتصال شما:</label>
                <input type="number" class="number-input" id="myCodeInput" 
                       placeholder="مثلاً: 123456789" maxlength="9" 
                       inputmode="numeric" pattern="[0-9]*">
            </div>
            
            <button class="btn btn-primary" onclick="setMyCode()" id="setCodeBtn">
                <span>✅</span>
                <span>تایید کد من</span>
            </button>
            
            <div class="input-group" style="margin-top: 30px;">
                <label class="input-label">کد مخاطب:</label>
                <input type="number" class="number-input" id="friendCodeInput" 
                       placeholder="کد مخاطب را وارد کنید" inputmode="numeric">
            </div>
            
            <button class="btn btn-success" onclick="connectToFriend()" 
                    id="connectBtn" disabled>
                <span>🔗</span>
                <span>اتصال به مخاطب</span>
            </button>
        </div>
    </div>
    
    <!-- صفحه دوم: چت -->
    <div class="chat-page" id="chatPage">
        <!-- هدر چت -->
        <header class="chat-header">
            <div class="connection-info">
                <div class="status-indicator"></div>
                <span>متصل به: <span id="connectedTo">---</span></span>
            </div>
            
            <button class="disconnect-btn" onclick="disconnect()">
                قطع ارتباط
            </button>
        </header>
        
        <!-- پیام‌ها -->
        <div class="messages-container" id="messagesContainer">
            <div class="message system">
                <p>👋 به چت مستقیم خوش آمدید! اکنون می‌توانید با مخاطب خود ارتباط برقرار کنید.</p>
            </div>
        </div>
        
        <!-- کنترل‌های پایین -->
        <div class="chat-controls">
            <!-- انتخاب‌گر حالت -->
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('text')" title="متن">
                    <span>📝</span>
                </button>
                <button class="mode-btn" onclick="setMode('audio')" title="تماس صوتی">
                    <span>📞</span>
                </button>
                <button class="mode-btn" onclick="setMode('video')" title="تماس ویدیویی">
                    <span>📹</span>
                </button>
                <button class="mode-btn" onclick="setMode('image')" title="عکس">
                    <span>🖼️</span>
                </button>
                <button class="mode-btn" onclick="setMode('file')" title="فایل">
                    <span>📎</span>
                </button>
            </div>
            
            <!-- حالت متن -->
            <div class="input-area active" id="textArea">
                <div class="text-input-container">
                    <input type="text" id="textInput" placeholder="پیام خود را بنویسید...">
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>
                        <span>📤</span>
                    </button>
                </div>
            </div>
            
            <!-- حالت تماس صوتی -->
            <div class="input-area" id="audioArea">
                <div class="call-container">
                    <div class="call-controls">
                        <button class="call-btn" onclick="toggleAudioCall()" id="audioCallBtn">
                            <span>📞</span>
                        </button>
                        <button class="call-btn end-call" onclick="endCall()" id="endCallBtn" style="display: none;">
                            <span>📴</span>
                        </button>
                    </div>
                    <div id="callStatus" style="text-align: center; color: #666; padding: 10px;">
                        آماده برای تماس صوتی
                    </div>
                </div>
            </div>
            
            <!-- حالت تماس ویدیویی -->
            <div class="input-area" id="videoArea">
                <div class="call-container">
                    <div class="video-grid">
                        <div class="video-wrapper local">
                            <div class="video-label">دوربین شما</div>
                            <video id="localVideo" autoplay muted playsinline></video>
                            <div class="video-overlay" id="localVideoOverlay" style="display: none;">
                                دوربین خاموش
                            </div>
                        </div>
                        
                        <div class="video-wrapper remote">
                            <div class="video-label">دوربین مخاطب</div>
                            <video id="remoteVideo" autoplay playsinline></video>
                            <div class="video-overlay" id="remoteVideoOverlay">
                                منتظر اتصال...
                            </div>
                        </div>
                    </div>
                    
                    <div class="call-controls">
                        <button class="call-btn" onclick="toggleVideoCall()" id="videoCallBtn">
                            <span>📹</span>
                        </button>
                        <button class="call-btn" onclick="toggleVideoMute()" id="videoMuteBtn">
                            <span>🎤</span>
                        </button>
                        <button class="call-btn" onclick="toggleVideo()" id="videoToggleBtn">
                            <span>📷</span>
                        </button>
                        <button class="call-btn end-call" onclick="endCall()" id="endVideoCallBtn" style="display: none;">
                            <span>📴</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- حالت عکس -->
            <div class="input-area" id="imageArea">
                <div class="media-upload-container">
                    <input type="file" accept="image/*" id="imageInput" hidden 
                           onchange="previewImage(this.files[0])">
                    <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
                        <span>📁</span>
                        <span>انتخاب عکس</span>
                    </button>
                    <div class="preview-box" id="imagePreview"></div>
                    <button class="btn btn-primary" onclick="sendImage()" id="sendImageBtn" disabled>
                        <span>📤</span>
                        <span>ارسال عکس</span>
                    </button>
                </div>
            </div>
            
            <!-- حالت فایل -->
            <div class="input-area" id="fileArea">
                <div class="media-upload-container">
                    <input type="file" id="fileInput" hidden 
                           onchange="previewFile(this.files[0])">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        <span>📁</span>
                        <span>انتخاب فایل</span>
                    </button>
                    <div class="preview-box" id="filePreview"></div>
                    <button class="btn btn-primary" onclick="sendFile()" id="sendFileBtn" disabled>
                        <span>📤</span>
                        <span>ارسال فایل</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let dataConnection = null;
        let mediaConnection = null;
        let localStream = null;
        let remoteStream = null;
        let myCode = null;
        let friendCode = null;
        let currentMode = 'text';
        let isInCall = false;

        // ==================== مدیریت صفحات ====================
        function showChatPage() {
            document.getElementById('setupPage').classList.add('hidden');
            document.getElementById('chatPage').classList.add('active');
            document.getElementById('textInput').focus();
        }
        
        function showSetupPage() {
            document.getElementById('setupPage').classList.remove('hidden');
            document.getElementById('chatPage').classList.remove('active');
            disconnect();
        }

        // ==================== تنظیم کد کاربر ====================
        function setMyCode() {
            const codeInput = document.getElementById('myCodeInput').value.trim();
            
            if (!codeInput || codeInput.length < 3) {
                showNotification('لطفاً یک کد معتبر (حداقل ۳ رقم) وارد کنید.');
                return;
            }
            
            myCode = codeInput.padStart(9, '0').slice(-9);
            
            // ایجاد Peer با کد انتخابی
            peer = new Peer(myCode, {
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                debug: 2
            });
            
            // رویدادهای Peer
            peer.on('open', () => {
                document.getElementById('setCodeBtn').disabled = true;
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('myCodeInput').disabled = true;
                showNotification('کد شما تنظیم شد!');
            });
            
            peer.on('connection', (conn) => {
                handleIncomingConnection(conn);
            });
            
            peer.on('call', (call) => {
                handleIncomingCall(call);
            });
            
            peer.on('error', (err) => {
                console.error('خطای PeerJS:', err);
                showNotification(`خطا: ${err.type}`);
            });
        }

        // ==================== اتصال به مخاطب ====================
        function connectToFriend() {
            friendCode = document.getElementById('friendCodeInput').value.trim();
            
            if (!friendCode || !peer) {
                showNotification('لطفاً ابتدا کد خود را تنظیم کنید.');
                return;
            }
            
            if (friendCode === myCode) {
                showNotification('نمی‌توانید به خودتان متصل شوید!');
                return;
            }
            
            friendCode = friendCode.padStart(9, '0').slice(-9);
            
            // اتصال داده
            dataConnection = peer.connect(friendCode);
            setupDataConnection();
            
            showNotification(`در حال اتصال به ${friendCode}...`);
        }
        
        function handleIncomingConnection(conn) {
            dataConnection = conn;
            friendCode = conn.peer;
            setupDataConnection();
        }

        // ==================== تنظیم اتصال داده ====================
        function setupDataConnection() {
            dataConnection.on('open', () => {
                document.getElementById('connectedTo').textContent = friendCode;
                document.getElementById('sendBtn').disabled = false;
                
                showNotification('اتصال برقرار شد!');
                showChatPage();
                
                // ارسال اطلاعات اولیه
                dataConnection.send({
                    type: 'handshake',
                    code: myCode,
                    timestamp: new Date().toISOString()
                });
            });
            
            dataConnection.on('data', (data) => {
                handleIncomingData(data);
            });
            
            dataConnection.on('close', () => {
                showNotification('اتصال قطع شد.');
                endCall();
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('connectedTo').textContent = '---';
            });
        }

        // ==================== مدیریت تماس‌های رسانه‌ای ====================
        async function toggleAudioCall() {
            if (!dataConnection || !dataConnection.open) {
                showNotification('ابتدا باید به مخاطب متصل شوید.');
                return;
            }
            
            if (isInCall) {
                endCall();
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
                
                const call = peer.call(friendCode, localStream, {
                    metadata: { type: 'audio' }
                });
                
                mediaConnection = call;
                setupMediaCall(call, 'audio');
                
                document.getElementById('audioCallBtn').style.display = 'none';
                document.getElementById('endCallBtn').style.display = 'flex';
                document.getElementById('callStatus').textContent = '📞 در حال تماس صوتی...';
                
            } catch (err) {
                console.error('خطا در شروع تماس صوتی:', err);
                showNotification('دسترسی به میکروفن ممکن نیست.');
            }
        }
        
        async function toggleVideoCall() {
            if (!dataConnection || !dataConnection.open) {
                showNotification('ابتدا باید به مخاطب متصل شوید.');
                return;
            }
            
            if (isInCall) {
                endCall();
                return;
            }
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });
                
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('localVideoOverlay').style.display = 'none';
                
                const call = peer.call(friendCode, localStream, {
                    metadata: { type: 'video' }
                });
                
                mediaConnection = call;
                setupMediaCall(call, 'video');
                
                document.getElementById('videoCallBtn').style.display = 'none';
                document.getElementById('endVideoCallBtn').style.display = 'flex';
                
            } catch (err) {
                console.error('خطا در شروع تماس ویدیویی:', err);
                showNotification('دسترسی به دوربین ممکن نیست.');
            }
        }
        
        function setupMediaCall(call, type) {
            isInCall = true;
            
            call.on('stream', (stream) => {
                if (type === 'video') {
                    remoteStream = stream;
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('remoteVideoOverlay').style.display = 'none';
                } else {
                    // برای تماس صوتی، صدا را پخش می‌کنیم
                    const audio = new Audio();
                    audio.srcObject = stream;
                    audio.play();
                }
                
                showNotification(`✅ تماس ${type === 'video' ? 'ویدیویی' : 'صوتی'} برقرار شد.`);
            });
            
            call.on('close', () => {
                endCall();
            });
        }
        
        async function handleIncomingCall(call) {
            try {
                const metadata = call.metadata || {};
                
                if (metadata.type === 'video') {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: true
                    });
                    document.getElementById('localVideo').srcObject = localStream;
                    document.getElementById('localVideoOverlay').style.display = 'none';
                } else {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: false
                    });
                }
                
                call.answer(localStream);
                mediaConnection = call;
                
                call.on('stream', (stream) => {
                    if (metadata.type === 'video') {
                        remoteStream = stream;
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                        document.getElementById('remoteVideoOverlay').style.display = 'none';
                        setMode('video');
                    } else {
                        const audio = new Audio();
                        audio.srcObject = stream;
                        audio.play();
                        setMode('audio');
                    }
                    
                    isInCall = true;
                    
                    if (metadata.type === 'video') {
                        document.getElementById('videoCallBtn').style.display = 'none';
                        document.getElementById('endVideoCallBtn').style.display = 'flex';
                    } else {
                        document.getElementById('audioCallBtn').style.display = 'none';
                        document.getElementById('endCallBtn').style.display = 'flex';
                        document.getElementById('callStatus').textContent = '📞 در حال تماس صوتی...';
                    }
                    
                    showNotification(`📞 تماس ${metadata.type === 'video' ? 'ویدیویی' : 'صوتی'} دریافت شد.`);
                });
                
            } catch (err) {
                console.error('خطا در پاسخ به تماس:', err);
                call.close();
            }
        }
        
        function endCall() {
            if (mediaConnection) {
                mediaConnection.close();
                mediaConnection = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            if (remoteStream) {
                remoteStream.getTracks().forEach(track => track.stop());
                remoteStream = null;
            }
            
            isInCall = false;
            
            // بازنشانی کنترل‌های تماس
            document.getElementById('audioCallBtn').style.display = 'flex';
            document.getElementById('endCallBtn').style.display = 'none';
            document.getElementById('videoCallBtn').style.display = 'flex';
            document.getElementById('endVideoCallBtn').style.display = 'none';
            document.getElementById('callStatus').textContent = 'آماده برای تماس صوتی';
            
            // بازنشانی ویدیوها
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideoOverlay').style.display = 'flex';
            document.getElementById('remoteVideoOverlay').style.display = 'flex';
            
            setMode('text');
        }
        
        function toggleVideoMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('videoMuteBtn').innerHTML = 
                        audioTrack.enabled ? '<span>🎤</span>' : '<span>🔇</span>';
                }
            }
        }
        
        function toggleVideo() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    document.getElementById('videoToggleBtn').innerHTML = 
                        videoTrack.enabled ? '<span>📷</span>' : '<span>📵</span>';
                    document.getElementById('localVideoOverlay').style.display = 
                        videoTrack.enabled ? 'none' : 'flex';
                }
            }
        }

        // ==================== ارسال پیام‌ها ====================
        function sendMessage() {
            const input = document.getElementById('textInput');
            const message = input.value.trim();
            
            if (!message || !dataConnection || !dataConnection.open) return;
            
            const messageData = {
                type: 'text',
                content: message,
                sender: myCode,
                timestamp: new Date().toISOString()
            };
            
            dataConnection.send(messageData);
            addMessage(message, 'outgoing');
            input.value = '';
            input.focus();
        }
        
        function sendImage() {
            const input = document.getElementById('imageInput');
            if (!input.files[0] || !dataConnection || !dataConnection.open) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = {
                    type: 'image',
                    content: e.target.result,
                    name: input.files[0].name,
                    size: input.files[0].size,
                    sender: myCode,
                    timestamp: new Date().toISOString()
                };
                
                dataConnection.send(imageData);
                addMessage('📷 عکس ارسال شد', 'outgoing');
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('sendImageBtn').disabled = true;
            };
            reader.readAsDataURL(input.files[0]);
        }
        
        function sendFile() {
            const input = document.getElementById('fileInput');
            if (!input.files[0] || !dataConnection || !dataConnection.open) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = {
                    type: 'file',
                    content: e.target.result,
                    name: input.files[0].name,
                    size: input.files[0].size,
                    sender: myCode,
                    timestamp: new Date().toISOString()
                };
                
                dataConnection.send(fileData);
                addMessage(`📎 فایل "${input.files[0].name}" ارسال شد`, 'outgoing');
                document.getElementById('filePreview').innerHTML = '';
                document.getElementById('sendFileBtn').disabled = true;
            };
            reader.readAsDataURL(input.files[0]);
        }

        // ==================== مدیریت داده‌های دریافتی ====================
        function handleIncomingData(data) {
            switch (data.type) {
                case 'text':
                    addMessage(data.content, 'incoming');
                    break;
                    
                case 'image':
                    addMessage('📷 عکس دریافت شد', 'incoming');
                    break;
                    
                case 'file':
                    addMessage(`📎 فایل "${data.name}" دریافت شد`, 'incoming');
                    break;
                    
                case 'handshake':
                    addMessage('✅ مخاطب متصل شد', 'system');
                    break;
            }
        }

        // ==================== رابط کاربری ====================
        function setMode(mode) {
            if (isInCall && (mode !== 'audio' && mode !== 'video' && currentMode !== 'audio' && currentMode !== 'video')) {
                showNotification('⚠️ در حال تماس هستید. برای مدیریت تماس به حالت صدا یا ویدیو برگردید.');
                return;
            }
            
            currentMode = mode;
            
            // به‌روزرسانی دکمه‌های حالت
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // نمایش ناحیه مربوطه
            document.querySelectorAll('.input-area').forEach(area => area.classList.remove('active'));
            document.getElementById(`${mode}Area`).classList.add('active');
            
            // فوکوس روی ورودی متن
            if (mode === 'text') {
                setTimeout(() => {
                    document.getElementById('textInput').focus();
                }, 100);
            }
        }
        
        function addMessage(text, type) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            
            messageDiv.className = `message ${type}`;
            const time = new Date().toLocaleTimeString('fa-IR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageDiv.innerHTML = `
                <div>${text}</div>
                <small class="message-time">${time}</small>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function showNotification(text) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = text;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }
        
        function previewImage(file) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').innerHTML = `
                    <img src="${e.target.result}" style="max-width: 200px; border-radius: 10px;">
                    <p style="margin-top: 10px;">${file.name}</p>
                `;
                document.getElementById('sendImageBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        }
        
        function previewFile(file) {
            if (!file) return;
            
            document.getElementById('filePreview').innerHTML = `
                <div style="font-size: 3rem;">📄</div>
                <p style="font-weight: 600; margin: 10px 0;">${file.name}</p>
                <p>${formatBytes(file.size)}</p>
            `;
            document.getElementById('sendFileBtn').disabled = false;
        }
        
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 بایت';
            const k = 1024;
            const sizes = ['بایت', 'کیلوبایت', 'مگابایت', 'گیگابایت'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
        }
        
        function disconnect() {
            if (dataConnection) dataConnection.close();
            if (mediaConnection) mediaConnection.close();
            if (peer) peer.destroy();
            
            peer = null;
            dataConnection = null;
            mediaConnection = null;
            localStream = null;
            remoteStream = null;
            myCode = null;
            friendCode = null;
            isInCall = false;
            
            // بازنشانی فرم
            document.getElementById('myCodeInput').value = '';
            document.getElementById('friendCodeInput').value = '';
            document.getElementById('myCodeInput').disabled = false;
            document.getElementById('setCodeBtn').disabled = false;
            document.getElementById('connectBtn').disabled = true;
            
            // پاک کردن پیام‌ها
            document.getElementById('messagesContainer').innerHTML = `
                <div class="message system">
                    <p>👋 به چت مستقیم خوش آمدید! اکنون می‌توانید با مخاطب خود ارتباط برقرار کنید.</p>
                </div>
            `;
            
            showSetupPage();
        }

        // ==================== تنظیمات اولیه ====================
        document.addEventListener('DOMContentLoaded', function() {
            // ارسال با Enter
            document.getElementById('textInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            
            // جلوگیری از اسکرول روی inputهای عددی
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('wheel', e => e.preventDefault());
            });
            
            // مدیریت ارتفاع در موبایل
            function setAppHeight() {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--app-height', `${vh}px`);
            }
            
            setAppHeight();
            window.addEventListener('resize', setAppHeight);
        });
    </script>
</body>
