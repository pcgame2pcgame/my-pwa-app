<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>چت امن P2P | متن، صوت، تصویر، فایل</title>
    <style>
        /* Reset و تنظیمات پایه */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1a2a6c, #3a7bd5); color: #333; min-height: 100vh; padding: 10px; }
        
        /* کانتینر اصلی - کاملاً ریسپانسیو */
        .container {
            max-width: 100%;
            height: calc(var(--vh, 1vh) * 100 - 20px);
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        
        /* هدر */
        .header {
            background: linear-gradient(90deg, #0f3460, #533483);
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-radius: 24px 24px 0 0;
        }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .status { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; background: rgba(0,0,0,0.3); }
        
        /* ناحیه اصلی چت - با انعطاف برای کیبورد */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }
        
        /* نمایش پیام‌ها */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        /* استایل پیام‌ها */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            position: relative;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.local {
            align-self: flex-end;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .message.remote {
            align-self: flex-start;
            background: white;
            color: #333;
            border: 1px solid #dee2e6;
            border-bottom-left-radius: 6px;
        }
        .message.system {
            align-self: center;
            background: #fff3cd;
            color: #856404;
            font-size: 0.85rem;
            max-width: 90%;
            text-align: center;
            border-radius: 12px;
        }
        .message .time {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 5px;
            display: block;
        }
        
        /* کنترل‌های پایینی - حالت ثابت */
        .bottom-controls {
            background: white;
            border-top: 1px solid #e9ecef;
            padding: 15px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        /* ورودی‌ها و دکمه‌ها */
        input, button, select {
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
            font-size: 1rem;
            transition: all 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #4dabf7; box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.2); }
        button {
            background: linear-gradient(135deg, #40c9ff, #2b8aff);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 7px 14px rgba(43, 138, 255, 0.3); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        
        /* ردیف دکمه‌های حالت */
        .mode-buttons {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .mode-btn {
            flex: 1;
            min-width: 70px;
            padding: 14px 10px;
            font-size: 0.9rem;
        }
        .mode-btn.active { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        
        /* ناحیه‌های ورودی پویا */
        .input-section { display: none; }
        .input-section.active { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* پیش‌نمایش‌ها */
        .preview {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed #ced4da;
            text-align: center;
        }
        .preview img { max-width: 200px; max-height: 150px; border-radius: 8px; margin-top: 10px; }
        
        /* کنترل‌های رسانه */
        .media-controls { display: flex; flex-direction: column; gap: 15px; }
        .record-btn.recording {
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
        
        /* ویدیو */
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }
        .video-container video {
            width: 100%;
            display: block;
        }
        .video-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        /* تنظیمات ارتفاع داینامیک برای کیبورد */
        @media (max-height: 700px) {
            .container { height: calc(var(--vh, 1vh) * 100); border-radius: 0; }
            .header { padding: 14px 16px; }
            .main-content { padding: 12px; }
            .messages-area { padding: 12px; margin-bottom: 12px; }
            .bottom-controls { padding: 12px; }
            input, button, select { padding: 14px; }
        }
        
        /* اسکرول بار */
        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .messages-area::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        .messages-area::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <!-- هدر -->
        <header class="header">
            <h1><i class="icon">🔒</i> چت امن P2P</h1>
            <div class="status" id="status">🔴 قطع</div>
        </header>
        
        <!-- محتوای اصلی -->
        <main class="main-content">
            <!-- ناحیه نمایش پیام‌ها -->
            <div class="messages-area" id="messagesArea">
                <div class="message system">
                    <p>برای شروع، رمز ۸ رقمی مشترک را وارد و روی "شروع اتصال" کلیک کنید.</p>
                </div>
            </div>
            
            <!-- کنترل‌های پایینی ثابت -->
            <div class="bottom-controls">
                <!-- تنظیمات اتصال -->
                <div id="connectionPanel">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <input type="password" inputmode="numeric" maxlength="8" placeholder="رمز ۸ رقمی" id="sharedKey" style="flex: 2;">
                        <button onclick="initPeer()" id="initBtn" style="flex: 1;">شروع اتصال</button>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" placeholder="شناسه طرف مقابل" id="remoteId">
                        <button onclick="connectToPeer()" id="connectBtn" style="flex: 1;">اتصال</button>
                        <button onclick="copyMyId()" title="کپی شناسه">📋</button>
                    </div>
                </div>
                
                <!-- دکمه‌های انتخاب حالت -->
                <div class="mode-buttons">
                    <button class="mode-btn active" onclick="setMode('text')"><i>📝</i> متن</button>
                    <button class="mode-btn" onclick="setMode('audio')"><i>🎙️</i> صدا</button>
                    <button class="mode-btn" onclick="setMode('video')"><i>📹</i> ویدیو</button>
                    <button class="mode-btn" onclick="setMode('image')"><i>🖼️</i> عکس</button>
                    <button class="mode-btn" onclick="setMode('file')"><i>📎</i> فایل</button>
                </div>
                
                <!-- حالت متن -->
                <div class="input-section active" id="textSection">
                    <div style="display: flex; gap: 10px;">
                        <input type="text" placeholder="پیام شما..." id="textInput" style="flex: 1;">
                        <button onclick="sendText()">ارسال</button>
                    </div>
                </div>
                
                <!-- حالت صوتی -->
                <div class="input-section" id="audioSection">
                    <div class="media-controls">
                        <button id="recordBtn" onclick="toggleRecording()" class="record-btn"><i>🎤</i> شروع ضبط</button>
                        <div id="audioPreview" class="preview" style="display:none;">
                            <audio controls id="audioPlayer"></audio>
                        </div>
                        <button onclick="sendAudio()" id="sendAudioBtn" disabled>ارسال صدا</button>
                    </div>
                </div>
                
                <!-- حالت ویدیویی -->
                <div class="input-section" id="videoSection">
                    <div class="media-controls">
                        <button onclick="toggleVideoCall()" id="videoCallBtn"><i>📹</i> شروع تماس ویدیویی</button>
                        <div class="video-container">
                            <video id="localVideo" autoplay muted playsinline></video>
                            <div class="video-controls">
                                <button onclick="toggleVideoMute()" id="videoMuteBtn">میکروفن</button>
                                <button onclick="toggleVideo()" id="videoToggleBtn">دوربین</button>
                            </div>
                        </div>
                        <div class="video-container">
                            <video id="remoteVideo" autoplay playsinline></video>
                        </div>
                    </div>
                </div>
                
                <!-- حالت عکس -->
                <div class="input-section" id="imageSection">
                    <div class="media-controls">
                        <input type="file" accept="image/*" id="imageInput" hidden onchange="previewImage(this)">
                        <button onclick="document.getElementById('imageInput').click()"><i>📁</i> انتخاب عکس</button>
                        <div id="imagePreview" class="preview"></div>
                        <button onclick="sendImage()" id="sendImageBtn" disabled>ارسال عکس</button>
                    </div>
                </div>
                
                <!-- حالت فایل -->
                <div class="input-section" id="fileSection">
                    <div class="media-controls">
                        <input type="file" id="fileInput" hidden onchange="previewFile(this)">
                        <button onclick="document.getElementById('fileInput').click()"><i>📁</i> انتخاب فایل</button>
                        <div id="filePreview" class="preview"></div>
                        <button onclick="sendFile()" id="sendFileBtn" disabled>ارسال فایل</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- اسکریپت اصلی -->
    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let conn = null;
        let dataChannel = null;
        let sharedKey = '';
        let mediaRecorder = null;
        let audioChunks = [];
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        
        // ==================== تنظیمات اولیه ====================
        document.addEventListener('DOMContentLoaded', function() {
            // تنظیم ارتفاع دینامیک برای کیبورد موبایل
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            window.addEventListener('resize', () => {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            });
            
            // فعال کردن ارسال متن با Enter
            document.getElementById('textInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendText();
            });
        });
        
        // ==================== مدیریت حالت‌ها ====================
        function setMode(mode) {
            // غیرفعال کردن همه دکمه‌ها و بخش‌ها
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.input-section').forEach(section => section.classList.remove('active'));
            
            // فعال کردن حالت انتخاب شده
            document.querySelector(`.mode-btn:nth-child(${getModeIndex(mode)})`).classList.add('active');
            document.getElementById(`${mode}Section`).classList.add('active');
            
            // متوقف کردن رسانه اگر حالت تغییر کرد
            if (mode !== 'audio' && mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            if (mode !== 'video' && localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
        }
        
        function getModeIndex(mode) {
            const modes = ['text', 'audio', 'video', 'image', 'file'];
            return modes.indexOf(mode) + 1;
        }
        
        // ==================== اتصال P2P با PeerJS ====================
        function initPeer() {
            const key = document.getElementById('sharedKey').value;
            if (!key || key.length !== 8 || !/^\d+$/.test(key)) {
                alert('لطفاً یک رمز عددی ۸ رقمی وارد کنید.');
                return;
            }
            
            sharedKey = CryptoJS.SHA256(key).toString();
            
            // بارگذاری PeerJS از CDN
            if (typeof Peer === 'undefined') {
                loadScript('https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js', function() {
                    setupPeer();
                });
            } else {
                setupPeer();
            }
        }
        
        function setupPeer() {
            peer = new Peer({
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                debug: 2
            });
            
            peer.on('open', (id) => {
                updateStatus('🟢 آنلاین', 'green');
                addMessage('سیستم', `شناسه شما: <strong>${id}</strong>`);
                document.getElementById('initBtn').disabled = true;
                document.getElementById('sharedKey').disabled = true;
            });
            
            peer.on('connection', (connection) => {
                conn = connection;
                setupDataConnection();
            });
            
            peer.on('error', (err) => {
                updateStatus('🔴 خطا', 'red');
                addMessage('سیستم', `خطا: ${err.type}`);
            });
        }
        
        function connectToPeer() {
            const remoteId = document.getElementById('remoteId').value.trim();
            if (!remoteId || !peer) return alert('ابتدا اتصال را شروع کنید.');
            
            conn = peer.connect(remoteId);
            setupDataConnection();
        }
        
        // ==================== اتصال داده و رمزنگاری ====================
        function setupDataConnection() {
            conn.on('open', () => {
                updateStatus('🟢 متصل', 'green');
                addMessage('سیستم', `اتصال P2P با ${conn.peer} برقرار شد.`);
                
                // ایجاد کانال داده برای WebRTC
                setupWebRTC();
            });
            
            conn.on('data', (data) => {
                handleReceivedData(data);
            });
            
            conn.on('close', () => {
                updateStatus('🔴 قطع', 'red');
                addMessage('سیستم', 'اتصال قطع شد.');
            });
        }
        
        // ==================== رمزنگاری ====================
        function encryptData(data) {
            return CryptoJS.AES.encrypt(JSON.stringify(data), sharedKey).toString();
        }
        
        function decryptData(encrypted) {
            const bytes = CryptoJS.AES.decrypt(encrypted, sharedKey);
            return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
        }
        
        // ==================== WebRTC برای صدا و ویدیو ====================
        function setupWebRTC() {
            const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            peerConnection = new RTCPeerConnection(servers);
            
            // ایجاد کانال داده برای فایل و متن
            dataChannel = peerConnection.createDataChannel('chat');
            setupDataChannel();
            
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannel();
            };
            
            // مدیریت جریان‌های رسانه
            peerConnection.ontrack = (event) => {
                remoteStream = event.streams[0];
                document.getElementById('remoteVideo').srcObject = remoteStream;
            };
            
            // مبادله اطلاعات سیگنالینگ
            peerConnection.onicecandidate = (event) => {
                if (event.candidate && conn && conn.open) {
                    conn.send({ type: 'ice-candidate', candidate: event.candidate });
                }
            };
            
            conn.on('data', (data) => {
                if (typeof data === 'object' && data.type) {
                    handleSignalingData(data);
                }
            });
        }
        
        async function startVideoCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                conn.send({ type: 'offer', offer: offer });
                
                document.getElementById('videoCallBtn').innerHTML = '<i>📹</i> پایان تماس';
            } catch (err) {
                addMessage('سیستم', 'خطا در دسترسی به دوربین/میکروفن');
            }
        }
        
        // ==================== ارسال پیام‌ها ====================
        function sendText() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text || !dataChannel || dataChannel.readyState !== 'open') return;
            
            const message = {
                type: 'text',
                content: text,
                time: new Date().toLocaleTimeString('fa-IR')
            };
            
            dataChannel.send(encryptData(message));
            addMessage('شما', text);
            input.value = '';
        }
        
        function sendAudio() {
            if (audioChunks.length === 0 || !dataChannel) return;
            
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = () => {
                const message = {
                    type: 'audio',
                    content: reader.result,
                    time: new Date().toLocaleTimeString('fa-IR')
                };
                dataChannel.send(encryptData(message));
                addMessage('شما', 'پیام صوتی ارسال شد', true);
            };
            reader.readAsDataURL(audioBlob);
        }
        
        function sendImage() {
            const input = document.getElementById('imageInput');
            if (!input.files[0] || !dataChannel) return;
            
            const reader = new FileReader();
            reader.onload = () => {
                const message = {
                    type: 'image',
                    content: reader.result,
                    name: input.files[0].name,
                    time: new Date().toLocaleTimeString('fa-IR')
                };
                dataChannel.send(encryptData(message));
                addMessage('شما', 'عکس ارسال شد', true);
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('sendImageBtn').disabled = true;
            };
            reader.readAsDataURL(input.files[0]);
        }
        
        function sendFile() {
            const input = document.getElementById('fileInput');
            if (!input.files[0] || !dataChannel) return;
            
            const reader = new FileReader();
            reader.onload = () => {
                const message = {
                    type: 'file',
                    content: reader.result,
                    name: input.files[0].name,
                    size: input.files[0].size,
                    time: new Date().toLocaleTimeString('fa-IR')
                };
                dataChannel.send(encryptData(message));
                addMessage('شما', `فایل "${input.files[0].name}" ارسال شد`, true);
                document.getElementById('filePreview').innerHTML = '';
                document.getElementById('sendFileBtn').disabled = true;
            };
            reader.readAsDataURL(input.files[0]);
        }
        
        // ==================== رابط کاربری ====================
        function addMessage(sender, content, isMedia = false) {
            const area = document.getElementById('messagesArea');
            const msg = document.createElement('div');
            msg.className = `message ${sender === 'شما' ? 'local' : 'remote'}`;
            
            if (isMedia) {
                if (content.includes('عکس') || content.includes('فایل') || content.includes('صوتی')) {
                    msg.innerHTML = `<strong>${sender}:</strong> ${content}<br><small class="time">${new Date().toLocaleTimeString('fa-IR')}</small>`;
                } else if (content.startsWith('data:image')) {
                    msg.innerHTML = `<strong>${sender}:</strong><br><img src="${content}" style="max-width:200px;border-radius:8px;margin-top:8px;"><br><small class="time">${new Date().toLocaleTimeString('fa-IR')}</small>`;
                }
            } else {
                msg.innerHTML = `<strong>${sender}:</strong> ${content}<br><small class="time">${new Date().toLocaleTimeString('fa-IR')}</small>`;
            }
            
            area.appendChild(msg);
            area.scrollTop = area.scrollHeight;
        }
        
        function updateStatus(text, color) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.style.color = color;
        }
        
        function copyMyId() {
            if (!peer || !peer.id) return alert('ابتدا اتصال را شروع کنید.');
            navigator.clipboard.writeText(peer.id);
            addMessage('سیستم', 'شناسه شما کپی شد.');
        }
        
        // ==================== توابع کمکی ====================
        function loadScript(src, callback) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = callback;
            document.head.appendChild(script);
        }
        
        // بارگذاری CryptoJS
        if (typeof CryptoJS === 'undefined') {
            loadScript('https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js', function() {
                console.log('CryptoJS loaded');
            });
        }
    </script>
</body>
</html>
