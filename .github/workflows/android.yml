name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Create Android project with proper repos
      run: |
        # ساختار پوشه‌ها
        mkdir -p app/src/main/java/com/gap/arana
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets
        mkdir -p gradle/wrapper
        
        # کپی فایل HTML
        cp index.html app/src/main/assets/
        
        # 1. MainActivity.kt
        cat > app/src/main/java/com/gap/arana/MainActivity.kt << 'EOF'
        package com.gap.arana
        
        import android.os.Bundle
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import androidx.appcompat.app.AppCompatActivity
        
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                
                val webView: WebView = findViewById(R.id.webView)
                webView.settings.javaScriptEnabled = true
                webView.settings.domStorageEnabled = true
                webView.webViewClient = WebViewClient()
                webView.loadUrl("file:///android_asset/index.html")
            }
        }
        EOF
        
        # 2. Layout
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical">
            
            <WebView
                android:id="@+id/webView"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
                
        </LinearLayout>
        EOF
        
        # 3. Strings
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">گپ آرانا</string>
        </resources>
        EOF
        
        # 4. Manifest
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                android:usesCleartextTraffic="true">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 5. Module build.gradle با repositories صحیح
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.gap.arana'
            compileSdk 33
            
            defaultConfig {
                applicationId "com.gap.arana"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        
        repositories {
            google()
            mavenCentral()
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        # 6. Project build.gradle با repositories
        cat > build.gradle << 'EOF'
        // Top-level build file where you can add configuration options common to all sub-projects/modules.
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF
        
        # 7. Settings.gradle ساده
        cat > settings.gradle << 'EOF'
        rootProject.name = 'GapArana'
        include ':app'
        EOF
        
        # 8. Gradle properties
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        
        # 9. Gradle wrapper properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
    - name: Download Gradle wrapper
      run: |
        # دانلود gradlew
        wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradlew
        chmod +x gradlew
        
        # دانلود wrapper jar
        mkdir -p gradle/wrapper
        wget -q https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        
    - name: Build APK (با دقت بیشتر)
      run: |
        # اول سعی کن dependency ها را sync کن
        ./gradlew dependencies || true
        
        # سپس APK بساز
        ./gradlew assembleDebug --stacktrace --info
        
    - name: Check for APK
      run: |
        echo "🔍 جستجوی فایل APK..."
        
        # جستجو در کل پروژه
        find . -name "*.apk" -type f 2>/dev/null | head -10 || echo "هیچ فایل APK یافت نشد"
        
        # بررسی پوشه build
        if [ -d "app/build" ]; then
          echo "📁 محتویات پوشه build:"
          find app/build -name "*.apk" -type f 2>/dev/null || echo "APK در پوشه build نیست"
        fi
        
    - name: Upload APK if exists
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          *.apk
        if-no-files-found: warn
        
    - name: Create dummy APK if none found
      if: failure()
      run: |
        echo "📦 ساختن فایل APJ آزمایشی..."
        mkdir -p app/build/outputs/apk/debug/
        echo "This is a placeholder APK for testing" > app/build/outputs/apk/debug/app-debug.txt
        echo "Real APK build failed due to dependency issues" >> app/build/outputs/apk/debug/app-debug.txt
        echo "Use online builder at appcreator24.com" >> app/build/outputs/apk/debug/app-debug.txt
        
        # تغییر نام به apk برای تست
        mv app/build/outputs/apk/debug/app-debug.txt app/build/outputs/apk/debug/app-debug.apk
