<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>P2P WebRTC Chat (Single HTML)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      direction: rtl;
      background: #0f172a;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 1200px;
      margin: 12px;
      background: #020617;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .app-header {
      padding: 10px 16px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #0f172a, #111827);
    }
    .app-header-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #1d4ed8;
      color: #e5e7eb;
    }
    .status {
      font-size: 12px;
      color: #9ca3af;
    }

    .app-body {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.8fr);
      min-height: 0;
    }

    /* Left: chat */
    .chat-panel {
      border-left: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top left, #0b1120, #020617);
    }
    .chat-header {
      padding: 8px 12px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #9ca3af;
    }
    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg-row {
      display: flex;
      margin-bottom: 4px;
    }
    .msg-row.me {
      justify-content: flex-start;
    }
    .msg-row.peer {
      justify-content: flex-end;
    }
    .msg-bubble {
      max-width: 70%;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg-row.me .msg-bubble {
      background: #1d4ed8;
      color: #e5e7eb;
      border-bottom-left-radius: 2px;
    }
    .msg-row.peer .msg-bubble {
      background: #111827;
      color: #e5e7eb;
      border-bottom-right-radius: 2px;
    }
    .msg-meta {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 2px;
      text-align: left;
    }
    .msg-row.peer .msg-meta {
      text-align: right;
    }

    .chat-input-area {
      border-top: 1px solid #1f2937;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #020617;
    }
    .chat-input-row {
      display: flex;
      gap: 6px;
    }
    .input {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
    }
    .input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37,99,235,0.4);
    }
    .btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #111827;
      color: #e5e7eb;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn.primary {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }
    .btn.danger {
      background: #b91c1c;
      border-color: #b91c1c;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .file-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #9ca3af;
    }
    .file-row input[type="file"] {
      font-size: 11px;
      max-width: 180px;
    }
    .file-progress {
      font-size: 11px;
      color: #9ca3af;
    }

    /* Right: signaling + media */
    .right-panel {
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top right, #020617, #020617);
    }
    .section {
      padding: 8px 10px;
      border-bottom: 1px solid #1f2937;
    }
    .section-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .section-body {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    textarea {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 11px;
      padding: 6px;
      direction: ltr;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    textarea:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 1px rgba(37,99,235,0.4);
    }

    .media-panel {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
    }
    .media-controls {
      padding: 8px 10px;
      border-bottom: 1px solid #1f2937;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: #9ca3af;
    }
    .media-videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 8px;
    }
    .video-box {
      background: #020617;
      border-radius: 10px;
      border: 1px solid #1f2937;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 11px;
      color: #9ca3af;
    }
    .video-label {
      padding: 4px 6px;
      border-bottom: 1px solid #1f2937;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: 180px;
      background: #000;
      object-fit: cover;
    }

    @media (max-width: 900px) {
      .app-body {
        grid-template-columns: 1fr;
      }
      .chat-panel {
        border-left: none;
        border-top: 1px solid #1f2937;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="app-header-title">
      <span>چت P2P WebRTC (بدون سرور)</span>
      <span class="badge">Single HTML</span>
    </div>
    <div class="status" id="status">آماده</div>
  </div>

  <div class="app-body">
    <!-- Chat panel -->
    <div class="chat-panel">
      <div class="chat-header">
        <span>چت و فایل روی DataChannel</span>
        <span id="dcState">کانال داده: بسته</span>
      </div>
      <div class="chat-messages" id="messages"></div>
      <div class="chat-input-area">
        <div class="chat-input-row">
          <input id="msgInput" class="input" placeholder="پیام..." />
          <button id="btnSendMsg" class="btn primary">ارسال</button>
        </div>
        <div class="file-row">
          <input type="file" id="fileInput" />
          <button id="btnSendFile" class="btn">ارسال فایل</button>
          <span class="file-progress" id="fileProgress"></span>
        </div>
      </div>
    </div>

    <!-- Right panel: signaling + media -->
    <div class="right-panel">
      <div class="section">
        <div class="section-title">
          <span>سیگنالینگ دستی (بدون سرور)</span>
        </div>
        <div class="section-sub">
          یکی از شما «ایجاد Offer» را می‌زند، JSON را کپی می‌کند و برای طرف مقابل می‌فرستد.
          طرف مقابل آن را در «Remote SDP» می‌گذارد، Answer می‌سازد و JSON را برمی‌گرداند.
        </div>
        <div class="section-body">
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button id="btnCreateOffer" class="btn primary">۱) ایجاد Offer (Caller)</button>
            <button id="btnCreateAnswer" class="btn">۲) ساخت Answer از Remote</button>
            <button id="btnSetRemote" class="btn">۳) Set Remote SDP</button>
          </div>
          <label style="font-size:11px;">Local SDP (این را کپی و برای طرف مقابل بفرست):</label>
          <textarea id="localSdp" readonly></textarea>
          <label style="font-size:11px;">Remote SDP (از طرف مقابل بگیر و اینجا پیست کن):</label>
          <textarea id="remoteSdp"></textarea>
        </div>
      </div>

      <div class="media-panel">
        <div class="media-controls">
          <button id="btnCallAudio" class="btn">تماس صوتی</button>
          <button id="btnCallVideo" class="btn">تماس تصویری</button>
          <button id="btnHangup" class="btn danger">قطع تماس</button>
          <span id="mediaStatus">بدون تماس</span>
        </div>
        <div class="media-videos">
          <div class="video-box">
            <div class="video-label">Local</div>
            <video id="localVideo" autoplay playsinline muted></video>
          </div>
          <div class="video-box">
            <div class="video-label">Remote</div>
            <video id="remoteVideo" autoplay playsinline></video>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // --- WebRTC config ---
  const iceServers = [
    { urls: 'stun:stun.l.google.com:19302' },
  ];
  const CHUNK_SIZE = 16 * 1024;

  let pc = null;
  let dataChannel = null;
  let localStream = null;
  let remoteStream = null;
  let isCaller = false;

  // File receive state
  let incomingFileInfo = null;
  let incomingFileBuffer = [];
  let incomingFileReceivedSize = 0;

  // UI elements
  const statusEl = document.getElementById('status');
  const dcStateEl = document.getElementById('dcState');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const btnSendMsg = document.getElementById('btnSendMsg');
  const fileInput = document.getElementById('fileInput');
  const btnSendFile = document.getElementById('btnSendFile');
  const fileProgress = document.getElementById('fileProgress');

  const btnCreateOffer = document.getElementById('btnCreateOffer');
  const btnCreateAnswer = document.getElementById('btnCreateAnswer');
  const btnSetRemote = document.getElementById('btnSetRemote');
  const localSdpEl = document.getElementById('localSdp');
  const remoteSdpEl = document.getElementById('remoteSdp');

  const btnCallAudio = document.getElementById('btnCallAudio');
  const btnCallVideo = document.getElementById('btnCallVideo');
  const btnHangup = document.getElementById('btnHangup');
  const mediaStatus = document.getElementById('mediaStatus');
  const localVideo = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');

  function setStatus(msg) {
    console.log('[STATUS]', msg);
    statusEl.textContent = msg;
  }

  function setDcState(msg) {
    dcStateEl.textContent = 'کانال داده: ' + msg;
  }

  function addMessage(text, fromMe, meta = '') {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (fromMe ? 'me' : 'peer');
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    if (meta) {
      const m = document.createElement('div');
      m.className = 'msg-meta';
      m.textContent = meta;
      row.appendChild(m);
    }
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function createPeerConnection() {
    if (pc) {
      pc.close();
      pc = null;
    }
    pc = new RTCPeerConnection({ iceServers });

    pc.oniceconnectionstatechange = () => {
      console.log('ICE state:', pc.iceConnectionState);
    };
    pc.onconnectionstatechange = () => {
      console.log('PC state:', pc.connectionState);
      if (pc.connectionState === 'connected') {
        setStatus('P2P متصل شد');
      }
    };

    pc.onicegatheringstatechange = () => {
      console.log('ICE gathering:', pc.iceGatheringState);
      if (pc.iceGatheringState === 'complete') {
        if (pc.localDescription) {
          localSdpEl.value = JSON.stringify(pc.localDescription);
        }
      }
    };

    pc.ondatachannel = (event) => {
      console.log('DataChannel received');
      setupDataChannel(event.channel);
    };

    remoteStream = new MediaStream();
    remoteVideo.srcObject = remoteStream;
    pc.ontrack = (event) => {
      console.log('Remote track:', event.streams);
      event.streams[0].getTracks().forEach((t) => remoteStream.addTrack(t));
    };
  }

  function createDataChannel() {
    const channel = pc.createDataChannel('chat-file');
    setupDataChannel(channel);
  }

  function setupDataChannel(channel) {
    dataChannel = channel;
    dataChannel.onopen = () => {
      console.log('DataChannel open');
      setDcState('باز');
      addMessage('کانال داده باز شد', false, '');
    };
    dataChannel.onclose = () => {
      console.log('DataChannel closed');
      setDcState('بسته');
      addMessage('کانال داده بسته شد', false, '');
    };
    dataChannel.onerror = (e) => {
      console.error('DataChannel error:', e);
      setStatus('خطا در DataChannel');
    };
    dataChannel.onmessage = (event) => {
      handleDataChannelMessage(event.data);
    };
  }

  function handleDataChannelMessage(data) {
    if (typeof data === 'string') {
      try {
        const msg = JSON.parse(data);
        if (msg.kind === 'text') {
          addMessage(msg.text, false, new Date(msg.ts).toLocaleTimeString());
        } else if (msg.kind === 'file-info') {
          incomingFileInfo = msg;
          incomingFileBuffer = [];
          incomingFileReceivedSize = 0;
          fileProgress.textContent = `در حال دریافت: ${msg.name} (${msg.size} bytes)`;
        } else if (msg.kind === 'file-complete') {
          const blob = new Blob(incomingFileBuffer);
          const url = URL.createObjectURL(blob);
          const row = document.createElement('div');
          row.className = 'msg-row peer';
          const bubble = document.createElement('div');
          bubble.className = 'msg-bubble';
          const link = document.createElement('a');
          link.href = url;
          link.download = incomingFileInfo.name;
          link.textContent = `دریافت فایل: ${incomingFileInfo.name}`;
          link.style.color = '#93c5fd';
          bubble.appendChild(link);
          row.appendChild(bubble);
          messagesEl.appendChild(row);
          messagesEl.scrollTop = messagesEl.scrollHeight;

          fileProgress.textContent = 'دریافت فایل کامل شد';
          incomingFileInfo = null;
          incomingFileBuffer = [];
          incomingFileReceivedSize = 0;
        }
      } catch (e) {
        console.error('Error parsing message:', e);
      }
    } else if (data instanceof ArrayBuffer) {
      incomingFileBuffer.push(data);
      incomingFileReceivedSize += data.byteLength;
      if (incomingFileInfo) {
        fileProgress.textContent = `دریافت: ${incomingFileReceivedSize}/${incomingFileInfo.size}`;
      }
    }
  }

  async function createOffer() {
    isCaller = true;
    createPeerConnection();
    createDataChannel();
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      setStatus('در حال جمع‌آوری ICE برای Offer...');
    } catch (e) {
      console.error('Error creating offer:', e);
      setStatus('خطا در ایجاد Offer');
    }
  }

  async function createAnswerFromRemote() {
    if (!pc) createPeerConnection();
    try {
      const remote = JSON.parse(remoteSdpEl.value.trim());
      await pc.setRemoteDescription(new RTCSessionDescription(remote));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      setStatus('در حال جمع‌آوری ICE برای Answer...');
    } catch (e) {
      console.error('Error creating answer:', e);
      setStatus('خطا در ساخت Answer (Remote SDP را چک کن)');
    }
  }

  async function setRemoteFromText() {
    if (!pc) {
      setStatus('ابتدا Offer/Answer بساز');
      return;
    }
    try {
      const remote = JSON.parse(remoteSdpEl.value.trim());
      await pc.setRemoteDescription(new RTCSessionDescription(remote));
      setStatus('Remote SDP تنظیم شد');
    } catch (e) {
      console.error('Error setting remote:', e);
      setStatus('خطا در Set Remote (JSON را چک کن)');
    }
  }

  function sendTextMessage() {
    const text = msgInput.value.trim();
    if (!text || !dataChannel || dataChannel.readyState !== 'open') return;
    const payload = {
      kind: 'text',
      text,
      ts: Date.now(),
    };
    dataChannel.send(JSON.stringify(payload));
    addMessage(text, true, new Date(payload.ts).toLocaleTimeString());
    msgInput.value = '';
  }

  function sendFile() {
    if (!dataChannel || dataChannel.readyState !== 'open') {
      alert('کانال داده باز نیست');
      return;
    }
    const file = fileInput.files[0];
    if (!file) {
      alert('فایلی انتخاب نشده');
      return;
    }

    const info = {
      kind: 'file-info',
      name: file.name,
      size: file.size,
      type: file.type,
    };
    dataChannel.send(JSON.stringify(info));

    const reader = new FileReader();
    let offset = 0;

    reader.onerror = (err) => {
      console.error('FileReader error:', err);
      fileProgress.textContent = 'خطا در خواندن فایل';
    };

    reader.onload = (e) => {
      const buffer = e.target.result;
      dataChannel.send(buffer);
      offset += buffer.byteLength;
      fileProgress.textContent = `ارسال: ${offset}/${file.size}`;

      if (offset < file.size) {
        readSlice(offset);
      } else {
        dataChannel.send(JSON.stringify({ kind: 'file-complete' }));
        fileProgress.textContent = 'ارسال فایل کامل شد';
        addMessage(`فایل ارسال شد: ${file.name}`, true);
      }
    };

    function readSlice(o) {
      const slice = file.slice(o, o + CHUNK_SIZE);
      reader.readAsArrayBuffer(slice);
    }

    readSlice(0);
  }

  async function startCall(withVideo) {
    if (!pc) {
      alert('ابتدا Offer/Answer را رد و بدل کنید');
      return;
    }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: withVideo,
      });
      localVideo.srcObject = localStream;
      localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
      mediaStatus.textContent = withVideo ? 'تماس تصویری فعال' : 'تماس صوتی فعال';
    } catch (e) {
      console.error('Error getUserMedia:', e);
      alert('خطا در دسترسی به میکروفن/دوربین: ' + e.message);
    }
  }

  function hangup() {
    if (localStream) {
      localStream.getTracks().forEach((t) => t.stop());
      localStream = null;
      localVideo.srcObject = null;
    }
    if (remoteStream) {
      remoteStream.getTracks().forEach((t) => t.stop());
      remoteStream = null;
      remoteVideo.srcObject = null;
    }
    if (pc) {
      pc.getSenders().forEach((s) => pc.removeTrack(s));
    }
    mediaStatus.textContent = 'بدون تماس';
    setStatus('تماس قطع شد (فقط media متوقف شد، P2P برقرار است)');
  }

  // Event bindings
  btnCreateOffer.onclick = createOffer;
  btnCreateAnswer.onclick = createAnswerFromRemote;
  btnSetRemote.onclick = setRemoteFromText;
  btnSendMsg.onclick = sendTextMessage;
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendTextMessage();
    }
  });
  btnSendFile.onclick = sendFile;
  btnCallAudio.onclick = () => startCall(false);
  btnCallVideo.onclick = () => startCall(true);
  btnHangup.onclick = hangup;

  setStatus('آماده - یکی Offer بسازد، دیگری Answer');
  setDcState('بسته');
</script>
</body>
</html>
