<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>چت متنی P2P</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-surface: #334155;
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --border-color: #475569;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* صفحه راه‌اندازی */
        #setupPage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            transition: transform 0.5s ease;
        }

        #setupPage.hidden {
            transform: translateY(-100%);
        }

        .setup-card {
            background: var(--bg-surface);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .setup-logo {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .number-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1.2rem;
            text-align: center;
            font-family: monospace;
            transition: all 0.3s;
        }

        .number-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-success), #059669);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-danger), #dc2626);
            color: white;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* صفحه اصلی چت */
        #chatPage {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        #chatPage.active {
            display: flex;
        }

        /* لیست مخاطبین */
        #contactsPanel {
            width: 350px;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            height: 100vh;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
        }

        #contactsPanel.hidden {
            display: none;
        }

        .contacts-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid var(--border-color);
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .contact-item.active {
            background: rgba(139, 92, 246, 0.1);
            border-right: 4px solid var(--accent-primary);
        }

        .contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .contact-last-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
        }

        .contact-status.offline {
            background: #ef4444;
        }

        /* پنجره چت */
        #chatWindow {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-right: 350px;
        }

        #chatWindow.full-width {
            margin-right: 0;
        }

        /* هدر چت */
        .chat-header {
            background: var(--bg-surface);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-contact-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-to-contacts {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
            padding: 5px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.offline {
            background: var(--accent-danger);
            animation: none;
        }

        /* پیام‌ها */
        #messagesContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 70%;
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            animation: fadeIn 0.3s ease;
            position: relative;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.outgoing {
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.incoming {
            background: var(--bg-surface);
            color: var(--text-primary);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            margin: 10px auto;
            text-align: center;
            max-width: 90%;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 0.9rem;
        }

        .message-sender {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 4px;
            display: block;
            font-weight: 500;
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
            text-align: left;
        }

        /* پیام عکس */
        .message-image-container {
            max-width: 300px;
            margin-top: 8px;
            position: relative;
        }

        .message-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            display: block;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .image-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* کنترل‌های پایین */
        .chat-controls {
            background: var(--bg-surface);
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
        }

        .text-input-container {
            display: flex;
            gap: 10px;
        }

        #textInput {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            height: 50px;
            min-height: 50px;
            max-height: 150px;
        }

        #textInput:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .send-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .image-upload-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .image-upload-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .upload-area {
            text-align: center;
            padding: 20px;
            border: 2px dashed var(--border-color);
            border-radius: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
            background: rgba(139, 92, 246, 0.1);
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-success);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* مدال نمایش عکس */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .modal-image {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* مخاطب جدید */
        .add-contact-container {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .add-contact-form {
            display: flex;
            gap: 10px;
        }

        .add-contact-input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .add-contact-btn {
            background: linear-gradient(135deg, var(--accent-primary), #7c3aed);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: 600;
        }

        /* برای موبایل */
        @media (max-width: 768px) {
            #contactsPanel {
                width: 100%;
                position: fixed;
                z-index: 100;
            }

            #chatWindow {
                margin-right: 0;
            }

            .back-to-contacts {
                display: block;
            }

            .contact-item {
                padding: 12px 15px;
            }

            .contact-avatar {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <!-- صفحه راه‌اندازی -->
    <div id="setupPage">
        <div class="setup-card">
            <div class="setup-logo">💬</div>
            <h1 style="text-align: center; margin-bottom: 30px; color: var(--text-primary);">چت متنی P2P</h1>
            
            <div class="input-group">
                <label class="input-label">شماره تماس مجازی من:</label>
                <input type="number" class="number-input" id="myIdInput" 
                       placeholder="مثلاً: 123456" maxlength="9">
                <small style="display: block; margin-top: 5px; color: var(--text-secondary); text-align: center;">
                    این شماره شناسه شما خواهد بود
                </small>
            </div>
            
            <button class="btn btn-primary" onclick="initializePeer()" id="initBtn">
                <span>✅</span>
                <span>شروع چت</span>
            </button>
        </div>
    </div>

    <!-- صفحه اصلی چت -->
    <div id="chatPage">
        <!-- پنل مخاطبین -->
        <div id="contactsPanel">
            <div class="contacts-header">
                <h2>مخاطبین</h2>
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="myStatus">آنلاین</span>
                </div>
            </div>

            <div class="add-contact-container">
                <div class="add-contact-form">
                    <input type="number" class="add-contact-input" id="newContactInput" placeholder="شماره مخاطب جدید">
                    <button class="add-contact-btn" onclick="addNewContact()">+</button>
                </div>
            </div>

            <div class="contacts-list" id="contactsList">
                <!-- مخاطبین در اینجا نمایش داده می‌شوند -->
            </div>
        </div>

        <!-- پنجره چت -->
        <div id="chatWindow">
            <!-- هدر چت -->
            <div class="chat-header">
                <button class="back-to-contacts" onclick="showContacts()">←</button>
                <div class="chat-contact-info">
                    <div class="contact-avatar" id="currentContactAvatar">?</div>
                    <div>
                        <div id="currentContactName">مخاطب</div>
                        <div class="connection-status">
                            <div class="status-dot offline" id="chatStatusDot"></div>
                            <span id="currentContactStatus">مشاهده پیام‌ها</span>
                        </div>
                    </div>
                </div>
                <button class="btn btn-danger" onclick="disconnectFromContact()" style="padding: 10px 20px; font-size: 0.9rem;">
                    قطع ارتباط
                </button>
            </div>

            <!-- پیام‌ها -->
            <div id="messagesContainer">
                <div class="message system">
                    <p>👋 برای شروع گفتگو با یک مخاطب، روی آن کلیک کنید.</p>
                </div>
            </div>

            <!-- کنترل‌های چت -->
            <div class="chat-controls">
                <div class="text-input-container">
                    <button class="image-upload-btn" onclick="document.getElementById('imageInput').click()" title="ارسال عکس">
                        📷
                    </button>
                    <textarea id="textInput" placeholder="پیام خود را بنویسید..." 
                              onkeypress="handleKeyPress(event)" rows="1"></textarea>
                    <button class="send-button" onclick="sendMessage()" id="sendBtn" disabled>
                        <span>📤</span>
                    </button>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" 
                       onchange="handleImageSelect(this.files[0])">
            </div>
        </div>
    </div>

    <!-- مدال نمایش عکس -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <button class="close-modal" onclick="closeImageModal(event)">✕</button>
        <img class="modal-image" id="modalImage" src="">
    </div>

    <script>
        // ==================== متغیرهای اصلی ====================
        let peer = null;
        let myId = null;
        let currentContact = null; // مخاطب فعلی که چت با آن باز است
        let contacts = {}; // لیست مخاطبین
        let connections = {}; // اتصالات PeerJS برای هر مخاطب

        // ==================== راه‌اندازی اولیه ====================
        function initializePeer() {
            const myIdInput = document.getElementById('myIdInput').value.trim();
            
            if (!myIdInput || myIdInput.length < 3) {
                showNotification('لطفاً یک شماره معتبر (حداقل ۳ رقم) وارد کنید.');
                return;
            }
            
            myId = myIdInput.padStart(9, '0').slice(-9);
            
            // بارگذاری PeerJS
            if (typeof Peer === 'undefined') {
                loadPeerJS();
                return;
            }
            
            createPeer();
        }
        
        function loadPeerJS() {
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js';
            script.onload = createPeer;
            script.onerror = () => showNotification('خطا در بارگذاری کتابخانه PeerJS');
            document.head.appendChild(script);
        }
        
        function createPeer() {
            peer = new Peer(myId, {
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                debug: 2
            });
            
            peer.on('open', (id) => {
                console.log('Peer created with ID:', id);
                document.getElementById('initBtn').disabled = true;
                document.getElementById('myIdInput').disabled = true;
                
                // بارگذاری مخاطبین از localStorage
                loadContacts();
                
                // نمایش صفحه چت
                showChatPage();
                
                showNotification('✅ حساب شما ایجاد شد!');
            });
            
            peer.on('connection', (conn) => {
                handleIncomingConnection(conn);
            });
            
            peer.on('error', (err) => {
                console.error('PeerJS Error:', err);
                if (err.type !== 'peer-unavailable') {
                    showNotification(`خطا: ${err.type}`);
                }
            });
            
            peer.on('disconnected', () => {
                document.getElementById('statusDot').classList.add('offline');
                document.getElementById('myStatus').textContent = 'آفلاین';
            });
            
            peer.on('close', () => {
                showNotification('اتصال به سرور قطع شد');
            });
        }

        // ==================== مدیریت مخاطبین ====================
        function loadContacts() {
            const savedContacts = localStorage.getItem(`contacts_${myId}`);
            if (savedContacts) {
                contacts = JSON.parse(savedContacts);
                renderContactsList();
            }
        }
        
        function saveContacts() {
            localStorage.setItem(`contacts_${myId}`, JSON.stringify(contacts));
        }
        
        function addNewContact() {
            const newContactInput = document.getElementById('newContactInput');
            const contactNumber = newContactInput.value.trim();
            
            if (!contactNumber || contactNumber.length < 3) {
                showNotification('لطفاً شماره معتبر وارد کنید');
                return;
            }
            
            const formattedNumber = contactNumber.padStart(9, '0').slice(-9);
            
            if (formattedNumber === myId) {
                showNotification('نمی‌توانید خودتان را اضافه کنید!');
                return;
            }
            
            if (contacts[formattedNumber]) {
                showNotification('این مخاطب از قبل وجود دارد');
                return;
            }
            
            // اضافه کردن مخاطب جدید
            contacts[formattedNumber] = {
                number: formattedNumber,
                name: formattedNumber,
                lastMessage: '',
                lastMessageTime: null,
                messages: [],
                isOnline: false
            };
            
            saveContacts();
            renderContactsList();
            newContactInput.value = '';
            
            showNotification(`مخاطب ${formattedNumber} اضافه شد`);
        }
        
        function renderContactsList() {
            const contactsList = document.getElementById('contactsList');
            contactsList.innerHTML = '';
            
            Object.values(contacts).forEach(contact => {
                const contactElement = document.createElement('div');
                contactElement.className = 'contact-item';
                if (currentContact && currentContact.number === contact.number) {
                    contactElement.classList.add('active');
                }
                
                // گرفتن اول شماره برای آواتار
                const firstChar = contact.number.charAt(0);
                
                // نمایش آخرین پیام
                let lastMessage = 'هیچ پیامی وجود ندارد';
                let lastTime = '';
                
                if (contact.messages && contact.messages.length > 0) {
                    const lastMsg = contact.messages[contact.messages.length - 1];
                    if (lastMsg.type === 'image') {
                        lastMessage = '📷 عکس';
                    } else {
                        lastMessage = lastMsg.content.substring(0, 30);
                        if (lastMsg.content.length > 30) lastMessage += '...';
                    }
                    
                    const date = new Date(lastMsg.timestamp);
                    lastTime = date.toLocaleTimeString('fa-IR', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                }
                
                contactElement.innerHTML = `
                    <div class="contact-avatar">${firstChar}</div>
                    <div class="contact-info">
                        <div class="contact-name">${contact.name}</div>
                        <div class="contact-last-message">${lastMessage}</div>
                    </div>
                    <div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 5px;">${lastTime}</div>
                        <div class="contact-status ${contact.isOnline ? '' : 'offline'}"></div>
                    </div>
                `;
                
                contactElement.onclick = () => openChat(contact);
                contactsList.appendChild(contactElement);
            });
        }

        // ==================== مدیریت چت با مخاطب ====================
        function openChat(contact) {
            currentContact = contact;
            renderContactsList();
            
            // بروزرسانی اطلاعات مخاطب در هدر
            document.getElementById('currentContactName').textContent = contact.name;
            document.getElementById('currentContactAvatar').textContent = contact.number.charAt(0);
            document.getElementById('currentContactStatus').textContent = contact.isOnline ? 'آنلاین' : 'آفلاین';
            document.getElementById('chatStatusDot').classList.toggle('offline', !contact.isOnline);
            
            // نمایش پیام‌ها
            renderMessages();
            
            // فعال کردن دکمه ارسال اگر اتصال برقرار باشد
            document.getElementById('sendBtn').disabled = !contact.isOnline;
            
            // در موبایل، مخفی کردن لیست مخاطبین
            if (window.innerWidth <= 768) {
                document.getElementById('contactsPanel').classList.add('hidden');
                document.getElementById('chatWindow').classList.add('full-width');
            }
            
            // اگر قبلاً به این مخاطب متصل نیستیم، سعی در اتصال کنیم
            if (!contact.isOnline && !connections[contact.number]) {
                connectToContact(contact.number);
            }
        }
        
        function showContacts() {
            document.getElementById('contactsPanel').classList.remove('hidden');
            document.getElementById('chatWindow').classList.remove('full-width');
        }
        
        function connectToContact(contactNumber) {
            if (!peer || peer.disconnected) {
                showNotification('اتصال به سرور برقرار نیست');
                return;
            }
            
            if (connections[contactNumber]) {
                // اگر قبلاً اتصال داشتیم، آن را ببندیم
                connections[contactNumber].close();
            }
            
            showNotification(`در حال اتصال به ${contactNumber}...`);
            
            // ایجاد اتصال جدید
            const conn = peer.connect(contactNumber, {
                reliable: true,
                serialization: 'json'
            });
            
            setupConnection(conn, contactNumber);
            connections[contactNumber] = conn;
        }
        
        function handleIncomingConnection(conn) {
            const contactNumber = conn.peer;
            
            // اگر این مخاطب در لیست ما نیست، اضافه‌اش کن
            if (!contacts[contactNumber]) {
                contacts[contactNumber] = {
                    number: contactNumber,
                    name: contactNumber,
                    lastMessage: '',
                    lastMessageTime: null,
                    messages: [],
                    isOnline: true
                };
                saveContacts();
            }
            
            setupConnection(conn, contactNumber);
            connections[contactNumber] = conn;
            
            // بروزرسانی وضعیت آنلاین
            contacts[contactNumber].isOnline = true;
            
            // اگر چت با این مخاطب باز است، وضعیت را بروزرسانی کن
            if (currentContact && currentContact.number === contactNumber) {
                document.getElementById('currentContactStatus').textContent = 'آنلاین';
                document.getElementById('chatStatusDot').classList.remove('offline');
                document.getElementById('sendBtn').disabled = false;
            }
            
            showNotification(`${contactNumber} متصل شد`);
            renderContactsList();
        }
        
        function setupConnection(conn, contactNumber) {
            conn.on('open', () => {
                console.log(`Connected to ${contactNumber}`);
                
                // بروزرسانی وضعیت
                if (contacts[contactNumber]) {
                    contacts[contactNumber].isOnline = true;
                    
                    // اگر چت با این مخاطب باز است، وضعیت را بروزرسانی کن
                    if (currentContact && currentContact.number === contactNumber) {
                        document.getElementById('currentContactStatus').textContent = 'آنلاین';
                        document.getElementById('chatStatusDot').classList.remove('offline');
                        document.getElementById('sendBtn').disabled = false;
                    }
                }
                
                renderContactsList();
                
                // ارسال پیام سلام
                if (!contacts[contactNumber] || contacts[contactNumber].messages.length === 0) {
                    conn.send({
                        type: 'handshake',
                        sender: myId,
                        timestamp: Date.now()
                    });
                }
            });
            
            conn.on('data', (data) => {
                handleIncomingMessage(data, contactNumber);
            });
            
            conn.on('close', () => {
                console.log(`Connection closed with ${contactNumber}`);
                
                if (contacts[contactNumber]) {
                    contacts[contactNumber].isOnline = false;
                    
                    // اگر چت با این مخاطب باز است، وضعیت را بروزرسانی کن
                    if (currentContact && currentContact.number === contactNumber) {
                        document.getElementById('currentContactStatus').textContent = 'آفلاین';
                        document.getElementById('chatStatusDot').classList.add('offline');
                        document.getElementById('sendBtn').disabled = true;
                    }
                }
                
                delete connections[contactNumber];
                renderContactsList();
            });
            
            conn.on('error', (err) => {
                console.error(`Connection error with ${contactNumber}:`, err);
                
                if (contacts[contactNumber]) {
                    contacts[contactNumber].isOnline = false;
                    if (currentContact && currentContact.number === contactNumber) {
                        document.getElementById('sendBtn').disabled = true;
                    }
                }
                
                delete connections[contactNumber];
                renderContactsList();
            });
        }
        
        function disconnectFromContact() {
            if (!currentContact) return;
            
            const contactNumber = currentContact.number;
            
            if (connections[contactNumber]) {
                connections[contactNumber].close();
                delete connections[contactNumber];
            }
            
            if (contacts[contactNumber]) {
                contacts[contactNumber].isOnline = false;
            }
            
            document.getElementById('currentContactStatus').textContent = 'قطع ارتباط';
            document.getElementById('chatStatusDot').classList.add('offline');
            document.getElementById('sendBtn').disabled = true;
            
            renderContactsList();
            showNotification(`ارتباط با ${contactNumber} قطع شد`);
        }

        // ==================== ارسال و دریافت پیام‌ها ====================
        function sendMessage() {
            if (!currentContact) {
                showNotification('لطفاً ابتدا یک مخاطب انتخاب کنید');
                return;
            }
            
            const input = document.getElementById('textInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            if (!connections[currentContact.number] || !connections[currentContact.number].open) {
                showNotification('اتصال با مخاطب برقرار نیست');
                return;
            }
            
            const messageData = {
                type: 'text',
                content: message,
                sender: myId,
                receiver: currentContact.number,
                timestamp: Date.now()
            };
            
            // ارسال پیام
            connections[currentContact.number].send(messageData);
            
            // ذخیره پیام در تاریخچه
            saveMessage(currentContact.number, messageData);
            
            // نمایش پیام
            displayMessage(messageData, 'outgoing');
            
            // پاک کردن input
            input.value = '';
            input.style.height = '50px';
            
            // بروزرسانی لیست مخاطبین
            updateContactLastMessage(currentContact.number, message, 'text');
            renderContactsList();
        }
        
        function sendImageAsText(base64String) {
            if (!currentContact) {
                showNotification('لطفاً ابتدا یک مخاطب انتخاب کنید');
                return;
            }
            
            if (!connections[currentContact.number] || !connections[currentContact.number].open) {
                showNotification('اتصال با مخاطب برقرار نیست');
                return;
            }
            
            // ارسال عکس به صورت متن base64 با تگ مخصوص
            const imageData = {
                type: 'image',
                content: base64String,
                sender: myId,
                receiver: currentContact.number,
                timestamp: Date.now(),
                isBase64: true
            };
            
            connections[currentContact.number].send(imageData);
            
            // ذخیره پیام در تاریخچه
            saveMessage(currentContact.number, imageData);
            
            // نمایش پیام
            displayMessage(imageData, 'outgoing');
            
            // بروزرسانی لیست مخاطبین
            updateContactLastMessage(currentContact.number, '📷 عکس', 'image');
            renderContactsList();
            
            showNotification('📷 عکس ارسال شد');
        }
        
        function handleIncomingMessage(data, senderNumber) {
            // ذخیره پیام در تاریخچه
            saveMessage(senderNumber, data);
            
            // نمایش پیام اگر چت با این مخاطب باز است
            if (currentContact && currentContact.number === senderNumber) {
                displayMessage(data, 'incoming');
            }
            
            // بروزرسانی لیست مخاطبین
            if (data.type === 'image') {
                updateContactLastMessage(senderNumber, '📷 عکس', 'image');
            } else {
                updateContactLastMessage(senderNumber, data.content, 'text');
            }
            
            renderContactsList();
            
            // نمایش نوتیفیکیشن (اگر چت با این مخاطب باز نیست)
            if (!currentContact || currentContact.number !== senderNumber) {
                const contactName = contacts[senderNumber] ? contacts[senderNumber].name : senderNumber;
                const messagePreview = data.type === 'image' ? '📷 عکس جدید' : data.content.substring(0, 30);
                showNotification(`${contactName}: ${messagePreview}`);
            }
        }
        
        function saveMessage(contactNumber, messageData) {
            if (!contacts[contactNumber]) {
                contacts[contactNumber] = {
                    number: contactNumber,
                    name: contactNumber,
                    lastMessage: '',
                    lastMessageTime: null,
                    messages: [],
                    isOnline: true
                };
            }
            
            // اضافه کردن پیام به تاریخچه
            if (!contacts[contactNumber].messages) {
                contacts[contactNumber].messages = [];
            }
            
            contacts[contactNumber].messages.push(messageData);
            
            // محدود کردن تعداد پیام‌ها (آخرین 100 پیام)
            if (contacts[contactNumber].messages.length > 100) {
                contacts[contactNumber].messages = contacts[contactNumber].messages.slice(-100);
            }
            
            saveContacts();
        }
        
        function updateContactLastMessage(contactNumber, message, type) {
            if (contacts[contactNumber]) {
                contacts[contactNumber].lastMessage = message;
                contacts[contactNumber].lastMessageTime = Date.now();
            }
        }

        // ==================== نمایش پیام‌ها ====================
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            if (!currentContact || !contacts[currentContact.number] || !contacts[currentContact.number].messages) {
                container.innerHTML = `
                    <div class="message system">
                        <p>👋 برای شروع گفتگو پیامی ارسال کنید.</p>
                    </div>
                `;
                return;
            }
            
            const messages = contacts[currentContact.number].messages;
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="message system">
                        <p>👋 برای شروع گفتگو پیامی ارسال کنید.</p>
                    </div>
                `;
                return;
            }
            
            messages.forEach(message => {
                const direction = message.sender === myId ? 'outgoing' : 'incoming';
                displayMessage(message, direction, false);
            });
            
            container.scrollTop = container.scrollHeight;
        }
        
        function displayMessage(messageData, direction, scroll = true) {
            const container = document.getElementById('messagesContainer');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${direction}`;
            
            const time = new Date(messageData.timestamp).toLocaleTimeString('fa-IR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            if (messageData.type === 'image') {
                // نمایش عکس از base64
                messageDiv.innerHTML = `
                    <span class="message-sender">${messageData.sender === myId ? 'شما' : messageData.sender}</span>
                    <div class="message-image-container">
                        <div class="image-badge">📷 عکس</div>
                        <img src="${messageData.content}" 
                             class="message-image" 
                             onclick="showImageInModal('${messageData.content}')"
                             alt="عکس ارسالی">
                    </div>
                    <small class="message-time">${time}</small>
                `;
            } else {
                // نمایش متن معمولی
                messageDiv.innerHTML = `
                    <span class="message-sender">${messageData.sender === myId ? 'شما' : messageData.sender}</span>
                    <div>${escapeHtml(messageData.content)}</div>
                    <small class="message-time">${time}</small>
                `;
            }
            
            container.appendChild(messageDiv);
            
            if (scroll) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // ==================== مدیریت عکس‌ها ====================
        function handleImageSelect(file) {
            if (!file || !file.type.startsWith('image/')) {
                showNotification('لطفاً یک فایل عکس انتخاب کنید');
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) { // 5MB limit
                showNotification('حجم عکس باید کمتر از ۵ مگابایت باشد');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                // تبدیل عکس به base64
                const base64String = e.target.result;
                
                // ارسال عکس به صورت متن
                sendImageAsText(base64String);
            };
            
            reader.onerror = function() {
                showNotification('خطا در خواندن فایل عکس');
            };
            
            reader.readAsDataURL(file);
            
            // پاک کردن مقدار input فایل
            document.getElementById('imageInput').value = '';
        }
        
        function showImageInModal(base64String) {
            document.getElementById('modalImage').src = base64String;
            document.getElementById('imageModal').classList.add('active');
        }
        
        function closeImageModal(event) {
            if (event) {
                event.stopPropagation();
            }
            document.getElementById('imageModal').classList.remove('active');
        }

        // ==================== رابط کاربری ====================
        function showChatPage() {
            document.getElementById('setupPage').classList.add('hidden');
            document.getElementById('chatPage').classList.add('active');
            
            // تنظیم وضعیت آنلاین
            document.getElementById('statusDot').classList.remove('offline');
            document.getElementById('myStatus').textContent = 'آنلاین';
        }
        
        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
            
            // تنظیم ارتفاع خودکار textarea
            const textarea = e.target;
            textarea.style.height = '50px';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }
        
        function showNotification(text) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = text;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== تنظیمات اولیه ====================
        document.addEventListener('DOMContentLoaded', function() {
            // تست WebRTC
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showNotification('مرورگر شما از WebRTC پشتیبانی نمی‌کند. لطفاً از Chrome, Firefox یا Edge استفاده کنید.');
            }
            
            // جلوگیری از اسکرول روی inputهای عددی
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('wheel', e => e.preventDefault());
            });
            
            // تنظیم ارتفاع خودکار textarea
            const textarea = document.getElementById('textInput');
            textarea.addEventListener('input', function() {
                this.style.height = '50px';
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            });
            
            // بستن مدال عکس با کلیک خارج
            document.getElementById('imageModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeImageModal();
                }
            });
            
            // بستن مدال عکس با کلید Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeImageModal();
                }
            });
            
            // نمایش وضعیت اتصال
            setInterval(() => {
                if (peer && !peer.disconnected) {
                    document.getElementById('statusDot').classList.remove('offline');
                    document.getElementById('myStatus').textContent = 'آنلاین';
                }
            }, 5000);
            
            // بارگذاری PeerJS اگر قبلاً لود شده
            if (typeof Peer !== 'undefined') {
                console.log('PeerJS already loaded');
            }
        });
    </script>
</body>
</html>
